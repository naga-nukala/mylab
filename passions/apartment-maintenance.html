<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Apartment Maintenance Tracker</title>
<style>
  :root{
    --bg:#0f1210;
    --panel:#171b19;
    --panel2:#1e2321;
    --border:#2a2f2c;
    --text:#eef1ef;
    --muted:#9aa39d;
    --mint:#a7e8c5;
    --coral:#ff8c70;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:16px;
    padding-bottom:60px;
  }
  h1{font-size:20px;margin:0 0 16px;}
  h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}

  /* Month navigator */
  .monthnav{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
  }
  .monthnav button{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    width:38px;height:38px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }
  .monthnav .picker-wrap{
    position:relative;
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 10px;
    text-align:center;
  }
  .monthnav .picker-wrap .label{
    font-size:15px;
    font-weight:700;
    pointer-events:none;
  }
  .monthnav input[type="month"]{
    position:absolute;
    inset:0;
    opacity:0;
    width:100%;
    height:100%;
    cursor:pointer;
    border:none;
  }
  @media (hover:hover) and (pointer:fine){
    .monthnav button:hover{background:var(--panel2);}
  }

  .summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .summary .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 10px;
    text-align:center;
  }
  .summary .card .label{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .summary .card .value{font-size:16px;font-weight:700;}
  .summary .opening .value{color:var(--text);}
  .summary .received .value{color:var(--mint);}
  .summary .paid .value{color:var(--coral);}
  .summary .closing .value{color:var(--mint);}

  .section{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:18px;
  }
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .section-head h2{margin:0;}

  details.section{padding:0;overflow:hidden;}
  details.section summary{
    list-style:none;
    cursor:pointer;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  details.section summary::-webkit-details-marker{display:none;}
  details.section summary h2{margin:0;}
  details.section summary .chev{color:var(--muted);transition:transform .15s;}
  details[open].section summary .chev{transform:rotate(180deg);}
  details.section .inner{padding:0 14px 14px;}

  form{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;min-width:0;}
  input,select,textarea{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px;
    border-radius:8px;
    font-size:14px;
    width:100%;
    font-family:inherit;
  }
  input::placeholder,textarea::placeholder{color:var(--muted);}
  label.small{font-size:11px;color:var(--muted);margin-bottom:2px;display:block;}
  input[readonly]{opacity:.7;}

  .btn{
    background:var(--mint);
    color:#0f1210;
    border:none;
    padding:10px 14px;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn.cancel{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
  }

  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  li.item{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .item .info{min-width:0;}
  .item .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .item .amt{font-size:14px;font-weight:700;white-space:nowrap;}
  .item.outflow .amt{color:var(--coral);}

  .actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    width:30px;height:30px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn.danger{color:var(--coral);border-color:var(--coral);}
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{background:var(--panel);}
    .btn:hover{opacity:.9;}
  }

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0;}

  /* flat rows for this month's inflow entry */
  .flatrow{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    transition:border-color .15s;
  }
  .flatrow.has-amt{border-color:var(--mint);}
  .flatrow .flatname{font-size:14px;font-weight:600;margin-bottom:8px;}
  .flatrow .flatname .owner{color:var(--muted);font-weight:400;}
  .flatrow .row input{font-size:14px;}

  .flatrow.paid{border-color:var(--mint);}
  .flatrow.unpaid{border-color:var(--coral);}
  .flatrow .flatname{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .badge.paid{background:var(--mint);color:#0f1210;}
  .badge.unpaid,.badge.partial{background:var(--coral);color:#0f1210;}
  .carry{font-size:12px;color:var(--coral);margin-top:8px;}
  .summary .pending{grid-column:1 / -1;}
  .summary .pending .value{color:var(--coral);}
  .btn.small{padding:10px;font-size:13px;width:100%;}
  .hidden{display:none !important;}
  textarea#notesInput{min-height:90px;resize:vertical;}

  #toast{
    position:fixed;
    left:50%;bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<h1>Apartment Maintenance Tracker</h1>

<div class="monthnav">
  <button type="button" id="prevMonthBtn" title="Previous month">‹</button>
  <div class="picker-wrap">
    <div class="label" id="monthLabel">September 2026</div>
    <input type="month" id="monthPicker">
  </div>
  <button type="button" id="nextMonthBtn" title="Next month">›</button>
</div>

<div class="summary">
  <div class="card opening"><div class="label">Opening Balance</div><div class="value" id="openingVal">₹0</div></div>
  <div class="card received"><div class="label">Received</div><div class="value" id="receivedVal">₹0</div></div>
  <div class="card paid"><div class="label">Paid Out</div><div class="value" id="paidVal">₹0</div></div>
  <div class="card closing"><div class="label">Closing Balance</div><div class="value" id="closingVal">₹0</div></div>
  <div class="card pending"><div class="label">Total Pending (all flats, till this month)</div><div class="value" id="pendingVal">₹0</div></div>
</div>

<details class="section" id="pendingSection" open>
  <summary><h2>Pending Dues</h2><span class="chev">▾</span></summary>
  <div class="inner"><ul class="list" id="pendingList"></ul></div>
</details>

<!-- Opening balance override (only shown when no earlier month exists) -->
<div class="section" id="openingOverrideSection" style="display:none;">
  <h2>Starting Balance</h2>
  <label class="small">No earlier month found — enter the opening balance to start from</label>
  <input type="number" id="openingOverrideInput" placeholder="0" step="1">
</div>

<!-- FLATS MASTER -->
<details class="section" id="flatsSection">
  <summary><h2>Manage Flats</h2><span class="chev">▾</span></summary>
  <div class="inner">
    <form id="flatForm">
      <div class="row">
        <div>
          <label class="small">Flat No.</label>
          <input type="text" id="flatNo" placeholder="e.g. A-101" required>
        </div>
        <div>
          <label class="small">Owner Name</label>
          <input type="text" id="flatOwner" placeholder="e.g. R. Sharma" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label class="small">Monthly Maintenance</label>
          <input type="number" id="flatMaint" min="0" step="1" placeholder="0" required>
        </div>
      </div>
      <div class="row">
        <button type="submit" class="btn" id="flatSubmitBtn">Add Flat</button>
        <button type="button" class="btn cancel" id="flatCancelBtn" style="display:none;">Cancel</button>
      </div>
    </form>
    <ul class="list" id="flatsList"></ul>
  </div>
</details>

<!-- INFLOW (per flat, this month) -->
<details class="section" id="inflowSection" open>
  <summary><h2>Maintenance Received</h2><span class="chev">▾</span></summary>
  <div class="inner">
    <div id="inflowRows"></div>
  </div>
</details>

<!-- OUTFLOW -->
<div class="section">
  <h2>Bills &amp; Payments</h2>
  <form id="outflowForm">
    <div class="row">
      <div>
        <label class="small">Description</label>
        <input type="text" id="outDesc" placeholder="e.g. Watchman Salary" required>
      </div>
    </div>
    <div class="row">
      <div>
        <label class="small">Amount</label>
        <input type="number" id="outAmount" placeholder="0" min="0" step="1" required>
      </div>
      <div>
        <label class="small">Date</label>
        <input type="date" id="outDate" required>
      </div>
    </div>
    <div class="row">
      <button type="submit" class="btn" id="outSubmitBtn">Add Entry</button>
      <button type="button" class="btn cancel" id="outCancelBtn" style="display:none;">Cancel</button>
    </div>
  </form>
  <ul class="list" id="outflowList"></ul>
</div>

<!-- NOTES -->
<div class="section">
  <h2>Notes</h2>
  <textarea id="notesInput" placeholder="Reminders, observations for this month..."></textarea>
</div>

<div id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'as_aptmaintenance_v1';
  let state = { flats: [], months: {} };
  let currentMonth = todayMonthKey();
  let editingFlatId = null;
  let editingOutflowId = null;
  let pendingDelete = null; // {type, id}

  function todayISO(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function todayMonthKey(){ return todayISO().slice(0,7); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function emptyMonth(){ return { inflows:{}, outflows:[], notes:'', openingOverride:null }; }

  function getMonth(key){
    if(!state.months[key]) state.months[key] = emptyMonth();
    return state.months[key];
  }

  function daysInMonth(key){
    const [y,m] = key.split('-').map(Number);
    return new Date(y, m, 0).getDate();
  }
  function mapDateToMonth(dateStr, monthKey){
    let day = 1;
    if(dateStr){
      const parts = dateStr.split('-');
      if(parts.length===3) day = parseInt(parts[2],10) || 1;
    }
    day = Math.min(day, daysInMonth(monthKey));
    return monthKey + '-' + String(day).padStart(2,'0');
  }
  // If this month has no record yet, seed it from the previous month
  // (same flats/amounts and same bills) so the user only edits what changed.
  function entryDue(e){ return e ? ((e.due != null && e.due !== '') ? Number(e.due) : (Number(e.amount)||0)) : 0; }
  function monthKeys(){ return Object.keys(state.months).sort(); }
  function defaultRecvDate(){ return currentMonth === todayMonthKey() ? todayISO() : currentMonth + '-01'; }
  function ensureMonthDefaults(key){
    const keys = monthKeys();
    if(keys.length && key > keys[keys.length-1]){
      let k = shiftMonthKey(keys[keys.length-1], 1);
      while(k < key){ seedMonth(k); k = shiftMonthKey(k, 1); }
    }
    seedMonth(key);
  }
  function seedMonth(key){
    if(state.months[key]) return;
    const keys = monthKeys();
    const backward = keys.length && key < keys[0];
    const prev = state.months[shiftMonthKey(key, -1)];
    const month = emptyMonth();
    state.flats.forEach(f=>{
      const pe = prev && prev.inflows[f.id];
      const due = pe ? entryDue(pe) : (backward ? 0 : (Number(f.maintenance)||0));
      month.inflows[f.id] = { due, amount:'', date:'' };
    });
    if(prev){
      month.outflows = prev.outflows.map(o=>({ id: uid(), desc: o.desc, amount: o.amount, date: mapDateToMonth(o.date, key) }));
    }
    state.months[key] = month;
    save();
  }

  function shiftMonthKey(key, delta){
    const [y,m] = key.split('-').map(Number);
    const d = new Date(y, m-1+delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  function monthLabel(key){
    const [y,m] = key.split('-').map(Number);
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return months[m-1] + ' ' + y;
  }

  // ---- migration from older flat array-based version ----
  function migrateOldData(old){
    const flats = [];
    const months = {};
    function findOrCreateFlat(flatNo, owner){
      let f = flats.find(x=>x.flatNo===flatNo && x.owner===owner);
      if(!f){ f = {id: uid(), flatNo, owner}; flats.push(f); }
      return f;
    }
    (old.inflows||[]).forEach(inf=>{
      const flat = findOrCreateFlat(inf.flat, inf.owner);
      const mKey = (inf.date || todayISO()).slice(0,7);
      const month = months[mKey] || (months[mKey] = emptyMonth());
      month.inflows[flat.id] = { amount: Number(inf.amount)||0, date: inf.date || todayISO() };
    });
    (old.outflows||[]).forEach(o=>{
      const mKey = (o.date || todayISO()).slice(0,7);
      const month = months[mKey] || (months[mKey] = emptyMonth());
      month.outflows.push({ id: o.id || uid(), desc: o.desc, amount: Number(o.amount)||0, date: o.date || todayISO() });
    });
    return { flats, months };
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.flats) && parsed.months && typeof parsed.months === 'object'){
          state = parsed;
          state.flats.forEach(f=>{ if(f.maintenance == null){ let m = 0; Object.keys(state.months).sort().forEach(k=>{ const e = state.months[k].inflows[f.id]; if(e && entryDue(e) > 0) m = entryDue(e); }); f.maintenance = m; } });
        }else if(parsed && Array.isArray(parsed.inflows) && Array.isArray(parsed.outflows)){
          state = migrateOldData(parsed);
          save();
        }
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function fmtCurrency(n){
    const num = Number(n) || 0;
    const sign = num < 0 ? '-' : '';
    return sign + '₹' + Math.abs(num).toLocaleString('en-IN');
  }
  function ordinal(d){
    if(d>3 && d<21) return 'th';
    switch(d%10){case 1:return 'st';case 2:return 'nd';case 3:return 'rd';default:return 'th';}
  }
  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return '';
    const day = d.getDate();
    const monthsShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return day + ordinal(day) + ' ' + monthsShort[d.getMonth()] + ' ' + d.getFullYear();
  }

  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- balance chain ----
  function monthReceived(key){
    const m = state.months[key];
    if(!m) return 0;
    return Object.values(m.inflows).reduce((s,i)=>s+(Number(i.amount)||0),0);
  }
  function monthPaid(key){
    const m = state.months[key];
    if(!m) return 0;
    return m.outflows.reduce((s,o)=>s+(Number(o.amount)||0),0);
  }
  function computeOpening(key, guard){
    guard = guard || {};
    if(guard[key]) return 0; // cycle safety
    guard[key] = true;
    const prevKey = shiftMonthKey(key, -1);
    if(state.months[prevKey]){
      return computeClosing(prevKey, guard);
    }
    const m = state.months[key];
    return (m && m.openingOverride != null) ? Number(m.openingOverride) : 0;
  }
  function computeClosing(key, guard){
    return computeOpening(key, guard) + monthReceived(key) - monthPaid(key);
  }
  function hasPrevMonthData(key){
    return !!state.months[shiftMonthKey(key, -1)];
  }

  function monthShort(key){ return monthLabel(key).slice(0,3) + ' ' + key.slice(0,4); }
  function flatPending(flatId, uptoKey){
    let total = 0; const months = [];
    monthKeys().forEach(k=>{
      if(k > uptoKey) return;
      const e = state.months[k].inflows[flatId];
      if(!e) return;
      const p = entryDue(e) - (Number(e.amount)||0);
      total += p;
      if(p > 0) months.push(monthShort(k));
    });
    return {total, months};
  }
  function renderPending(){
    const ul = document.getElementById('pendingList');
    const rows = [];
    let sum = 0;
    state.flats.forEach(f=>{ const p = flatPending(f.id, currentMonth); if(p.total > 0){ sum += p.total; rows.push({f, p}); } });
    rows.sort((a,b)=>b.p.total - a.p.total);
    ul.innerHTML = rows.length ? '' : '<li class="empty">All flats are up to date.</li>';
    rows.forEach(({f,p})=>{
      const li = document.createElement('li');
      li.className = 'item outflow';
      li.innerHTML = `<div class="info"><div class="title">${escapeHtml(f.flatNo)} — ${escapeHtml(f.owner)}</div><div class="sub">${p.months.join(' · ')}</div></div><div class="amt">${fmtCurrency(p.total)}</div>`;
      ul.appendChild(li);
    });
    document.getElementById('pendingVal').textContent = fmtCurrency(sum);
  }
  function rowStatus(flatId){
    const e = getMonth(currentMonth).inflows[flatId];
    const due = entryDue(e), rec = Number(e && e.amount) || 0;
    if(due <= 0 && rec <= 0) return {cls:'', text:'No dues'};
    if(rec >= due) return {cls:'paid', text:'Paid'};
    if(rec <= 0) return {cls:'unpaid', text:'Not paid'};
    return {cls:'partial', text:'Partial · ' + fmtCurrency(due - rec) + ' left'};
  }
  function updateRow(row){
    const id = row.dataset.flatId;
    const s = rowStatus(id);
    row.classList.remove('paid','unpaid');
    if(s.cls === 'paid') row.classList.add('paid'); else if(s.cls) row.classList.add('unpaid');
    const b = row.querySelector('[data-role="badge"]');
    b.textContent = s.text; b.className = 'badge ' + s.cls;
    const p = flatPending(id, currentMonth);
    row.querySelector('[data-role="carry"]').textContent = p.total > 0 ? 'Total pending: ' + fmtCurrency(p.total) + (p.months.length > 1 ? ' (' + p.months.join(', ') + ')' : '') : '';
    row.querySelector('[data-action="mark-paid"]').classList.toggle('hidden', s.cls === 'paid' || entryDue(getMonth(currentMonth).inflows[id]) <= 0);
  }

  // ---- rendering ----
  function renderMonthNav(){
    document.getElementById('monthLabel').textContent = monthLabel(currentMonth);
    document.getElementById('monthPicker').value = currentMonth;
  }

  function renderSummary(){
    const opening = computeOpening(currentMonth);
    const received = monthReceived(currentMonth);
    const paid = monthPaid(currentMonth);
    const closing = opening + received - paid;
    document.getElementById('openingVal').textContent = fmtCurrency(opening);
    document.getElementById('receivedVal').textContent = fmtCurrency(received);
    document.getElementById('paidVal').textContent = fmtCurrency(paid);
    document.getElementById('closingVal').textContent = fmtCurrency(closing);

    renderPending();
    const overrideSection = document.getElementById('openingOverrideSection');
    const overrideInput = document.getElementById('openingOverrideInput');
    if(hasPrevMonthData(currentMonth)){
      overrideSection.style.display = 'none';
    }else{
      overrideSection.style.display = '';
      const m = getMonth(currentMonth);
      if(document.activeElement !== overrideInput){
        overrideInput.value = m.openingOverride != null ? m.openingOverride : '';
      }
    }
  }

  function renderFlatsList(){
    const ul = document.getElementById('flatsList');
    ul.innerHTML = '';
    if(state.flats.length === 0){
      ul.innerHTML = '<li class="empty">No flats added yet.</li>';
      return;
    }
    state.flats.slice().sort((a,b)=>a.flatNo.localeCompare(b.flatNo, undefined, {numeric:true})).forEach(f=>{
      const li = document.createElement('li');
      li.className = 'item';
      li.innerHTML = `
        <div class="info">
          <div class="title">${escapeHtml(f.flatNo)}</div>
          <div class="sub">${escapeHtml(f.owner)} · ${fmtCurrency(f.maintenance)}/month</div>
        </div>
        <div class="actions">
          <button class="icon-btn" data-action="edit-flat" data-id="${f.id}" title="Edit">✎</button>
          <button class="icon-btn danger" data-action="delete-flat" data-id="${f.id}" title="Delete">✕</button>
        </div>`;
      ul.appendChild(li);
    });
  }

  function renderInflowRows(){
    const wrap = document.getElementById('inflowRows');
    wrap.innerHTML = '';
    if(state.flats.length === 0){
      wrap.innerHTML = '<div class="empty">Add flats above first, then record what each flat pays.</div>';
      return;
    }
    const month = getMonth(currentMonth);
    state.flats.slice().sort((a,b)=>a.flatNo.localeCompare(b.flatNo, undefined, {numeric:true})).forEach(f=>{
      const entry = month.inflows[f.id] || {due:0, amount:'', date:''};
      const div = document.createElement('div');
      div.className = 'flatrow';
      div.dataset.flatId = f.id;
      div.innerHTML = `
        <div class="flatname"><span>${escapeHtml(f.flatNo)} <span class="owner">— ${escapeHtml(f.owner)}</span></span><span class="badge" data-role="badge"></span></div>
        <div class="row">
          <div><label class="small">Due</label><input type="number" min="0" step="1" placeholder="0" data-role="inflow-due" data-flat-id="${f.id}" value="${entryDue(entry)}"></div>
          <div><label class="small">Received</label><input type="number" min="0" step="1" placeholder="0" data-role="inflow-amount" data-flat-id="${f.id}" value="${entry.amount === '' ? '' : entry.amount}"></div>
        </div>
        <div class="row">
          <div><label class="small">Date received</label><input type="date" data-role="inflow-date" data-flat-id="${f.id}" value="${entry.date || ''}"></div>
          <div style="display:flex;align-items:flex-end;"><button type="button" class="btn small" data-action="mark-paid" data-flat-id="${f.id}">Mark paid</button></div>
        </div>
        <div class="carry" data-role="carry"></div>`;
      wrap.appendChild(div);
      updateRow(div);
    });
  }

  function renderOutflows(){
    const ul = document.getElementById('outflowList');
    ul.innerHTML = '';
    const month = getMonth(currentMonth);
    if(month.outflows.length === 0){
      ul.innerHTML = '<li class="empty">No entries yet.</li>';
      return;
    }
    month.outflows.slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')).forEach(item=>{
      const li = document.createElement('li');
      li.className = 'item outflow';
      li.dataset.id = item.id;
      li.innerHTML = `
        <div class="info">
          <div class="title">${escapeHtml(item.desc)}</div>
          <div class="sub">${fmtDate(item.date)}</div>
        </div>
        <div class="amt">${fmtCurrency(item.amount)}</div>
        <div class="actions">
          <button class="icon-btn" data-action="edit-outflow" data-id="${item.id}" title="Edit">✎</button>
          <button class="icon-btn danger" data-action="delete-outflow" data-id="${item.id}" title="Delete">✕</button>
        </div>`;
      ul.appendChild(li);
    });
  }

  function renderNotes(){
    const notesInput = document.getElementById('notesInput');
    if(document.activeElement !== notesInput){
      notesInput.value = getMonth(currentMonth).notes || '';
    }
  }

  function renderAll(){
    renderMonthNav();
    renderSummary();
    renderFlatsList();
    renderInflowRows();
    renderOutflows();
    renderNotes();
  }

  function goToMonth(key){
    ensureMonthDefaults(key);
    currentMonth = key;
    resetOutflowForm();
    renderAll();
  }

  // ---- month nav ----
  document.getElementById('prevMonthBtn').addEventListener('click', ()=> goToMonth(shiftMonthKey(currentMonth,-1)));
  document.getElementById('nextMonthBtn').addEventListener('click', ()=> goToMonth(shiftMonthKey(currentMonth,1)));
  document.getElementById('monthPicker').addEventListener('change', function(e){
    if(e.target.value) goToMonth(e.target.value);
  });

  document.getElementById('openingOverrideInput').addEventListener('input', function(e){
    const val = e.target.value === '' ? null : parseFloat(e.target.value);
    getMonth(currentMonth).openingOverride = val;
    save();
    renderSummary();
  });

  // ---- flats master ----
  const flatForm = document.getElementById('flatForm');
  const flatNoInput = document.getElementById('flatNo');
  const flatOwnerInput = document.getElementById('flatOwner');
  const flatMaintInput = document.getElementById('flatMaint');
  const flatSubmitBtn = document.getElementById('flatSubmitBtn');
  const flatCancelBtn = document.getElementById('flatCancelBtn');

  function resetFlatForm(){
    editingFlatId = null;
    flatForm.reset();
    flatSubmitBtn.textContent = 'Add Flat';
    flatCancelBtn.style.display = 'none';
  }

  flatForm.addEventListener('submit', function(e){
    e.preventDefault();
    const flatNo = flatNoInput.value.trim();
    const owner = flatOwnerInput.value.trim();
    const maint = parseFloat(flatMaintInput.value) || 0;
    if(!flatNo || !owner) return;

    if(editingFlatId){
      const f = state.flats.find(x=>x.id===editingFlatId);
      if(f){
        const old = Number(f.maintenance) || 0;
        f.flatNo = flatNo; f.owner = owner; f.maintenance = maint;
        if(old !== maint){
          monthKeys().forEach(k=>{ if(k >= currentMonth){ const en = state.months[k].inflows[f.id]; if(en && entryDue(en) === old && !(Number(en.amount) > 0)) en.due = maint; } });
        }
      }
      showToast('Flat updated');
    }else{
      const nf = {id: uid(), flatNo, owner, maintenance: maint};
      state.flats.push(nf);
      monthKeys().forEach(k=>{ if(k >= currentMonth) state.months[k].inflows[nf.id] = {due: maint, amount:'', date:''}; });
      showToast('Flat added');
    }
    save();
    resetFlatForm();
    renderFlatsList();
    renderInflowRows();
    renderSummary();
  });

  flatCancelBtn.addEventListener('click', resetFlatForm);

  document.getElementById('flatsList').addEventListener('click', function(e){
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;

    if(action === 'edit-flat'){
      const f = state.flats.find(x=>x.id===id);
      if(!f) return;
      editingFlatId = id;
      flatNoInput.value = f.flatNo;
      flatOwnerInput.value = f.owner;
      flatMaintInput.value = f.maintenance == null ? '' : f.maintenance;
      flatSubmitBtn.textContent = 'Save Changes';
      flatCancelBtn.style.display = 'inline-block';
      flatNoInput.focus();
    }

    if(action === 'delete-flat'){
      if(pendingDelete && pendingDelete.type==='flat' && pendingDelete.id===id){
        state.flats = state.flats.filter(x=>x.id!==id);
        Object.values(state.months).forEach(m=>{ delete m.inflows[id]; });
        pendingDelete = null;
        save();
        if(editingFlatId === id) resetFlatForm();
        renderFlatsList();
        renderInflowRows();
        renderSummary();
        showToast('Flat deleted');
      }else{
        pendingDelete = {type:'flat', id};
        btn.textContent = '✓?';
        showToast('Tap again to delete');
        setTimeout(()=>{
          if(pendingDelete && pendingDelete.id===id){ pendingDelete=null; }
          btn.textContent = '✕';
        }, 2500);
      }
    }
  });

  // ---- inflow rows (per flat, this month) ----
  document.getElementById('inflowRows').addEventListener('input', function(e){
    const el = e.target;
    const role = el.dataset.role;
    if(!role) return;
    const flatId = el.dataset.flatId;
    const month = getMonth(currentMonth);
    const entry = month.inflows[flatId] || {due:0, amount:'', date:''};
    if(entry.due == null) entry.due = entryDue(entry);
    if(role === 'inflow-due') entry.due = el.value === '' ? 0 : parseFloat(el.value);
    if(role === 'inflow-amount'){
      entry.amount = el.value === '' ? '' : parseFloat(el.value);
      if(entry.amount !== '' && !entry.date) entry.date = defaultRecvDate();
    }
    if(role === 'inflow-date') entry.date = el.value;
    month.inflows[flatId] = entry;
    save();
    renderSummary();
    const row = el.closest('.flatrow');
    if(row){
      updateRow(row);
      const d = row.querySelector('[data-role="inflow-date"]');
      if(entry.date && d.value !== entry.date) d.value = entry.date;
    }
  });

  document.getElementById('inflowRows').addEventListener('click', function(e){
    const btn = e.target.closest('button[data-action="mark-paid"]');
    if(!btn) return;
    const month = getMonth(currentMonth);
    const entry = month.inflows[btn.dataset.flatId] || {due:0, amount:'', date:''};
    if(entry.due == null) entry.due = entryDue(entry);
    entry.amount = entry.due;
    if(!entry.date) entry.date = defaultRecvDate();
    month.inflows[btn.dataset.flatId] = entry;
    save();
    const row = btn.closest('.flatrow');
    row.querySelector('[data-role="inflow-amount"]').value = entry.amount;
    row.querySelector('[data-role="inflow-date"]').value = entry.date;
    updateRow(row);
    renderSummary();
    showToast('Marked as paid');
  });

  // ---- outflow ----
  const outflowForm = document.getElementById('outflowForm');
  const outDesc = document.getElementById('outDesc');
  const outAmount = document.getElementById('outAmount');
  const outDate = document.getElementById('outDate');
  const outSubmitBtn = document.getElementById('outSubmitBtn');
  const outCancelBtn = document.getElementById('outCancelBtn');

  function resetOutflowForm(){
    editingOutflowId = null;
    outflowForm.reset();
    outDate.value = currentMonth === todayMonthKey() ? todayISO() : currentMonth + '-01';
    outSubmitBtn.textContent = 'Add Entry';
    outCancelBtn.style.display = 'none';
  }

  outflowForm.addEventListener('submit', function(e){
    e.preventDefault();
    const desc = outDesc.value.trim();
    const amount = parseFloat(outAmount.value);
    const date = outDate.value || todayISO();
    if(!desc || isNaN(amount)) return;
    const month = getMonth(currentMonth);

    if(editingOutflowId){
      const idx = month.outflows.findIndex(o=>o.id===editingOutflowId);
      if(idx>-1){ month.outflows[idx] = {...month.outflows[idx], desc, amount, date}; }
      showToast('Entry updated');
    }else{
      month.outflows.push({id: uid(), desc, amount, date});
      showToast('Entry added');
    }
    save();
    resetOutflowForm();
    renderOutflows();
    renderSummary();
  });

  outCancelBtn.addEventListener('click', resetOutflowForm);

  document.getElementById('outflowList').addEventListener('click', function(e){
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    const month = getMonth(currentMonth);

    if(action === 'edit-outflow'){
      const item = month.outflows.find(o=>o.id===id);
      if(!item) return;
      editingOutflowId = id;
      outDesc.value = item.desc;
      outAmount.value = item.amount;
      outDate.value = item.date;
      outSubmitBtn.textContent = 'Save Changes';
      outCancelBtn.style.display = 'inline-block';
      outDesc.focus();
    }

    if(action === 'delete-outflow'){
      if(pendingDelete && pendingDelete.type==='outflow' && pendingDelete.id===id){
        month.outflows = month.outflows.filter(o=>o.id!==id);
        pendingDelete = null;
        save();
        if(editingOutflowId === id) resetOutflowForm();
        renderOutflows();
        renderSummary();
        showToast('Entry deleted');
      }else{
        pendingDelete = {type:'outflow', id};
        btn.textContent = '✓?';
        showToast('Tap again to delete');
        setTimeout(()=>{
          if(pendingDelete && pendingDelete.id===id){ pendingDelete=null; }
          btn.textContent = '✕';
        }, 2500);
      }
    }
  });

  // ---- notes ----
  document.getElementById('notesInput').addEventListener('input', function(e){
    getMonth(currentMonth).notes = e.target.value;
    save();
  });

  // init
  load();
  ensureMonthDefaults(currentMonth);
  resetOutflowForm();
  renderAll();
})();
</script>
</body>
</html>
