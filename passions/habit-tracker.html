<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>21-Day Habit Tracker</title>
<style>
  :root{
    --bg:#0f0f10;
    --card:#1a1a1c;
    --card-2:#212124;
    --border:#2c2c30;
    --text:#ececec;
    --text-dim:#8f8f96;
    --mint:#a7e8c5;
    --coral:#ff8c70;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
    -webkit-tap-highlight-color:transparent;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(15,15,16,0.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;
    border-bottom:1px solid var(--border);
  }
  h1{margin:0 0 12px; font-size:17px; font-weight:600; letter-spacing:0.2px;}
  .overall-bar{
    height:8px; border-radius:999px; background:var(--card-2);
    overflow:hidden; border:1px solid var(--border);
  }
  .overall-fill{
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--mint),#8fd9b0);
    transition:width .35s ease;
  }
  .overall-text{
    margin-top:8px; font-size:12.5px; color:var(--text-dim);
    display:flex; justify-content:space-between;
  }
  main{max-width:520px; margin:0 auto; padding:16px;}

  #addForm{
    display:flex; gap:8px; margin-bottom:18px;
  }
  #nameInput{
    flex:1; padding:12px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--card);
    color:var(--text); font-size:15px; outline:none;
  }
  #nameInput:focus{border-color:var(--mint);}
  #addBtn{
    padding:0 18px; border-radius:10px; border:none;
    background:var(--mint); color:#0f0f10; font-weight:600;
    font-size:14px; cursor:pointer;
  }
  #cancelEdit{
    display:none; align-self:center; color:var(--text-dim);
    font-size:12.5px; text-decoration:underline; cursor:pointer;
    margin:-10px 0 14px; text-align:right;
  }

  .habit{
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:14px 14px 16px; margin-bottom:12px;
  }
  .habit.done{border-color:var(--mint);}
  .habit-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:8px; margin-bottom:8px;
  }
  .habit-name{font-size:15px; font-weight:600;}
  .habit-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .habit-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    background:none; border:none; color:var(--text-dim);
    font-size:13px; padding:4px 6px; cursor:pointer; border-radius:6px;
  }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{color:var(--text); background:var(--card-2);}
  }
  .icon-btn.danger{color:var(--coral);}
  .icon-btn.confirming{background:var(--coral); color:#1a0f0c; font-weight:600;}

  .mini-bar{
    height:5px; border-radius:999px; background:var(--card-2);
    overflow:hidden; margin-bottom:10px;
  }
  .mini-fill{height:100%; background:var(--mint); border-radius:999px; transition:width .3s ease;}

  .day-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:6px;
  }
  .day{
    aspect-ratio:1; border-radius:7px; border:1px solid var(--border);
    background:var(--card-2); color:var(--text-dim);
    font-size:10.5px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .day.filled{
    background:var(--mint); border-color:var(--mint); color:#0f0f10; font-weight:700;
  }
  .day.today{
    box-shadow:0 0 0 2px var(--coral);
  }
  .day.today.filled{
    box-shadow:0 0 0 2px var(--coral);
  }
  .day.disabled{
    opacity:.35; cursor:default; pointer-events:none;
  }
  @media (hover:hover) and (pointer:fine){
    .day:hover{border-color:var(--mint);}
  }

  .badge{
    font-size:11px; color:var(--mint); font-weight:600; margin-bottom:10px;
  }

  .empty{
    text-align:center; color:var(--text-dim); font-size:13.5px; padding:40px 20px;
  }

  #toast{
    position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--card-2); border:1px solid var(--border);
    color:var(--text); padding:10px 16px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease;
    z-index:30;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>21-Day Habit Tracker</h1>
  <div class="overall-bar"><div class="overall-fill" id="overallFill"></div></div>
  <div class="overall-text">
    <span id="overallText">Add a habit to start</span>
  </div>
</header>

<main>
  <form id="addForm">
    <input id="nameInput" type="text" placeholder="e.g. Drink water" maxlength="60" autocomplete="off">
    <button id="addBtn" type="submit">Add</button>
  </form>
  <div id="cancelEdit">Cancel edit</div>

  <div id="habitList"></div>
</main>

<div id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'as_habittracker_v1';
  const habitList = document.getElementById('habitList');
  const addForm = document.getElementById('addForm');
  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  const cancelEdit = document.getElementById('cancelEdit');
  const overallFill = document.getElementById('overallFill');
  const overallText = document.getElementById('overallText');
  const toastEl = document.getElementById('toast');

  let state = load();
  let editingId = null;
  let confirmingId = null;
  let confirmTimer = null;
  let toastTimer = null;

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { habits: [] };
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.habits)) return { habits: [] };
      return parsed;
    }catch(e){ return { habits: [] }; }
  }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function uid(){
    return (crypto.randomUUID ? crypto.randomUUID() : 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2));
  }

  function ordinal(n){
    const s = ['th','st','nd','rd'], v = n % 100;
    return n + (s[(v-20)%10] || s[v] || s[0]);
  }
  function formatDate(ts){
    const d = new Date(ts);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${ordinal(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }

  function showToast(msg){
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2000);
  }

  function renderOverall(){
    const total = state.habits.length * 21;
    const done = state.habits.reduce((s,h)=> s + h.days.filter(Boolean).length, 0);
    const pct = total ? Math.round((done/total)*100) : 0;
    overallFill.style.width = pct + '%';
    overallText.textContent = state.habits.length
      ? `${done}/${total} days done · ${pct}%`
      : 'Add a habit to start';
  }

  function habitCardHTML(h){
    const doneCount = h.days.filter(Boolean).length;
    const isComplete = doneCount === 21;
    const pct = Math.round((doneCount/21)*100);
    const isConfirming = confirmingId === h.id;

    const msPerDay = 24*60*60*1000;
    const startMidnight = new Date(h.createdAt); startMidnight.setHours(0,0,0,0);
    const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
    const todayIndex = Math.round((todayMidnight - startMidnight) / msPerDay);

    const dots = h.days.map((v,i) => {
      const isToday = i === todayIndex;
      const isFuture = i > todayIndex;
      return `<div class="day ${v ? 'filled' : ''} ${isToday ? 'today' : ''} ${isFuture ? 'disabled' : ''}" data-id="${h.id}" data-day="${i}">${v ? '✓' : i+1}</div>`;
    }).join('');

    return `
      <div class="habit ${isComplete ? 'done' : ''}" data-habit-id="${h.id}">
        <div class="habit-top">
          <div>
            <div class="habit-name">${escapeHTML(h.name)}</div>
            <div class="habit-sub">Started ${formatDate(h.createdAt)} · ${doneCount}/21</div>
          </div>
          <div class="habit-actions">
            <button class="icon-btn" data-action="edit" data-id="${h.id}" type="button">Edit</button>
            <button class="icon-btn danger ${isConfirming ? 'confirming' : ''}" data-action="delete" data-id="${h.id}" type="button">${isConfirming ? 'Tap again' : 'Delete'}</button>
          </div>
        </div>
        ${isComplete ? '<div class="badge">🎉 Completed</div>' : ''}
        <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
        <div class="day-grid">${dots}</div>
      </div>
    `;
  }

  function escapeHTML(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderList(){
    habitList.innerHTML = state.habits.length
      ? state.habits.map(habitCardHTML).join('')
      : `<div class="empty">No habits yet — add one above to start your 21-day run.</div>`;
  }

  function renderAll(){
    renderOverall();
    renderList();
  }

  addForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = nameInput.value.trim();
    if(!name) return;

    if(editingId){
      const h = state.habits.find(h => h.id === editingId);
      if(h) h.name = name;
      editingId = null;
      addBtn.textContent = 'Add';
      cancelEdit.style.display = 'none';
    } else {
      state.habits.unshift({
        id: uid(),
        name,
        days: new Array(21).fill(false),
        createdAt: Date.now()
      });
    }
    nameInput.value = '';
    save();
    renderAll();
  });

  cancelEdit.addEventListener('click', function(){
    editingId = null;
    nameInput.value = '';
    addBtn.textContent = 'Add';
    cancelEdit.style.display = 'none';
  });

  habitList.addEventListener('click', function(e){
    const dayEl = e.target.closest('[data-day]');
    if(dayEl){
      const h = state.habits.find(h => h.id === dayEl.dataset.id);
      if(h){
        const i = +dayEl.dataset.day;
        h.days[i] = !h.days[i];
        save();
        renderAll();
      }
      return;
    }

    const editBtn = e.target.closest('[data-action="edit"]');
    if(editBtn){
      const h = state.habits.find(h => h.id === editBtn.dataset.id);
      if(h){
        editingId = h.id;
        nameInput.value = h.name;
        addBtn.textContent = 'Save';
        cancelEdit.style.display = 'block';
        nameInput.focus();
      }
      return;
    }

    const delBtn = e.target.closest('[data-action="delete"]');
    if(delBtn){
      const id = delBtn.dataset.id;
      if(confirmingId === id){
        clearTimeout(confirmTimer);
        confirmingId = null;
        state.habits = state.habits.filter(h => h.id !== id);
        if(editingId === id){
          editingId = null;
          nameInput.value = '';
          addBtn.textContent = 'Add';
          cancelEdit.style.display = 'none';
        }
        save();
        renderAll();
        showToast('Habit deleted');
      } else {
        confirmingId = id;
        clearTimeout(confirmTimer);
        confirmTimer = setTimeout(()=>{ confirmingId = null; renderList(); }, 3000);
        renderList();
      }
      return;
    }
  });

  renderAll();
})();
</script>
</body>
</html>
