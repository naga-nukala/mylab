<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Checklist</title>
<style>
  :root{
    --bg:#0e1210;
    --card:#161b18;
    --card-2:#1c2220;
    --border:#242b28;
    --text:#eaf2ee;
    --text-dim:#8fa39a;
    --mint:#a7e8c5;
    --coral:#ff8c70;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 100px;}

  header{padding:8px 4px 18px;}
  header h1{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-0.01em;}
  header p{margin:0;color:var(--text-dim);font-size:13px;}

  .summary{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:16px 18px;margin-bottom:18px;
  }
  .summary .count{font-size:26px;font-weight:700;color:var(--mint);}
  .summary .count small{font-size:13px;color:var(--text-dim);font-weight:500;margin-left:4px;}
  .summary .bar{flex:1;height:6px;background:var(--card-2);border-radius:4px;margin:0 16px;overflow:hidden;}
  .summary .bar-fill{height:100%;background:var(--mint);border-radius:4px;transition:width .25s ease;}
  .summary .reset{
    background:none;border:none;color:var(--text-dim);font-size:12px;
    cursor:pointer;padding:6px 4px;white-space:nowrap;
  }
  @media (hover:hover) and (pointer:fine){
    .summary .reset:hover{color:var(--coral);}
  }

  ul#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}

  li.item{
    position:relative;
    overflow:hidden;
    border-radius:14px;
    background:var(--card);
    border:1px solid var(--border);
  }
  .item-row{
    display:flex;align-items:center;gap:12px;
    padding:13px 14px;
    background:var(--card);
    position:relative;z-index:2;
    transition:transform .18s ease;
    touch-action:pan-y;
  }
  .item.swiped .item-row{transform:translateX(-84px);}

  .del-slot{
    position:absolute;top:0;right:0;bottom:0;width:84px;
    display:flex;align-items:center;justify-content:center;
    background:var(--coral);z-index:1;
  }
  .del-btn{
    background:none;border:none;color:#241009;font-weight:700;font-size:13px;
    width:100%;height:100%;cursor:pointer;
  }
  .del-btn.armed{background:#241009;color:var(--coral);}

  .checkbox{
    flex:0 0 22px;width:22px;height:22px;border-radius:7px;
    border:2px solid var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.15s;
  }
  .checkbox svg{width:13px;height:13px;opacity:0;transition:.15s;}
  .checkbox.checked{background:var(--mint);border-color:var(--mint);}
  .checkbox.checked svg{opacity:1;}

  .item-text{
    flex:1;min-width:0;
    font-size:15px;line-height:1.3;
    background:none;border:none;color:var(--text);
    padding:4px 0;outline:none;font-family:inherit;
  }
  .item.done .item-text{color:var(--text-dim);text-decoration:line-through;}

  .add-bar{
    position:fixed;left:0;right:0;bottom:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .add-inner{
    max-width:520px;margin:0 auto;
    display:flex;gap:8px;
    background:var(--card-2);border:1px solid var(--border);
    border-radius:16px;padding:6px;
  }
  #newItem{
    flex:1;border:none;background:none;color:var(--text);
    font-size:15px;padding:10px 12px;outline:none;font-family:inherit;
    min-width:0;
  }
  #newItem::placeholder{color:var(--text-dim);}
  #addBtn{
    flex:0 0 auto;border:none;border-radius:12px;
    background:var(--mint);color:#0e1210;font-weight:700;font-size:20px;
    width:42px;height:42px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  @media (hover:hover) and (pointer:fine){
    #addBtn:hover{opacity:.9;}
  }

  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:40px 0;}

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);
    background:var(--card-2);border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:12px;font-size:13px;
    display:flex;align-items:center;gap:12px;
    opacity:0;pointer-events:none;transition:.2s ease;
    z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .toast button{background:none;border:none;color:var(--mint);font-weight:700;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Travel Checklist</h1>
    <p>Tap to check off. Swipe left to delete. Tap text to edit.</p>
  </header>

  <div class="summary">
    <div class="count"><span id="doneCount">0</span>/<span id="totalCount">0</span><small>packed</small></div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <button class="reset" id="resetBtn" type="button">Uncheck all</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="emptyMsg" style="display:none;">No items yet — add your first one below.</div>
</div>

<div class="add-bar">
  <div class="add-inner">
    <input id="newItem" type="text" placeholder="Add an item…" autocomplete="off">
    <button id="addBtn" type="button">+</button>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo" type="button">Undo</button>
</div>

<script>
const KEY = 'as_travelchecklist_v1';
const DEFAULT_ITEMS = [
  'Water bottle','Soap and Shampoo','Mobile Chargers','Tickets & ID Proofs',
  'Switch Off Gas, Fridge','Lock all the doors and windows','Close all the taps',
  'Plants','Flask','Towels and blankets','Brush, Paste and Comb',
  'If you are going for a specific reason, did you get all the stuff?'
];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return DEFAULT_ITEMS.map(t => ({ id: uid(), text: t, checked: false }));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

let state = load();
let lastDeleted = null;
let toastTimer = null;

const listEl = document.getElementById('list');
const emptyMsg = document.getElementById('emptyMsg');
const doneCountEl = document.getElementById('doneCount');
const totalCountEl = document.getElementById('totalCount');
const barFill = document.getElementById('barFill');

function updateSummary(){
  const total = state.length;
  const done = state.filter(i => i.checked).length;
  doneCountEl.textContent = done;
  totalCountEl.textContent = total;
  barFill.style.width = total ? (done/total*100)+'%' : '0%';
}

function checkIcon(){
  return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#0e1210" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function renderAll(){
  listEl.innerHTML = '';
  emptyMsg.style.display = state.length ? 'none' : 'block';
  state.forEach(item => listEl.appendChild(buildRow(item)));
  updateSummary();
}

function buildRow(item){
  const li = document.createElement('li');
  li.className = 'item' + (item.checked ? ' done' : '');
  li.dataset.id = item.id;
  li.innerHTML = `
    <div class="del-slot"><button class="del-btn" type="button" data-role="delete">Delete</button></div>
    <div class="item-row">
      <div class="checkbox ${item.checked?'checked':''}" data-role="check">${checkIcon()}</div>
      <input class="item-text" data-role="text" value="${item.text.replace(/"/g,'&quot;')}" spellcheck="false">
    </div>
  `;
  return li;
}

function showToast(msg, onUndo){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  const undoBtn = document.getElementById('toastUndo');
  undoBtn.style.display = onUndo ? 'inline-block' : 'none';
  undoBtn.onclick = () => { onUndo && onUndo(); hideToast(); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3500);
}
function hideToast(){ document.getElementById('toast').classList.remove('show'); }

// --- event delegation ---
listEl.addEventListener('click', e => {
  const checkEl = e.target.closest('[data-role="check"]');
  const delEl = e.target.closest('[data-role="delete"]');
  const li = e.target.closest('li.item');
  if(!li) return;
  const id = li.dataset.id;

  if(checkEl){
    const item = state.find(i => i.id === id);
    item.checked = !item.checked;
    li.classList.toggle('done', item.checked);
    checkEl.classList.toggle('checked', item.checked);
    checkEl.innerHTML = checkIcon();
    updateSummary();
    save();
    return;
  }

  if(delEl){
    if(!delEl.classList.contains('armed')){
      delEl.classList.add('armed');
      delEl.textContent = 'Confirm?';
      setTimeout(() => {
        delEl.classList.remove('armed');
        delEl.textContent = 'Delete';
      }, 2500);
      return;
    }
    const idx = state.findIndex(i => i.id === id);
    lastDeleted = { item: state[idx], idx };
    state.splice(idx,1);
    save();
    renderAll();
    showToast('Item deleted', () => {
      if(lastDeleted){
        state.splice(Math.min(lastDeleted.idx, state.length), 0, lastDeleted.item);
        save();
        renderAll();
      }
    });
  }
});

listEl.addEventListener('change', e => {
  if(e.target.dataset.role === 'text'){
    const li = e.target.closest('li.item');
    const item = state.find(i => i.id === li.dataset.id);
    const val = e.target.value.trim();
    if(val){ item.text = val; save(); }
    else{ e.target.value = item.text; }
  }
});

// swipe to reveal delete
let startX = 0, startY = 0, activeLi = null, dragging = false;
listEl.addEventListener('touchstart', e => {
  const li = e.target.closest('li.item');
  if(!li) return;
  document.querySelectorAll('li.item.swiped').forEach(el => { if(el!==li) el.classList.remove('swiped'); });
  activeLi = li;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  dragging = false;
}, {passive:true});

listEl.addEventListener('touchmove', e => {
  if(!activeLi) return;
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;
  if(Math.abs(dx) > Math.abs(dy)) dragging = true;
  if(dragging && dx < -20) activeLi.classList.add('swiped');
  if(dragging && dx > 20) activeLi.classList.remove('swiped');
}, {passive:true});

listEl.addEventListener('touchend', () => { activeLi = null; dragging = false; });

// add new item
function addItem(){
  const input = document.getElementById('newItem');
  const val = input.value.trim();
  if(!val) return;
  state.push({ id: uid(), text: val, checked: false });
  save();
  renderAll();
  input.value = '';
  input.focus();
}
document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('newItem').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); addItem(); }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state.forEach(i => i.checked = false);
  save();
  renderAll();
});

renderAll();
</script>
</body>
</html>
