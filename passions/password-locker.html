<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1412">
<title>Password Locker</title>
<style>
:root{--bg:#0f1412;--card:#171e1b;--line:#26302c;--tx:#e8f1ed;--mut:#8a9a93;--mint:#a7e8c5;--coral:#ff8c70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:16px;min-height:100vh}
#app{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px;color:var(--mint)}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input{width:100%;background:#0f1412;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px 12px;font-size:16px;outline:none}
input:focus{border-color:var(--mint)}
input[data-role=num]{letter-spacing:.4em;text-align:center;font-size:20px}
button{background:var(--mint);color:#0f1412;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
button.ghost{background:transparent;color:var(--mint);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--coral);border:1px solid var(--coral)}
button.danger[data-armed]{background:var(--coral);color:#0f1412}
.full{width:100%;margin-top:14px}
.err{color:var(--coral);min-height:20px;font-size:13px;margin-top:8px;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:22px;font-weight:700;color:var(--mint)}
.warn{color:var(--coral)}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row b{word-break:break-all}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;margin:6px 0;word-break:break-all}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btns button{padding:7px 12px}
.key{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:.08em;text-align:center;color:var(--mint);padding:16px 8px;background:#0f1412;border:1px dashed var(--mint);border-radius:12px;margin:12px 0;word-break:break-all}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.ov[hidden]{display:none}
.ov .card{width:100%;max-width:320px;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card);border:1px solid var(--mint);color:var(--tx);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (hover:hover) and (pointer:fine){button:hover{filter:brightness(1.12)}}
</style></head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const KEY='as_passwordlocker_v1',FKEY='as_passwordlocker_fails_v1',MAX=5,IDLE=120000,VIEW_MS=30000;
const $=s=>document.querySelector(s),app=$('#app');
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>btoa(Array.from(new Uint8Array(b),c=>String.fromCharCode(c)).join(''));
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const imp=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function derive(code,salt,iter=250000){
  const k=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,data){const iv=rnd(12);return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data))};}
const open=(key,o)=>crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},key,ub(o.ct));

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const fmt=iso=>{const[y,m,d]=iso.split('-').map(Number);return d+'th '+MON[m-1]+' '+y;};
const ago=iso=>{const[y,m,d]=iso.split('-').map(Number),[a,b,c]=today().split('-').map(Number);return Math.round((Date.UTC(a,b-1,c)-Date.UTC(y,m-1,d))/864e5);};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mask=p=>p.length<8?'•'.repeat(p.length):p.slice(0,3)+'•••••'+p.slice(-2);
const fails=()=>+localStorage.getItem(FKEY)||0,setFails=n=>localStorage.setItem(FKEY,String(n));
const getDb=()=>JSON.parse(localStorage.getItem(KEY));
let S=null,idleT,viewT,pinCb=null,pinFails=0,tT;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200);}
function err(m){const e=$('#err');if(e)e.textContent=m;}
const num=(id,len,ph)=>`<input id="${id}" data-role="num" type="password" inputmode="numeric" maxlength="${len}" autocomplete="off" placeholder="${ph}">`;
const recKey=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=rnd(20);let s='';r.forEach((b,i)=>{s+=A[b&31];if(i%5==4&&i<19)s+='-';});return s;};

async function save(){
  S.db.vault=await seal(S.mk,enc.encode(JSON.stringify({items:S.items,pin:S.pin})));
  localStorage.setItem(KEY,JSON.stringify(S.db));
}
async function load(raw){
  const db=getDb(),mk=await imp(raw),v=JSON.parse(dec.decode(await open(mk,db.vault)));
  S={db,raw:new Uint8Array(raw),mk,items:v.items,pin:v.pin,view:false,edit:null};
}

/* ---------- lock screens ---------- */
function lock(){S=null;clearTimeout(idleT);clearTimeout(viewT);lockUI(fails()>=MAX?'locked':'unlock');}
function lockUI(mode,extra){
  let h='<div class="card">';
  if(mode==='setup')h+=`<h1>🔐 Set up Password Locker</h1><p class="mut">Everything is encrypted on this device. Nothing leaves the browser.</p>
    <label>Passcode (6 digits)</label>${num('p1',6,'••••••')}<label>Confirm passcode</label>${num('p2',6,'••••••')}
    <label>View PIN (4 digits) — needed to see full passwords</label>${num('pin',4,'••••')}
    <button class="full" data-act="create">Create locker</button><div class="err" id="err"></div>`;
  else if(mode==='key')h+=`<h1>Save your recovery key</h1><p class="mut">This is the only way to reset a forgotten passcode. It is shown once. Write it down or store it somewhere safe.</p>
    <div class="key">${extra}</div><button class="ghost full" data-act="copykey" data-k="${extra}">Copy key</button>
    <button class="full" data-act="enter">I've saved it — open locker</button>`;
  else if(mode==='unlock')h+=`<h1>🔐 Password Locker</h1><label>Enter 6-digit passcode</label>${num('pc',6,'••••••')}
    <div class="err" id="err"></div><div class="bar"><span class="mut">${MAX-fails()} attempts left</span><button class="ghost" data-act="forgot">Forgot passcode?</button></div>`;
  else if(mode==='locked'||mode==='recover')h+=`<h1 class="${mode==='locked'?'warn':''}">${mode==='locked'?'🔒 Locked':'Reset passcode'}</h1>
    <p class="mut">${mode==='locked'?`Too many wrong attempts (${MAX}). `:''}Enter your recovery key to unlock and set a new passcode. Your saved passwords stay intact.</p>
    <label>Recovery key</label><input id="rk" autocomplete="off" autocapitalize="characters" placeholder="XXXXX-XXXXX-XXXXX-XXXXX">
    <button class="full" data-act="recover">Unlock with recovery key</button><div class="err" id="err"></div>
    <p class="mut" style="margin-top:14px">Lost the recovery key too? The only option is to erase everything and start fresh.</p>
    <button class="danger full" data-act="erase">Erase everything</button>
    ${mode==='recover'&&fails()<MAX?'<button class="ghost full" data-act="back">Back</button>':''}`;
  else if(mode==='newpass')h+=`<h1>Set a new passcode</h1><label>New passcode (6 digits)</label>${num('p1',6,'••••••')}<label>Confirm</label>${num('p2',6,'••••••')}
    <button class="full" data-act="newpass">Save new passcode</button><div class="err" id="err"></div>`;
  app.innerHTML=h+'</div>';
  const f=app.querySelector('input');if(f)f.focus();
}

async function tryUnlock(v){
  if(fails()>=MAX)return lockUI('locked');
  try{
    const db=getDb(),raw=await open(await derive(v,ub(db.sp)),db.wp);
    await load(raw);setFails(0);startApp();
  }catch(e){
    const f=fails()+1;setFails(f);
    if(f>=MAX)lockUI('locked');
    else{lockUI('unlock');err('Wrong passcode.');}
  }
}

/* ---------- main app ---------- */
function startApp(){
  app.innerHTML=`<div class="bar"><h1>🔐 Password Locker</h1><button class="ghost" data-act="lock">Lock now</button></div>
  <div class="card"><div class="grid"><div><div class="big" id="sCount">0</div><div class="mut">saved</div></div>
  <div><div class="big" id="sOld">0</div><div class="mut">not changed in 90+ days</div></div></div>
  <div class="btns"><button class="ghost" data-act="view" id="viewBtn">🔓 Full view (PIN)</button><button class="ghost" data-act="export">⬇ Export backup</button><button class="ghost" data-act="import">⬆ Import backup</button></div></div>
  <div class="ov" id="bkbox" hidden></div>
  <div class="card"><div class="bar"><b id="formTitle">Add password</b><span class="mut">Today: ${fmt(today())}</span></div>
  <label>Domain</label><input id="fDom" autocomplete="off" autocapitalize="none" placeholder="example.com">
  <label>Password</label><div class="bar"><input id="fPw" type="password" autocomplete="off" data-role="pw" placeholder="password"><button class="ghost" data-act="showpw" type="button">Show</button></div>
  <label>Last changed date</label><input id="fDate" type="date" max="${today()}" value="${today()}">
  <div class="btns"><button data-act="add" id="addBtn">Add</button><button class="ghost" data-act="cancel" id="cancelBtn" hidden>Cancel</button></div></div>
  <div id="list"></div>
  <div class="ov" id="pinbox" hidden><div class="card"><b>Enter 4-digit view PIN</b><div style="margin-top:10px">${num('pinin',4,'••••')}</div>
  <div class="err" id="pinerr"></div><button class="ghost full" data-act="pincancel">Cancel</button></div></div>`;
  renderList();bump();
}
function renderList(){
  const it=[...S.items].sort((a,b)=>b.added.localeCompare(a.added)||b.id-a.id);
  $('#sCount').textContent=it.length;
  const old=it.filter(i=>ago(i.changed)>=90).length,so=$('#sOld');so.textContent=old;so.className='big'+(old?' warn':'');
  $('#viewBtn').textContent=S.view?'🔒 Hide passwords':'🔓 Full view (PIN)';
  $('#list').innerHTML=it.length?it.map(i=>`<div class="card row" data-id="${i.id}">
    <div class="top"><b>${esc(i.domain)}</b><span class="mut">Added ${fmt(i.added)}</span></div>
    <div class="mono">${esc(S.view?i.pw:mask(i.pw))}</div>
    <div class="mut">Last changed ${fmt(i.changed)} · ${ago(i.changed)} days ago</div>
    <div class="btns"><button class="ghost" data-act="edit" data-id="${i.id}">Edit</button>${S.view?`<button class="ghost" data-act="copy" data-id="${i.id}">Copy</button>`:''}<button class="danger" data-act="del" data-id="${i.id}">Delete</button></div></div>`).join('')
    :'<div class="card mut">No passwords yet. Add your first one above.</div>';
}
function setView(on){
  S.view=on;clearTimeout(viewT);
  if(on){viewT=setTimeout(()=>{if(S){S.view=false;renderList();toast('Passwords hidden');}},VIEW_MS);toast('Full view for 30 seconds');}
  renderList();
}
function askPin(cb){pinCb=cb;$('#pinbox').hidden=false;$('#pinerr').textContent='';const p=$('#pinin');p.value='';p.focus();}
function checkPin(v){
  if(v===S.pin){pinFails=0;$('#pinbox').hidden=true;const cb=pinCb;pinCb=null;cb&&cb();}
  else{pinFails++;if(pinFails>=MAX){setFails(MAX);lock();return;}$('#pinerr').textContent='Wrong PIN. '+(MAX-pinFails)+' left.';$('#pinin').value='';}
}
function resetForm(){
  S.edit=null;$('#fDom').value='';$('#fPw').value='';$('#fPw').placeholder='password';$('#fDate').value=today();
  $('#formTitle').textContent='Add password';$('#addBtn').textContent='Add';$('#cancelBtn').hidden=true;
}
function openBk(mode){
  const o=$('#bkbox'),ex=mode==='export';o.hidden=false;o.dataset.mode=mode;
  o.innerHTML=`<div class="card"><b>${ex?'Export encrypted backup':'Import backup'}</b>
  ${ex?'':'<label>Backup file (.json)</label><input id="bkFile" type="file" accept=".json,application/json">'}
  <label>Backup passphrase${ex?' (12+ characters, different from your passcode)':''}</label><input id="bkPass" type="password" autocomplete="off">
  ${ex?'<label>Confirm passphrase</label><input id="bkPass2" type="password" autocomplete="off">':''}
  <div class="err" id="bkErr"></div><button class="full" data-act="bkgo">${ex?'Download backup':'Import'}</button>
  <button class="ghost full" data-act="bkcancel">Cancel</button></div>`;
}
async function bkGo(btn){
  const mode=$('#bkbox').dataset.mode,p=$('#bkPass').value,e=m=>{$('#bkErr').textContent=m;};
  if(mode==='export'){
    if(p.length<12)return e('Use at least 12 characters.');
    if(p!==$('#bkPass2').value)return e('Passphrases do not match.');
    btn.disabled=true;btn.textContent='Encrypting…';
    const salt=rnd(16),iter=600000;
    const o=await seal(await derive(p,salt,iter),enc.encode(JSON.stringify({items:S.items})));
    const blob=new Blob([JSON.stringify({app:'little-lab-password-locker',v:1,iter,salt:b64(salt),...o})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='password-locker-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    $('#bkbox').hidden=true;toast('Encrypted backup downloaded');
  }else{
    const f=$('#bkFile').files[0];if(!f)return e('Choose a backup file.');
    if(!p)return e('Enter the backup passphrase.');
    btn.disabled=true;btn.textContent='Decrypting…';
    try{
      const j=JSON.parse(await f.text());
      if(j.app!=='little-lab-password-locker'||!(j.iter>=1e5&&j.iter<=2e6))throw 0;
      const d=JSON.parse(dec.decode(await open(await derive(p,ub(j.salt),j.iter),j)));
      const have=new Set(S.items.map(i=>i.id)),ok=/^\d{4}-\d{2}-\d{2}$/;let n=0;
      for(const i of d.items){
        if(typeof i.domain==='string'&&typeof i.pw==='string'&&ok.test(i.added)&&ok.test(i.changed)&&!have.has(i.id)){
          S.items.push({id:i.id,domain:i.domain,pw:i.pw,added:i.added,changed:i.changed});have.add(i.id);n++;
        }
      }
      await save();renderList();$('#bkbox').hidden=true;toast(n+' imported, duplicates skipped');
    }catch(x){btn.disabled=false;btn.textContent='Import';e('Could not open — wrong passphrase or not a valid backup.');}
  }
}
function bump(){clearTimeout(idleT);if(S)idleT=setTimeout(()=>{lock();toast('Locked after inactivity');},IDLE);}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.role==='num'){
    t.value=t.value.replace(/\D/g,'');
    if(t.id==='pc'&&t.value.length===6)tryUnlock(t.value);
    if(t.id==='pinin'&&t.value.length===4)checkPin(t.value);
  }
  if(t.dataset.role==='pw'&&S&&S.edit)$('#fDate').value=today(); // changing password = changed today
  bump();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=+b.dataset.id;bump();
  if(a==='create'){
    const p1=$('#p1').value,p2=$('#p2').value,pin=$('#pin').value;
    if(!/^\d{6}$/.test(p1))return err('Passcode must be 6 digits.');
    if(p1!==p2)return err('Passcodes do not match.');
    if(!/^\d{4}$/.test(pin))return err('View PIN must be 4 digits.');
    b.disabled=true;b.textContent='Creating…';
    const raw=rnd(32),sp=rnd(16),sr=rnd(16),rk=recKey();
    const db={sp:b64(sp),sr:b64(sr)};
    db.wp=await seal(await derive(p1,sp),raw);
    db.wr=await seal(await derive(rk.replace(/-/g,''),sr),raw);
    S={db,raw,mk:await imp(raw),items:[],pin,view:false,edit:null};
    await save();setFails(0);lockUI('key',rk);
  }
  else if(a==='copykey'){try{await navigator.clipboard.writeText(b.dataset.k);toast('Recovery key copied');}catch(x){toast('Copy failed — write it down');}}
  else if(a==='enter')startApp();
  else if(a==='forgot')lockUI('recover');
  else if(a==='back')lock();
  else if(a==='recover'){
    const v=$('#rk').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    try{
      const db=getDb(),raw=await open(await derive(v,ub(db.sr)),db.wr);
      await load(raw);lockUI('newpass');
    }catch(x){err('Wrong recovery key.');}
  }
  else if(a==='newpass'){
    const p1=$('#p1').value,p2=$('#p2').value;
    if(!/^\d{6}$/.test(p1))return err('Passcode must be 6 digits.');
    if(p1!==p2)return err('Passcodes do not match.');
    const sp=rnd(16);S.db.sp=b64(sp);S.db.wp=await seal(await derive(p1,sp),S.raw);
    await save();setFails(0);startApp();toast('Passcode reset');
  }
  else if(a==='erase'){
    if(b.dataset.armed){localStorage.removeItem(KEY);localStorage.removeItem(FKEY);S=null;lockUI('setup');toast('Locker erased');}
    else{b.dataset.armed='1';b.textContent='Tap again to erase everything';toast('Tap again to confirm');setTimeout(()=>{delete b.dataset.armed;b.textContent='Erase everything';},3500);}
  }
  else if(a==='lock')lock();
  else if(a==='export')askPin(()=>openBk('export'));
  else if(a==='import')openBk('import');
  else if(a==='bkcancel')$('#bkbox').hidden=true;
  else if(a==='bkgo')bkGo(b);
  else if(a==='view')S.view?setView(false):askPin(()=>setView(true));
  else if(a==='pincancel'){pinCb=null;$('#pinbox').hidden=true;}
  else if(a==='showpw'){const p=$('#fPw');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Show':'Hide';}
  else if(a==='add'){
    const dom=$('#fDom').value.trim(),pw=$('#fPw').value,ch=$('#fDate').value||today();
    if(!dom)return toast('Enter a domain');
    if(S.edit){
      const it=S.items.find(i=>i.id===S.edit);it.domain=dom;it.changed=ch;if(pw)it.pw=pw;
      toast('Updated');
    }else{
      if(!pw)return toast('Enter a password');
      S.items.push({id:Date.now(),domain:dom,pw,added:today(),changed:ch});toast('Added');
    }
    await save();resetForm();renderList();
  }
  else if(a==='cancel')resetForm();
  else if(a==='edit'){
    const it=S.items.find(i=>i.id===id);S.edit=id;
    $('#fDom').value=it.domain;$('#fPw').value='';$('#fPw').placeholder='leave blank to keep current';$('#fDate').value=it.changed;
    $('#formTitle').textContent='Edit '+it.domain;$('#addBtn').textContent='Save changes';$('#cancelBtn').hidden=false;
    $('#fDom').scrollIntoView({behavior:'smooth',block:'center'});
  }
  else if(a==='copy'){
    const it=S.items.find(i=>i.id===id);
    try{await navigator.clipboard.writeText(it.pw);toast('Copied — clears in 30s');setTimeout(()=>navigator.clipboard.writeText('').catch(()=>{}),30000);}catch(x){toast('Copy failed');}
  }
  else if(a==='del'){
    if(b.dataset.armed){S.items=S.items.filter(i=>i.id!==id);await save();if(S.edit===id)resetForm();renderList();toast('Deleted');}
    else{b.dataset.armed='1';b.textContent='Tap again';toast('Tap again to delete');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Delete';}},3000);}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='rk')document.querySelector('[data-act=recover]').click();
  bump();
});

/* ---------- boot ---------- */
if(!localStorage.getItem(KEY))lockUI('setup');
else lock();
</script></body></html>
