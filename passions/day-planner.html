<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f10">
<title>Day Planner</title>
<style>
  :root{
    --bg:#0f0f10;
    --card:#1a1a1c;
    --card2:#212124;
    --border:#2b2b2e;
    --text:#eaeaea;
    --sub:#9a9a9e;
    --mint:#a7e8c5;
    --coral:#ff8c70;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:560px;margin:0 auto;padding:20px 16px 80px;}
  header h1{font-size:20px;margin:0;font-weight:700;}
  .header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  #exportBtn{
    background:var(--card);border:1px solid var(--border);color:var(--mint);
    border-radius:10px;width:36px;height:36px;font-size:15px;cursor:pointer;
  }
  @media (hover:hover) and (pointer:fine){
    #exportBtn:hover{border-color:var(--mint);}
  }

  .date-nav{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:8px;margin-bottom:16px;
  }
  .date-nav button{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;
  }
  .date-nav #dateLabel{flex:1;text-align:center;font-weight:600;font-size:14px;}
  .date-nav #todayBtn{
    width:auto;padding:0 12px;font-size:12px;color:var(--mint);border-color:var(--mint);
  }
  @media (hover:hover) and (pointer:fine){
    .date-nav button:hover{border-color:var(--mint);}
  }

  .summary-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:16px;margin-bottom:16px;
    display:flex;align-items:center;gap:18px;
  }
  .summary-stat{text-align:center;min-width:44px;}
  .summary-stat span{display:block;font-size:20px;font-weight:700;}
  .summary-stat label{display:block;font-size:11px;color:var(--sub);margin-top:2px;}
  .progress-wrap{flex:1;}
  .progress-bar{
    flex:1;height:8px;background:var(--card2);border-radius:6px;overflow:hidden;
  }
  #progressFill{height:100%;background:var(--mint);width:0%;transition:width .25s ease;}

  #taskForm{
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:14px;margin-bottom:18px;
  }
  #taskForm input[type="text"]{
    width:100%;background:var(--card2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px;margin-bottom:10px;
  }
  .form-row{display:flex;gap:8px;margin-bottom:10px;}
  .form-row input[type="time"],.form-row input[type="date"],.form-row select{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 8px;font-size:13px;flex:1;min-width:0;
    color-scheme:dark;
  }
  .remind-label{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
    margin-bottom:10px;cursor:pointer;
  }
  .remind-label input{accent-color:var(--mint);width:15px;height:15px;}
  #taskNotes{
    width:100%;background:var(--card2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px;
    resize:vertical;min-height:38px;margin-bottom:10px;font-family:inherit;
  }
  .form-actions{display:flex;gap:8px;}
  #submitBtn{
    flex:1;background:var(--mint);color:#0f0f10;border:none;border-radius:10px;
    padding:11px;font-size:14px;font-weight:700;cursor:pointer;
  }
  #cancelEdit{
    background:var(--card2);color:var(--sub);border:1px solid var(--border);
    border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;
  }
  @media (hover:hover) and (pointer:fine){
    #submitBtn:hover{opacity:.9;}
  }

  .group-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px;}

  .task-row{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:12px;margin-bottom:8px;
  }
  .task-row.done{opacity:.5;}
  .check{
    flex:none;width:22px;height:22px;border-radius:50%;
    border:2px solid var(--mint);margin-top:2px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .task-row.done .check{background:var(--mint);}
  .check svg{width:12px;height:12px;display:none;}
  .task-row.done .check svg{display:block;}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14px;word-break:break-word;}
  .task-row.done .task-title{text-decoration:line-through;color:var(--sub);}
  .task-meta{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap;}
  .badge-time{font-size:11px;color:var(--sub);}
  .badge-priority{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;}
  .badge-priority.low{background:rgba(167,232,197,0.12);color:var(--mint);}
  .badge-priority.medium{background:rgba(255,255,255,0.08);color:var(--sub);}
  .badge-priority.high{background:rgba(255,140,112,0.14);color:var(--coral);}
  .badge-remind{font-size:11px;color:var(--mint);}
  .task-notes{font-size:12px;color:var(--sub);margin-top:4px;word-break:break-word;}
  .task-actions{display:flex;gap:6px;flex:none;}
  .task-actions button{
    background:var(--card2);border:1px solid var(--border);color:var(--sub);
    border-radius:8px;width:30px;height:30px;font-size:13px;cursor:pointer;
  }
  .task-actions button.delete-btn.confirm{color:#fff;background:var(--coral);border-color:var(--coral);}
  @media (hover:hover) and (pointer:fine){
    .task-actions button:hover{color:var(--text);}
  }

  #calStrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:10px;scrollbar-width:thin;}
  .cal-day{flex:none;width:54px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:7px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .cal-day small{font-size:10px;color:var(--sub);}
  .cal-day b{font-size:13px;font-weight:600;white-space:nowrap;}
  .cal-day .cnt{font-style:normal;font-size:11px;min-height:18px;min-width:18px;line-height:18px;border-radius:9px;color:#0f0f10;font-weight:700;padding:0 5px;text-align:center;}
  .cal-day.has .cnt{background:var(--mint);}
  .cal-day.late .cnt{background:var(--coral);}
  .cal-day.today{border-color:var(--coral);}
  .cal-day.today small{color:var(--coral);font-weight:700;}
  .cal-day.sel{background:var(--card2);border-color:var(--mint);box-shadow:0 0 0 1px var(--mint);}
  .cal-day.mstart{margin-left:6px;}
  #tagToggle{flex:none;width:40px;background:var(--card2);border:1px solid var(--border);color:var(--mint);border-radius:10px;cursor:pointer;}
  #tagPanel{display:none;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;}
  #tagPanel.open{display:block;}
  #tagPanel .tag-row{display:flex;gap:8px;}
  #tagPanel .tag-row input[type="text"]{margin-bottom:0;flex:1;}
  #tagSave{background:var(--mint);color:#0f0f10;border:none;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer;}
  .tag-chip{display:inline-flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:3px 4px 3px 10px;font-size:12px;margin:8px 6px 0 0;}
  .tag-chip button{background:none;border:none;color:var(--sub);cursor:pointer;width:22px;height:22px;border-radius:50%;}
  .tag-chip button.confirm{background:var(--coral);color:#fff;}
  .badge-tag{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--mint);color:var(--mint);}
  .task-next{font-size:12px;color:var(--mint);margin-top:4px;word-break:break-word;}
  .grp{margin-bottom:8px;}
  .grp-h{width:100%;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:11px 12px;font-size:14px;cursor:pointer;text-align:left;}
  .chev{color:var(--sub);transition:transform .15s;}
  .grp.open .chev{transform:rotate(90deg);}
  .grp-t{flex:1;}
  .grp-t.late{color:var(--coral);}
  .grp-n{background:var(--card2);border-radius:10px;padding:1px 8px;font-size:12px;color:var(--sub);}
  .grp-b{padding:8px 0 0 10px;}
  .ov-empty{text-align:center;color:var(--sub);font-size:13px;padding:14px 0;}
  #emptyState{text-align:center;color:var(--sub);font-size:13px;padding:30px 0;display:none;}

  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;
    transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:20;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header class="header-row">
    <h1>Day Planner</h1>
    <button id="exportBtn" aria-label="Download backup">⬇</button>
  </header>

  <div id="calStrip"></div>

  <div class="date-nav">
    <button id="prevDay" aria-label="Previous day">‹</button>
    <div id="dateLabel">—</div>
    <button id="nextDay" aria-label="Next day">›</button>
    <button id="todayBtn">Today</button>
  </div>

  <div class="summary-card">
    <div class="summary-stat"><span id="totalCount">0</span><label>Total</label></div>
    <div class="summary-stat"><span id="doneCount">0</span><label>Done</label></div>
    <div class="summary-stat"><span id="pendingCount">0</span><label>Left</label></div>
    <div class="progress-bar"><div id="progressFill"></div></div>
  </div>

  <form id="taskForm">
    <input type="text" id="taskTitle" placeholder="Add a task..." autocomplete="off" required>
    <input type="text" id="taskNext" placeholder="Next action (optional)" autocomplete="off">
    <div class="form-row">
      <input type="date" id="taskDate">
      <input type="time" id="taskTime">
    </div>
    <div class="form-row">
      <select id="taskPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <select id="taskTag"></select>
      <button type="button" id="tagToggle" aria-label="Manage tags">🏷</button>
    </div>
    <div id="tagPanel">
      <div class="tag-row"><input type="text" id="tagInput" placeholder="New tag" autocomplete="off"><button type="button" id="tagSave">Add</button></div>
      <div id="tagChips"></div>
    </div>
    <div class="form-row">
      <select id="taskRepeat">
        <option value="">🔁 No repeat</option>
        <option value="daily">Repeat daily</option>
        <option value="weekdays">Repeat weekdays</option>
        <option value="weekly">Repeat weekly</option>
        <option value="monthly">Repeat monthly</option>
        <option value="yearly">Repeat yearly</option>
      </select>
    </div>
    <label class="remind-label"><input type="checkbox" id="taskRemind"> 🔔 Remind me at that time</label>
    <textarea id="taskNotes" placeholder="Notes (optional)"></textarea>
    <div class="form-actions">
      <button type="submit" id="submitBtn">Add task</button>
      <button type="button" id="cancelEdit" style="display:none">Cancel</button>
    </div>
  </form>

  <div id="groupTime"><div class="group-label" id="groupTimeLabel" style="display:none">Scheduled</div><div id="listTime"></div></div>
  <div id="groupAny"><div class="group-label" id="groupAnyLabel" style="display:none">Anytime</div><div id="listAny"></div></div>

  <div id="emptyState">No tasks yet for this day. Add one above.</div>

  <div class="group-label">Pending by tag</div>
  <div id="ovTag"></div>
  <div class="group-label">Pending by date</div>
  <div id="ovDate"></div>
</div>

<div id="toast"></div>

<script>
(function(){
  var STORAGE_KEY = "as_dayplanner_v1";
  var deleteArm = null; // id currently armed for delete confirm
  var editingId = null;
  var editingDate = null;
  var reminderTimeouts = {};

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function dateToStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayStr(){ return dateToStr(new Date()); }
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDateLabel(dateStr){
    var parts = dateStr.split("-");
    var y = parts[0], m = parseInt(parts[1],10)-1, d = parseInt(parts[2],10);
    var suf = (d%100>=11 && d%100<=13) ? "th" : (["th","st","nd","rd"][d%10] || "th");
    return d + suf + " " + MONTHS[m] + " " + y;
  }
  function nextOccurrence(dk, rep){
    var p = dk.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]);
    if(rep === "daily") d.setDate(d.getDate()+1);
    else if(rep === "weekdays"){ do{ d.setDate(d.getDate()+1); }while(d.getDay()===0 || d.getDay()===6); }
    else if(rep === "weekly") d.setDate(d.getDate()+7);
    else {
      var y = p[0] + (rep === "yearly" ? 1 : 0), m = p[1]-1 + (rep === "monthly" ? 1 : 0);
      d = new Date(y, m, Math.min(p[2], new Date(y, m+1, 0).getDate()));
    }
    return dateToStr(d);
  }
  function formatTime(t){
    if(!t) return "";
    var p = t.split(":"); var h = parseInt(p[0],10); var min = p[1];
    var suffix = h>=12 ? "PM" : "AM";
    var h12 = h % 12; if(h12===0) h12=12;
    return h12+":"+min+" "+suffix;
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.days){
          if(!Array.isArray(parsed.tags)) parsed.tags = ["Work","Personal","Home"];
          if(!parsed.open) parsed.open = {};
          return parsed;
        }
      }
    }catch(e){}
    return { activeDate: todayStr(), days: {}, tags: ["Work","Personal","Home"], open: {} };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn("Storage unavailable, running in-memory only.", e); }
    scheduleReminders();
  }

  var state = loadState();

  function getTasks(){
    return state.days[state.activeDate] || [];
  }
  function setTasks(arr){
    state.days[state.activeDate] = arr;
    saveState();
  }
  function getTasksForDate(d){
    return state.days[d] || [];
  }
  function setTasksForDate(d, arr){
    state.days[d] = arr;
    saveState();
  }

  function clearReminders(){
    Object.keys(reminderTimeouts).forEach(function(id){ clearTimeout(reminderTimeouts[id]); });
    reminderTimeouts = {};
  }
  function scheduleReminders(){
    clearReminders();
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    Object.keys(state.days).forEach(function(dateKey){
      state.days[dateKey].forEach(function(t){
        if(t.remind && t.time && !t.done){
          var target = new Date(dateKey + "T" + t.time + ":00");
          var delay = target.getTime() - Date.now();
          if(delay > 0 && delay < 2147483000){
            reminderTimeouts[t.id] = setTimeout(function(){
              try{ new Notification(t.title, { body: t.next ? ("Next: " + t.next) : (t.notes || ("Scheduled for " + formatTime(t.time))), tag: t.id }); }
              catch(e){}
            }, delay);
          }
        }
      });
    });
  }

  var dateLabel = document.getElementById("dateLabel");
  var totalCount = document.getElementById("totalCount");
  var doneCount = document.getElementById("doneCount");
  var pendingCount = document.getElementById("pendingCount");
  var progressFill = document.getElementById("progressFill");
  var listTime = document.getElementById("listTime");
  var listAny = document.getElementById("listAny");
  var groupTimeLabel = document.getElementById("groupTimeLabel");
  var groupAnyLabel = document.getElementById("groupAnyLabel");
  var emptyState = document.getElementById("emptyState");
  var taskForm = document.getElementById("taskForm");
  var taskTitle = document.getElementById("taskTitle");
  var taskDate = document.getElementById("taskDate");
  var taskTime = document.getElementById("taskTime");
  var taskPriority = document.getElementById("taskPriority");
  var taskRemind = document.getElementById("taskRemind");
  var taskRepeat = document.getElementById("taskRepeat");
  var taskNotes = document.getElementById("taskNotes");
  var submitBtn = document.getElementById("submitBtn");
  var cancelEdit = document.getElementById("cancelEdit");
  var toast = document.getElementById("toast");

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove("show"); }, 1800);
  }

  function checkSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#0f0f10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  }

  function renderList(){
    var tasks = getTasks().slice();
    var withTime = tasks.filter(function(t){ return !!t.time; }).sort(function(a,b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    var noTime = tasks.filter(function(t){ return !t.time; });

    groupTimeLabel.style.display = withTime.length ? "block" : "none";
    groupAnyLabel.style.display = noTime.length ? "block" : "none";
    emptyState.style.display = tasks.length ? "none" : "block";

    listTime.innerHTML = withTime.map(function(t){ return renderRow(t, state.activeDate, false); }).join("");
    listAny.innerHTML = noTime.map(function(t){ return renderRow(t, state.activeDate, false); }).join("");

    var total = tasks.length;
    var done = tasks.filter(function(t){ return t.done; }).length;
    totalCount.textContent = total;
    doneCount.textContent = done;
    pendingCount.textContent = total - done;
    progressFill.style.width = total ? Math.round((done/total)*100)+"%" : "0%";
    renderExtras();
  }

  function esc(s){
    return (s||"").replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function renderRow(t, dk, showDate){
    var confirmClass = (deleteArm === t.id) ? " confirm" : "";
    var deleteLabel = (deleteArm === t.id) ? "✓" : "✕";
    return (
      '<div class="task-row'+(t.done?' done':'')+'" data-id="'+t.id+'" data-date="'+dk+'">'+
        '<div class="check" data-action="toggle" data-id="'+t.id+'">'+checkSvg()+'</div>'+
        '<div class="task-body">'+
          '<div class="task-title">'+esc(t.title)+'</div>'+
          '<div class="task-meta">'+
            (t.time ? '<span class="badge-time">'+formatTime(t.time)+'</span>' : '')+
            '<span class="badge-priority '+t.priority+'">'+t.priority+'</span>'+
            (t.remind ? '<span class="badge-remind">🔔</span>' : '')+
            (t.repeat ? '<span class="badge-remind">🔁 '+t.repeat+'</span>' : '')+
            (t.tag ? '<span class="badge-tag">'+esc(t.tag)+'</span>' : '')+
            (showDate ? '<span class="badge-time">'+formatDateLabel(dk)+'</span>' : '')+
          '</div>'+
          (t.next ? '<div class="task-next">→ '+esc(t.next)+'</div>' : '')+
          (t.notes ? '<div class="task-notes">'+esc(t.notes)+'</div>' : '')+
        '</div>'+
        '<div class="task-actions">'+
          '<button data-action="edit" data-id="'+t.id+'">✎</button>'+
          '<button class="delete-btn'+confirmClass+'" data-action="delete" data-id="'+t.id+'">'+deleteLabel+'</button>'+
        '</div>'+
      '</div>'
    );
  }

  function renderHeader(){
    dateLabel.textContent = formatDateLabel(state.activeDate);
    calSync();
  }

  function renderAll(){
    renderHeader();
    renderList();
  }

  function resetForm(){
    taskTitle.value = "";
    taskDate.value = state.activeDate;
    taskTime.value = "";
    taskPriority.value = "medium";
    taskRepeat.value = "";
    taskRemind.checked = false;
    taskNotes.value = "";
    taskNext.value = "";
    taskTag.value = "";
    editingId = null;
    editingDate = null;
    submitBtn.textContent = "Add task";
    cancelEdit.style.display = "none";
  }

  function shiftDate(days){
    var parts = state.activeDate.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+days);
    state.activeDate = dateToStr(d);
    saveState();
    deleteArm = null;
    if(!editingId) taskDate.value = state.activeDate;
    renderAll();
  }

  document.getElementById("exportBtn").addEventListener("click", function(){
    try{
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var d = new Date();
      a.href = url;
      a.download = "day-planner-backup-" + dateToStr(d) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      showToast("Backup downloaded");
    }catch(e){
      showToast("Download failed");
    }
  });

  document.getElementById("prevDay").addEventListener("click", function(){ shiftDate(-1); });
  document.getElementById("nextDay").addEventListener("click", function(){ shiftDate(1); });
  document.getElementById("todayBtn").addEventListener("click", function(){
    state.activeDate = todayStr();
    saveState();
    deleteArm = null;
    if(!editingId) taskDate.value = state.activeDate;
    renderAll();
  });

  taskForm.addEventListener("submit", function(e){
    e.preventDefault();
    var title = taskTitle.value.trim();
    if(!title) return;
    var targetDate = taskDate.value || state.activeDate;
    var remind = taskRemind.checked;

    if(editingId){
      var srcArr = getTasksForDate(editingDate);
      var existing = srcArr.find(function(t){ return t.id === editingId; });
      var updated = {
        id: editingId, title:title, time:taskTime.value, priority:taskPriority.value,
        notes:taskNotes.value.trim(), done: existing ? existing.done : false, remind:remind, next:taskNext.value.trim(), tag:taskTag.value,
        repeat:taskRepeat.value, nextId: existing ? existing.nextId : "", nextDate: existing ? existing.nextDate : ""
      };
      setTasksForDate(editingDate, srcArr.filter(function(t){ return t.id !== editingId; }));
      var destArr = getTasksForDate(targetDate).slice();
      destArr.push(updated);
      setTasksForDate(targetDate, destArr);
      showToast(targetDate === editingDate ? "Task updated" : "Moved to " + formatDateLabel(targetDate));
    } else {
      var arr = getTasksForDate(targetDate).slice();
      arr.push({ id: uid(), title:title, time:taskTime.value, priority:taskPriority.value, notes:taskNotes.value.trim(), done:false, remind:remind, next:taskNext.value.trim(), tag:taskTag.value, repeat:taskRepeat.value });
      setTasksForDate(targetDate, arr);
      showToast(targetDate === state.activeDate ? "Task added" : "Added to " + formatDateLabel(targetDate));
    }
    resetForm();
    renderList();
  });

  cancelEdit.addEventListener("click", function(){ resetForm(); });

  taskRemind.addEventListener("change", function(){
    if(!taskRemind.checked) return;
    if(!("Notification" in window)){
      showToast("Notifications not supported here");
      taskRemind.checked = false;
      return;
    }
    if(Notification.permission === "denied"){
      showToast("Notifications blocked in browser settings");
      taskRemind.checked = false;
      return;
    }
    if(Notification.permission === "default"){
      Notification.requestPermission().then(function(perm){
        if(perm !== "granted"){
          taskRemind.checked = false;
          showToast("Permission not granted");
        } else {
          scheduleReminders();
        }
      });
    }
  });

  function handleAction(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");
    var rowEl = btn.closest(".task-row");
    var rowDate = rowEl ? rowEl.getAttribute("data-date") : state.activeDate;
    var tasks = getTasksForDate(rowDate);

    if(action === "toggle"){
      tasks = tasks.map(function(t){
        if(t.id === id) return Object.assign({}, t, { done: !t.done });
        return t;
      });
      var cur = tasks.find(function(t){ return t.id === id; });
      if(cur && cur.repeat){
        if(cur.done && !cur.nextId){
          var nd = nextOccurrence(rowDate, cur.repeat), nid = uid();
          var dest = getTasksForDate(nd).slice();
          dest.push(Object.assign({}, cur, { id:nid, done:false, nextId:"", nextDate:"" }));
          cur.nextId = nid; cur.nextDate = nd;
          setTasksForDate(rowDate, tasks);
          setTasksForDate(nd, dest);
          showToast("Next: " + formatDateLabel(nd));
        } else if(!cur.done && cur.nextId){
          var da = getTasksForDate(cur.nextDate), nx = da.find(function(t){ return t.id === cur.nextId; });
          if(nx && !nx.done) setTasksForDate(cur.nextDate, da.filter(function(t){ return t.id !== cur.nextId; }));
          cur.nextId = ""; cur.nextDate = "";
        }
      }
      setTasksForDate(rowDate, tasks);
      renderList();
    } else if(action === "edit"){
      var t = tasks.find(function(x){ return x.id === id; });
      if(!t) return;
      if(rowDate !== state.activeDate){ state.activeDate = rowDate; saveState(); renderAll(); }
      taskTitle.value = t.title;
      taskDate.value = rowDate;
      taskNext.value = t.next || "";
      taskTag.value = t.tag || "";
      taskTime.value = t.time || "";
      taskPriority.value = t.priority;
      taskRemind.checked = !!t.remind;
      taskRepeat.value = t.repeat || "";
      taskNotes.value = t.notes || "";
      editingId = id;
      editingDate = rowDate;
      submitBtn.textContent = "Update task";
      cancelEdit.style.display = "inline-block";
      taskTitle.focus();
      taskForm.scrollIntoView({ behavior: "smooth", block: "center" });
    } else if(action === "delete"){
      if(deleteArm === id){
        tasks = tasks.filter(function(t){ return t.id !== id; });
        setTasksForDate(rowDate, tasks);
        deleteArm = null;
        if(editingId === id) resetForm();
        showToast("Task deleted");
        renderList();
      } else {
        deleteArm = id;
        renderList();
        setTimeout(function(){
          if(deleteArm === id){ deleteArm = null; renderList(); }
        }, 3000);
      }
    }
  }

  listTime.addEventListener("click", handleAction);
  listAny.addEventListener("click", handleAction);

  // ---- Calendar strip (pending count per day, scrollable) ----
  var calStrip = document.getElementById("calStrip");
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var _n = new Date(), calBase = new Date(_n.getFullYear(), _n.getMonth(), _n.getDate());
  var calMin = -30, calMax = 60, calBusy = false;
  function offDate(o){ var d = new Date(calBase.getTime()); d.setDate(d.getDate()+o); return d; }
  function pendingOn(ds){ return (state.days[ds]||[]).filter(function(t){ return !t.done; }).length; }
  function calCell(o){
    var d = offDate(o), ds = dateToStr(d), first = d.getDate() === 1;
    return '<div class="cal-day'+(first?' mstart':'')+(ds===todayStr()?' today':'')+'" data-date="'+ds+'">'+
      '<small>'+DOW[d.getDay()]+'</small><b>'+d.getDate()+(first?' '+MONTHS[d.getMonth()]:'')+'</b><i class="cnt"></i></div>';
  }
  function calRange(a,b){ var h=""; for(var o=a;o<=b;o++) h+=calCell(o); return h; }
  function calBuild(){ calStrip.innerHTML = calRange(calMin, calMax); }
  function calCounts(){
    var ts = todayStr();
    Array.prototype.forEach.call(calStrip.children, function(el){
      var ds = el.getAttribute("data-date"), n = pendingOn(ds);
      el.querySelector(".cnt").textContent = n || "";
      el.classList.toggle("has", n>0);
      el.classList.toggle("late", n>0 && ds<ts);
      el.classList.toggle("sel", ds===state.activeDate);
    });
  }
  function calSync(){
    var diff = Math.round((new Date(state.activeDate+"T00:00:00") - calBase)/86400000);
    if(diff < calMin+5){ calMin = diff-30; calBuild(); }
    if(diff > calMax-5){ calMax = diff+30; calBuild(); }
    calCounts();
    var el = calStrip.querySelector('[data-date="'+state.activeDate+'"]');
    if(el) el.scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
  }
  calStrip.addEventListener("scroll", function(){
    if(calBusy) return; calBusy = true;
    requestAnimationFrame(function(){
      calBusy = false;
      var s = calStrip;
      if(s.scrollLeft < 120){
        var w = s.scrollWidth, a = calMin-30;
        s.insertAdjacentHTML("afterbegin", calRange(a, calMin-1)); calMin = a;
        s.scrollLeft += s.scrollWidth - w; calCounts();
      } else if(s.scrollWidth - s.scrollLeft - s.clientWidth < 120){
        s.insertAdjacentHTML("beforeend", calRange(calMax+1, calMax+30)); calMax += 30; calCounts();
      }
    });
  }, { passive:true });
  calStrip.addEventListener("click", function(e){
    var c = e.target.closest("[data-date]"); if(!c) return;
    state.activeDate = c.getAttribute("data-date"); saveState(); deleteArm = null;
    if(!editingId) taskDate.value = state.activeDate;
    renderAll();
  });

  // ---- Tags (user managed) ----
  var taskNext = document.getElementById("taskNext");
  var taskTag = document.getElementById("taskTag");
  var tagPanel = document.getElementById("tagPanel");
  var tagInput = document.getElementById("tagInput");
  var tagSaveBtn = document.getElementById("tagSave");
  var tagChips = document.getElementById("tagChips");
  var tagEditing = null, tagDeleteArm = null;
  function renderTags(){
    var cur = taskTag.value;
    taskTag.innerHTML = '<option value="">No tag</option>' + state.tags.map(function(t){ return '<option value="'+esc(t)+'">'+esc(t)+'</option>'; }).join("");
    taskTag.value = cur;
    tagChips.innerHTML = state.tags.map(function(t){
      var arm = tagDeleteArm === t;
      return '<span class="tag-chip">'+esc(t)+'<button type="button" data-tact="rename" data-tag="'+esc(t)+'">✎</button><button type="button" class="'+(arm?'confirm':'')+'" data-tact="del" data-tag="'+esc(t)+'">'+(arm?'✓':'✕')+'</button></span>';
    }).join("") || '<div class="ov-empty">No tags yet</div>';
  }
  function tagReset(){ tagEditing = null; tagInput.value = ""; tagSaveBtn.textContent = "Add"; }
  function tagSave(){
    var n = tagInput.value.trim(); if(!n) return;
    if(state.tags.some(function(t){ return t.toLowerCase() === n.toLowerCase() && t !== tagEditing; })){ showToast("Tag already exists"); return; }
    var cur = taskTag.value;
    if(tagEditing){
      var old = tagEditing;
      state.tags = state.tags.map(function(t){ return t === old ? n : t; });
      Object.keys(state.days).forEach(function(k){ state.days[k].forEach(function(t){ if(t.tag === old) t.tag = n; }); });
      if(state.open["tag:"+old]){ state.open["tag:"+n] = true; delete state.open["tag:"+old]; }
      if(cur === old) cur = n;
      showToast("Tag renamed");
    } else { state.tags.push(n); showToast("Tag added"); }
    tagReset(); saveState(); renderTags(); taskTag.value = cur; renderList();
  }
  document.getElementById("tagToggle").addEventListener("click", function(){ tagPanel.classList.toggle("open"); });
  tagSaveBtn.addEventListener("click", tagSave);
  tagInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); tagSave(); } });
  tagChips.addEventListener("click", function(e){
    var b = e.target.closest("[data-tact]"); if(!b) return;
    var name = b.getAttribute("data-tag");
    if(b.getAttribute("data-tact") === "rename"){
      tagEditing = name; tagInput.value = name; tagSaveBtn.textContent = "Save"; tagInput.focus();
    } else if(tagDeleteArm === name){
      state.tags = state.tags.filter(function(t){ return t !== name; });
      Object.keys(state.days).forEach(function(k){ state.days[k].forEach(function(t){ if(t.tag === name) t.tag = ""; }); });
      delete state.open["tag:"+name];
      if(tagEditing === name) tagReset();
      tagDeleteArm = null; saveState(); renderTags(); renderList(); showToast("Tag deleted");
    } else {
      tagDeleteArm = name; renderTags();
      setTimeout(function(){ if(tagDeleteArm === name){ tagDeleteArm = null; renderTags(); } }, 3000);
    }
  });

  // ---- Pending overview (collapsible) ----
  var ovTag = document.getElementById("ovTag");
  var ovDate = document.getElementById("ovDate");
  function allPending(){
    var out = [];
    Object.keys(state.days).sort().forEach(function(dk){
      state.days[dk].filter(function(t){ return !t.done; })
        .sort(function(a,b){ var x = a.time||"99", y = b.time||"99"; return x<y?-1:x>y?1:0; })
        .forEach(function(t){ out.push({ t:t, dk:dk }); });
    });
    return out;
  }
  function groupHtml(key, title, items, showDate, late){
    var open = !!state.open[key];
    return '<div class="grp'+(open?' open':'')+'"><button type="button" class="grp-h" data-action="toggleGroup" data-key="'+esc(key)+'"><span class="chev">›</span><span class="grp-t'+(late?' late':'')+'">'+esc(title)+'</span><span class="grp-n">'+items.length+'</span></button>'+
      (open ? '<div class="grp-b">'+items.map(function(x){ return renderRow(x.t, x.dk, showDate); }).join("")+'</div>' : '')+'</div>';
  }
  function renderExtras(){
    calCounts();
    var items = allPending(), ts = todayStr(), empty = '<div class="ov-empty">No pending tasks 🎉</div>';
    var byTag = {}, order = state.tags.concat([""]);
    items.forEach(function(x){ var k = state.tags.indexOf(x.t.tag) > -1 ? x.t.tag : ""; (byTag[k] = byTag[k] || []).push(x); });
    ovTag.innerHTML = order.filter(function(k){ return byTag[k]; }).map(function(k){ return groupHtml("tag:"+k, k || "Untagged", byTag[k], true, false); }).join("") || empty;
    var byDate = {}, dates = [];
    items.forEach(function(x){ if(!byDate[x.dk]){ byDate[x.dk] = []; dates.push(x.dk); } byDate[x.dk].push(x); });
    ovDate.innerHTML = dates.map(function(dk){
      return groupHtml("date:"+dk, formatDateLabel(dk) + (dk===ts ? " · Today" : dk<ts ? " · Overdue" : ""), byDate[dk], false, dk<ts);
    }).join("") || empty;
  }
  function ovClick(e){
    var b = e.target.closest('[data-action="toggleGroup"]'); if(!b) return;
    var k = b.getAttribute("data-key"); state.open[k] = !state.open[k]; saveState(); renderExtras();
  }
  [ovTag, ovDate].forEach(function(el){ el.addEventListener("click", ovClick); el.addEventListener("click", handleAction); });

  calBuild();
  renderTags();
  scheduleReminders();
  state.activeDate = todayStr();
  taskDate.value = state.activeDate;
  renderAll();
  setTimeout(function(){
    var el = calStrip.querySelector('[data-date="'+state.activeDate+'"]');
    if(el) el.scrollIntoView({ inline:"center", block:"nearest" });
  }, 50);
})();
</script>
</body>
</html>
