<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today · Time Zones</title><style>
:root{--bg:#0f1412;--c:#17201c;--m:#a7e8c5;--o:#ff8c70;--t:#e8f0ec;--d:#8a9a92}
*{box-sizing:border-box}body{background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif;padding:14px;max-width:720px;margin:0 auto}
a{color:var(--m)}h1{font-size:20px;margin:6px 0}h2{font-size:15px;color:var(--m);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--c);border-radius:14px;padding:12px;margin:10px 0}
input,select,button{font:inherit;color:var(--t);background:var(--bg);border:1px solid #2c3a33;border-radius:8px;padding:7px}
button{cursor:pointer;background:var(--m);color:var(--bg);border:0;font-weight:600}
button.g{background:var(--bg);color:var(--m);border:1px solid #2c3a33}button.x.arm{background:var(--o);color:var(--bg)}
.nav{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}.fl{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:6px;background:var(--m);border-radius:3px}.chip{display:inline-block;background:var(--bg);border:1px solid #2c3a33;border-radius:12px;padding:3px 10px;margin:3px 4px 0 0;font-size:13px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--m);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--o)}
@media(hover:hover) and (pointer:fine){button:hover{filter:brightness(1.12)}}
table{border-collapse:collapse;font-size:13px;white-space:nowrap}td,th{padding:6px 8px;border-bottom:1px solid #22302a;text-align:right}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--c)}.sc{overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px solid #22302a;align-items:center}.row .tx{flex:1;min-width:0}.r2{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-left:28px}.r2 input[type=time]{width:112px}.r2 select{flex:1;min-width:110px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--m)}#tabs{margin:8px 0}#tn{width:100%;font-weight:600}.h{color:var(--d);font-size:13px;margin:-4px 0 8px}.rl{display:flex;flex-direction:column;font-size:13px;color:var(--d);margin-bottom:6px}.rl input{width:100%}</style></head><body><h1 id="hd"></h1><div class="nav"><a href="time-zones.html">Contributions</a><a href="time-zones-reports.html">Monthly &amp; day-wise</a></div>
<div class="fl" style="margin:8px 0"><button class="g" id="pv" aria-label="Previous day">◀</button><input type="date" id="dp" aria-label="Pick a date"><button class="g" id="nx" aria-label="Next day">▶</button><button class="g" id="td">Today</button></div>
<div class="fl" id="tabs"></div>
<div class="card" id="tinfo"></div>
<div class="card"><h2>Day total <span id="sum"></span></h2><div id="chips"></div></div>
<div class="card"><div id="scope"></div><div id="list"></div><div class="fl" style="margin-top:10px"><button id="add">+ Add at end</button></div></div>
<div class="card"><h2>DS Review</h2><p class="h">Fills from ticked blocks that have a review field. You can also type here.</p><div id="rv"></div><a href="time-zones-reports.html#day">All day-wise reviews</a></div>
<div class="card"><h2>Backup &amp; share</h2><div class="fl"><button class="g" id="ex">Export JSON</button><button class="g" id="im">Import &amp; merge</button><button class="g x" id="ir">Import &amp; replace</button></div><input type="file" id="fi" accept=".json,application/json" hidden></div>
<div id="toast"></div><script>
const K='tz_v1',$=s=>document.querySelector(s);
let D;try{D=JSON.parse(localStorage.getItem(K))||{}}catch(e){D={}}
D.tags=D.tags||['goal-sleep','goal-mundane','goal-passion','goal-health','goal-parenting','goal-career','goal-relationships','goal-office'];D.log=D.log||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const fd=s=>{const[y,m,d]=s.split('-');return +d+'th '+MN[m-1]+' '+y};
const H=d=>{const o={},l=D.log[d]||{};for(const k in l.done||{}){const[t,h]=l.done[k];o[t]=(o[t]||0)+h}for(const t in l.man||{})o[t]=(o[t]||0)+l.man[t];return o};
const f=h=>(Math.round(h*100)/100).toLocaleString('en-IN')+'h';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;const toast=m=>{const e=$('#toast');e.textContent=m;e.className='on';clearTimeout(tt);tt=setTimeout(()=>e.className='',1600)};
let arm=null;const twice=(k,fn)=>{if(arm===k){arm=null;fn()}else{arm=k;toast('Tap again to confirm');setTimeout(()=>{if(arm===k)arm=null},2500)}};
const RV=['Sleep','Water (L)','Steps','Breakfast','Lunch','Dinner','Vitamin D (hrs)','Snax','Learn','Parenting','Health issue','Graha'];
const uid=()=>Math.random().toString(36).slice(2,8);
const mk=s=>s.trim().split('\n').map(l=>{const[a,b,t,g]=l.split('|');return{id:uid(),s:a,e:b,t,g:'goal-'+g}});
const SL='23:00|07:00|Sleep|sleep\n',DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
if(!D.tpl){D.tpl={wd:mk(SL),we:mk(SL)};D.tm={wd:{n:'Weekday',d:[1,2,3,4,5]},we:{n:'Weekend',d:[0,6]}};save()}
else if(!D.tm){const N={office:'Office',wfh:'WFH',sat:'Saturday',sun:'Sunday',basic:'Basic'},wk=D.wk=='wfh'?'wfh':'office';D.tm={};for(const k in D.tpl)D.tm[k]={n:N[k]||k,d:k=='sat'?[6]:k=='sun'?[0]:k==wk?[1,2,3,4,5]:[]};save()}
let day=iso(new Date()),dow=new Date().getDay();const TD=day;
const lg=()=>D.log[day]=D.log[day]||{};
const kf=d=>{const t=(D.log[d]||{}).tpl;if(t&&D.tm[t])return t;const[y,m,dd]=d.split('-'),w=new Date(y,m-1,dd).getDay(),ks=Object.keys(D.tm);return ks.find(k=>D.tm[k].d.includes(w))||ks[0]};
const cur=()=>kf(day);
const blocksFor=d=>{const L=D.log[d],k=kf(d);return L&&L.ov&&L.ovk==k?L.ov:D.tpl[k]};
const used=L=>!!L&&!!(L.ov||(L.done&&Object.keys(L.done).length));
function chain(){const L=D.log[day]||{};if(used(L)||L.chained)return;const[y,m,dd]=day.split('-'),P=D.log[iso(new Date(y,m-1,+dd-1))];if(!used(P))return;
const pb=fixB(blocksFor(iso(new Date(y,m-1,+dd-1)))),last=pb[pb.length-1],k=cur(),T=fixB(D.tpl[k]),f=T[0];
if(!last||!f||!(mn(f.e)<mn(f.s))||f.s==last.e)return;
const o=T.map(b=>({...b}));o[0].s=last.e;const N=lg();N.ov=o;N.ovk=k;N.chained=1;save();toast('Sleep starts at '+last.e+', where the previous day ended')}
const mn=s=>{const[h,m]=(s||'').split(':');return h*60+ +m},dur=b=>{let d=mn(b.e)-mn(b.s);if(isNaN(d))return 0;if(d<0)d+=1440;return d/60};
const hm=m=>{m=((m%1440)+1440)%1440;return p2(Math.floor(m/60))+':'+p2(m%60)};
const shiftB=(b,d)=>{b.s=hm(mn(b.s)+d);b.e=hm(mn(b.e)+d)};
const fixB=B=>{for(let n=0;n<B.length;n++){const f=B[0];if(f&&B.length>1&&mn(f.e)<mn(f.s)&&dur(f)<4)B.push(B.shift());else break}return B};
const isOv=()=>{const L=D.log[day];return !!(L&&L.ov&&L.ovk==cur())};
const blocks=()=>isOv()?D.log[day].ov:D.tpl[cur()];
const opts=g=>[...new Set([...D.tags,g])].map(t=>`<option ${t==g?'selected':''}>${esc(t)}</option>`).join('');
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function stat(){const B=blocks(),h=H(day),L=D.log[day]||{},dn=Object.values(L.done||{}).reduce((a,x)=>a+x[1],0),pl=B.reduce((a,b)=>a+dur(b),0);
$('#sum').textContent=f(dn)+' of '+f(pl);
$('#chips').innerHTML=Object.entries(h).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(([t,v])=>`<span class="chip">#${esc(t)} ${f(v)}</span>`).join('')||'<span style="color:var(--d)">Tick a block to add its hours.</span>'}
function draw(){const k=cur(),B=fixB(blocks()),m=D.tm[k],L=D.log[day]||{};$('#hd').textContent=DN[dow]+', '+fd(day);$('#dp').value=day;
$('#tabs').innerHTML=Object.keys(D.tm).map(x=>`<button class="${x==k?'':'g'}" data-tab="${x}">${esc(D.tm[x].n)}</button>`).join('')+'<button class="g" data-new>+ New</button>';
$('#tinfo').innerHTML=`<input id="tn" value="${esc(m.n)}" aria-label="Template name"><div class="fl" style="margin-top:8px">${DS.map((n,i)=>`<button class="${m.d.includes(i)?'':'g'}" data-day="${i}">${n}</button>`).join('')}</div><div style="color:var(--d);font-size:13px;margin:6px 0">Loads automatically on the selected days. Use the tabs to switch for today.</div><div class="fl"><button class="g" data-dup>Duplicate</button><button class="g x" data-rm>Delete template</button></div>`;
$('#list').innerHTML=B.map((b,i)=>`<div class="row" data-i="${i}"><input type="checkbox" data-f="done" aria-label="Done" ${L.done&&L.done[b.id]?'checked':''}><input class="tx" data-f="t" value="${esc(b.t)}"><div class="r2"><input type="time" data-f="s" data-p="${b.s}" value="${b.s}"><input type="time" data-f="e" data-p="${b.e}" value="${b.e}"><select data-f="g">${opts(b.g)}</select><select data-f="r" aria-label="Review field"><option value="">Review: none</option>${RV.map(x=>`<option ${x==b.r?'selected':''}>${x}</option>`).join('')}</select>${b.r?`<input data-f="v" placeholder="value" value="${esc((L.bv||{})[b.id]||'')}" style="width:90px">`:''}<button class="g" data-ins="${i}" aria-label="Add block after this">＋</button><button class="g x" data-del="${i}" aria-label="Delete">✕</button></div></div>`).join('');
const ov=isOv();$('#scope').innerHTML=`<div class="fl"><button class="${ov?'g':''}" data-scope="tpl">Template</button><button class="${ov?'':'g'}" data-scope="day">This day only</button></div><p class="h" style="margin:6px 0 4px">Time and block changes apply to ${ov?'this date only':'every day that uses this template'}.</p>`;
stat();fillRv()}
$('#tabs').onclick=e=>{const d=e.target.dataset;if(d.tab){lg().tpl=d.tab;save();draw()}else if('new' in d){const k='t'+uid();D.tpl[k]=mk(SL);D.tm[k]={n:'New template',d:[]};lg().tpl=k;save();draw();toast('Template added')}};
$('#tinfo').oninput=e=>{if(e.target.id!='tn')return;const k=cur();D.tm[k].n=e.target.value;const b=$('[data-tab="'+k+'"]');if(b)b.textContent=e.target.value;save()};
$('#tinfo').onclick=e=>{const d=e.target.dataset,k=cur(),m=D.tm[k];
if(d.day!=null){const i=+d.day;m.d=m.d.includes(i)?m.d.filter(x=>x!=i):[...m.d,i];save();draw()}
else if('dup' in d){const n='t'+uid();D.tpl[n]=D.tpl[k].map(b=>({...b,id:uid()}));D.tm[n]={n:m.n+' copy',d:[]};lg().tpl=n;save();draw();toast('Duplicated')}
else if('rm' in d){if(Object.keys(D.tm).length<2)return toast('Keep at least one template');twice('rt'+k,()=>{delete D.tpl[k];delete D.tm[k];const L=lg();delete L.tpl;save();draw();toast('Template deleted')});if(arm)e.target.classList.add('arm')}};
$('#list').oninput=e=>{const r=e.target.closest('.row'),fl=e.target.dataset.f;if(!r||!fl||fl=='s'||fl=='e')return;const b=blocks()[r.dataset.i],L=lg();L.done=L.done||{};
if(fl=='done'){if(e.target.checked)L.done[b.id]=[b.g,dur(b)];else delete L.done[b.id]}else if(fl=='v'){(L.bv=L.bv||{})[b.id]=e.target.value}else{b[fl]=e.target.value;if(L.done[b.id])L.done[b.id]=[b.g,dur(b)]}
syncRv();save();if(fl=='r')draw();else stat()};
$('#list').onchange=e=>{const r=e.target.closest('.row'),fl=e.target.dataset.f;if(!r||(fl!='s'&&fl!='e'))return;const B=blocks(),i=+r.dataset.i,b=B[i],o=e.target.dataset.p,n=e.target.value;if(!n){e.target.value=o;return}
let d=mn(n)-mn(o);d=((d+720)%1440+1440)%1440-720;if(!d)return;
if(fl=='s')shiftB(b,d);else b.e=n;
for(let j=i+1;j<B.length;j++)shiftB(B[j],d);
const L=lg();if(L.done&&L.done[b.id])L.done[b.id]=[b.g,dur(b)];syncRv();save();draw();toast('Later blocks moved '+Math.abs(d)+' min '+(d>0?'later':'earlier'))};
function ins(i){const B=blocks(),a=B[i],d=15;for(let j=i+1;j<B.length;j++)shiftB(B[j],d);B.splice(i+1,0,{id:uid(),s:a.e,e:hm(mn(a.e)+d),t:'New block',g:D.tags[0]||''});save();draw();toast('Block added, later blocks moved 15 min')}
$('#scope').onclick=e=>{const c=e.target.dataset.scope;if(!c)return;const L=lg(),k=cur();if(c=='day'&&!isOv()){L.ov=D.tpl[k].map(b=>({...b}));L.ovk=k;save();draw();toast('Changes now apply to this day only')}else if(c=='tpl'&&isOv())twice('so',()=>{delete L.ov;delete L.ovk;syncRv();save();draw();toast('Day changes discarded')})};
$('#list').onclick=e=>{const B=blocks();if(e.target.dataset.ins!=null)return ins(+e.target.dataset.ins);const i=e.target.dataset.del;if(i==null)return;const b=B[i];twice('d'+b.id,()=>{const L=lg();if(L.done)delete L.done[b.id];B.splice(i,1);save();draw();toast('Deleted')});if(arm)e.target.classList.add('arm')};
$('#add').onclick=()=>{const B=blocks(),a=B[B.length-1],st=a?a.e:'09:00';B.push({id:uid(),s:st,e:hm(mn(st)+30),t:'New block',g:D.tags[0]||''});save();draw();toast('Block added')};
const NUM=['Water (L)','Steps','Vitamin D (hrs)'],AUTO={'Vitamin D (hrs)':b=>dur(b),'Sleep':b=>f(dur(b))};
function syncRv(){const L=lg(),B=blocks(),a={},mp=new Set;L.rv=L.rv||{};L.au=L.au||{};
for(const b of B){if(!b.r)continue;mp.add(b.r);if(!(L.done&&L.done[b.id]))continue;let v=String((L.bv||{})[b.id]||'').trim();if(!v&&AUTO[b.r])v=AUTO[b.r](b);if(v!=='')(a[b.r]=a[b.r]||[]).push(v)}
for(const k of mp){if(a[k]){L.rv[k]=NUM.includes(k)?String(Math.round(a[k].reduce((x,y)=>x+(+y||0),0)*100)/100):a[k].join(', ');L.au[k]=1}else if(L.au[k]){delete L.rv[k];delete L.au[k]}}
fillRv()}
function fillRv(){const r=(D.log[day]||{}).rv||{};document.querySelectorAll('#rv input').forEach(i=>i.value=r[i.dataset.k]||'')}
$('#rv').innerHTML=RV.map(k=>`<label class="rl">${k}<input data-k="${k}"></label>`).join('');
$('#rv').oninput=e=>{const k=e.target.dataset.k;if(!k)return;const L=lg();(L.rv=L.rv||{})[k]=e.target.value;if(L.au)delete L.au[k];save()};
const setDay=d=>{if(!d)return;day=d;const[y,m,dd]=d.split('-');dow=new Date(y,m-1,dd).getDay();chain();draw()};
const shift=n=>{const[y,m,dd]=day.split('-');setDay(iso(new Date(y,m-1,+dd+n)))};
$('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);$('#td').onclick=()=>setDay(TD);$('#dp').onchange=e=>setDay(e.target.value);
let mode='merge';
function imp(o){if(!o||typeof o!='object'||!o.tpl||!o.tm)return toast('Not a Time Zones file');
if(mode=='replace'){D={tags:o.tags||D.tags,log:o.log||{},tpl:o.tpl,tm:o.tm}}
else{D.tags=[...new Set([...D.tags,...(o.tags||[])])];for(const k in o.tpl){const n=D.tpl[k]?k+'-'+uid():k;D.tpl[n]=o.tpl[k];D.tm[n]=o.tm[k]||{n:k,d:[]}}for(const d in o.log||{})if(!D.log[d])D.log[d]=o.log[d]}
save();draw();toast('Imported')}
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='my-time-zones.json';a.click();toast('Exported')};
$('#im').onclick=()=>{mode='merge';$('#fi').click()};
$('#ir').onclick=()=>twice('ir',()=>{mode='replace';$('#fi').click()});
$('#fi').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{imp(JSON.parse(r.result))}catch(x){toast('Could not read that file')}};r.readAsText(fl);e.target.value=''};
chain();draw();
</script></body></html>
