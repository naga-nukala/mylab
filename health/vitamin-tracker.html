<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Vitamin Tracker</title>
<style>
  :root{
    --accent:#c4e86a;
    --warn:#ff8c70;
    --bg:#0f0f10;
    --card:#1a1a1c;
    --card2:#212124;
    --border:#2c2c2f;
    --text:#eaeaea;
    --sub:#9a9a9e;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .app{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  header{margin-bottom:16px;}
  header h1{font-size:22px;margin:0 0 2px;letter-spacing:-.3px;}
  header .date{color:var(--sub);font-size:13px;}

  .summary{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px;margin-bottom:18px;display:flex;gap:16px;align-items:center;}
  .ring-wrap{position:relative;width:78px;height:78px;flex:0 0 auto;}
  .ring-wrap svg{transform:rotate(-90deg);width:78px;height:78px;}
  .ring-bg{fill:none;stroke:var(--border);stroke-width:8;}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;
    transition:stroke-dashoffset .35s ease, stroke .35s ease;}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:700;}
  .summary-text{flex:1;min-width:0;}
  .summary-text .count{font-size:14px;color:var(--sub);margin-bottom:6px;}
  .summary-text .count b{color:var(--text);}
  .missing-label{font-size:12px;color:var(--sub);margin-bottom:4px;}
  .missing-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:12px;padding:3px 9px;border-radius:20px;background:rgba(255,140,112,.12);
    color:var(--warn);border:1px solid rgba(255,140,112,.35);}
  .all-done{color:var(--accent);font-size:13px;font-weight:600;}

  .grid{display:flex;flex-direction:column;gap:10px;}
  .vcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px;}
  .vcard.done{border-color:rgba(196,232,106,.4);}
  .vtop{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .vname{font-size:15px;font-weight:600;}
  .vpct{font-size:12px;color:var(--sub);min-width:34px;text-align:right;}
  .vcard.done .vpct{color:var(--accent);}
  .bar-track{height:7px;border-radius:5px;background:var(--border);margin:9px 0 12px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;background:var(--warn);transition:width .3s ease, background .3s ease;}
  .vcard.done .bar-fill{background:var(--accent);}

  .stepper-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .step-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--card2);
    color:var(--text);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;}
  .step-btn:active{background:var(--border);}
  @media (hover:hover) and (pointer:fine){
    .step-btn:hover{border-color:var(--accent);}
  }
  .step-val{font-size:13px;color:var(--sub);min-width:64px;text-align:center;}
  .step-val b{color:var(--text);}

  details.foods{margin-top:2px;}
  details.foods summary{list-style:none;cursor:pointer;font-size:12px;color:var(--sub);
    display:flex;align-items:center;gap:5px;}
  details.foods summary::-webkit-details-marker{display:none;}
  details.foods summary:before{content:"▸";font-size:10px;transition:transform .15s ease;}
  details.foods[open] summary:before{transform:rotate(90deg);}
  .foods-body{padding-top:9px;}
  .food-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .food-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--card2);
    border:1px solid var(--border);color:var(--text);}
  .combo{font-size:12px;color:var(--sub);line-height:1.4;}
  .combo b{color:var(--accent);font-weight:600;}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#232326;color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;
    border:1px solid var(--border);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    z-index:50;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0f0f10;--card:#1a1a1c;--card2:#212124;--border:#2c2c2f;--text:#eaeaea;--sub:#9a9a9e;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Vitamin Tracker</h1>
    <div class="date" id="dateLabel"></div>
  </header>

  <div class="summary">
    <div class="ring-wrap">
      <svg viewBox="0 0 78 78">
        <circle class="ring-bg" cx="39" cy="39" r="32"></circle>
        <circle class="ring-fg" id="ringFg" cx="39" cy="39" r="32"
          stroke-dasharray="201.06" stroke-dashoffset="201.06"></circle>
      </svg>
      <div class="ring-label" id="ringLabel">0%</div>
    </div>
    <div class="summary-text">
      <div class="count"><b id="coveredCount">0</b> of <b id="totalCount">0</b> vitamins covered today</div>
      <div id="missingBlock">
        <div class="missing-label">Still need:</div>
        <div class="missing-chips" id="missingChips"></div>
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "as_vitamin_tracker";

  var VITAMINS = [
    {id:"a",   name:"Vitamin A",   target:3, foods:["Carrots","Sweet potato","Spinach"],
      combo:"Pair with ghee or nuts — it's fat-soluble and absorbs better with fat."},
    {id:"b1",  name:"Vitamin B1 (Thiamine)", target:3, foods:["Whole grains","Lentils (dal)","Sunflower seeds"],
      combo:"Best with a protein source — helps the body release energy from it."},
    {id:"b2",  name:"Vitamin B2 (Riboflavin)", target:3, foods:["Milk & curd","Almonds","Eggs"],
      combo:"Combine with a B6 food like banana — they work together in energy metabolism."},
    {id:"b3",  name:"Vitamin B3 (Niacin)", target:3, foods:["Peanuts","Paneer / chicken","Brown rice"],
      combo:"Pair with a milk-based food — tryptophan in milk helps the body make more niacin."},
    {id:"b5",  name:"Vitamin B5", target:3, foods:["Mushrooms","Avocado","Curd"],
      combo:"Best absorbed alongside whole grains rather than on its own."},
    {id:"b6",  name:"Vitamin B6", target:3, foods:["Banana","Chickpeas","Potato"],
      combo:"Pair with a B12 source (egg/dairy) — both support nerve function together."},
    {id:"b7",  name:"Vitamin B7 (Biotin)", target:3, foods:["Cooked eggs","Nuts","Sweet potato"],
      combo:"Cook eggs fully — raw egg white contains a protein that blocks biotin absorption."},
    {id:"b9",  name:"Vitamin B9 (Folate)", target:3, foods:["Leafy greens","Lentils","Beetroot"],
      combo:"Add a Vitamin C food like citrus — it boosts how much folate you absorb."},
    {id:"b12", name:"Vitamin B12", target:3, foods:["Eggs","Dairy / paneer","Fortified cereal"],
      combo:"Pair with folate-rich greens — together they support healthy red blood cells."},
    {id:"c",   name:"Vitamin C", target:3, foods:["Amla","Citrus fruits","Guava"],
      combo:"Pair with an iron-rich food like spinach — it significantly boosts iron absorption."},
    {id:"d",   name:"Vitamin D", target:3, foods:["Sunlight (10–15 min)","Egg yolk","Fortified milk"],
      combo:"Pair with a fat source (nuts/ghee) — it's fat-soluble and needs fat to absorb."},
    {id:"e",   name:"Vitamin E", target:3, foods:["Almonds","Sunflower seeds","Spinach"],
      combo:"Combine with healthy fats like avocado or nuts for better absorption."},
    {id:"k",   name:"Vitamin K", target:3, foods:["Spinach","Broccoli","Curd"],
      combo:"Pair with olive oil or ghee — fat helps this vitamin absorb properly."}
  ];

  var els = {};
  var state = null;

  function ordinal(n){
    var s=["th","st","nd","rd"], v=n%100;
    return n + (s[(v-20)%10] || s[v] || s[0]);
  }
  function formatDate(d){
    var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return ordinal(d.getDate())+" "+months[d.getMonth()]+" "+d.getFullYear();
  }

  function defaultIntake(){
    var o={};
    VITAMINS.forEach(function(v){ o[v.id]=0; });
    return o;
  }

  function load(){
    var todayKey = formatDate(new Date());
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    var data = null;
    if(raw){
      try{ data = JSON.parse(raw); }catch(e){ data = null; }
    }
    if(!data || data.date !== todayKey){
      data = { date: todayKey, intake: defaultIntake() };
    }
    // fill any missing ids (in case list changes)
    VITAMINS.forEach(function(v){
      if(typeof data.intake[v.id] !== "number") data.intake[v.id] = 0;
    });
    return data;
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function showToast(msg){
    var t = els.toast;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1400);
  }

  function pctFor(v){
    var val = state.intake[v.id] || 0;
    return Math.min(100, Math.round((val / v.target) * 100));
  }

  function renderGrid(){
    var grid = els.grid;
    grid.innerHTML = "";
    VITAMINS.forEach(function(v){
      var pct = pctFor(v);
      var done = pct >= 100;
      var card = document.createElement("div");
      card.className = "vcard" + (done ? " done" : "");
      card.setAttribute("data-vid", v.id);

      var foodChips = v.foods.map(function(f){
        return '<span class="food-chip">'+f+'</span>';
      }).join("");

      card.innerHTML =
        '<div class="vtop">'+
          '<div class="vname">'+v.name+'</div>'+
          '<div class="vpct" data-role="pct">'+pct+'%</div>'+
        '</div>'+
        '<div class="bar-track"><div class="bar-fill" data-role="bar" style="width:'+pct+'%"></div></div>'+
        '<div class="stepper-row">'+
          '<div class="stepper">'+
            '<div class="step-btn" data-action="dec" data-vid="'+v.id+'">−</div>'+
            '<div class="step-val" data-role="val"><b>'+(state.intake[v.id]||0)+'</b> / '+v.target+' servings</div>'+
            '<div class="step-btn" data-action="inc" data-vid="'+v.id+'">+</div>'+
          '</div>'+
        '</div>'+
        '<details class="foods">'+
          '<summary>Top foods &amp; best combo</summary>'+
          '<div class="foods-body">'+
            '<div class="food-chips">'+foodChips+'</div>'+
            '<div class="combo"><b>Combo tip:</b> '+v.combo+'</div>'+
          '</div>'+
        '</details>';

      grid.appendChild(card);
    });
  }

  function updateCard(vid){
    var v = VITAMINS.find(function(x){ return x.id === vid; });
    var card = els.grid.querySelector('.vcard[data-vid="'+vid+'"]');
    if(!v || !card) return;
    var pct = pctFor(v);
    var done = pct >= 100;
    card.classList.toggle("done", done);
    card.querySelector('[data-role="pct"]').textContent = pct + "%";
    card.querySelector('[data-role="bar"]').style.width = pct + "%";
    card.querySelector('[data-role="val"]').innerHTML = "<b>"+(state.intake[vid]||0)+"</b> / "+v.target+" servings";
  }

  function renderSummary(){
    var total = VITAMINS.length;
    var pcts = VITAMINS.map(pctFor);
    var overall = Math.round(pcts.reduce(function(a,b){return a+b;},0) / total);
    var covered = pcts.filter(function(p){ return p >= 100; }).length;
    var missing = VITAMINS.filter(function(v,i){ return pcts[i] < 100; })
                           .sort(function(a,b){ return pctFor(a) - pctFor(b); });

    var CIRC = 201.06;
    var offset = CIRC - (overall/100)*CIRC;
    els.ringFg.style.strokeDashoffset = offset;
    els.ringFg.style.stroke = overall >= 100 ? "var(--accent)" : (overall < 40 ? "var(--warn)" : "var(--accent)");
    els.ringLabel.textContent = overall + "%";
    els.coveredCount.textContent = covered;
    els.totalCount.textContent = total;

    if(missing.length === 0){
      els.missingBlock.innerHTML = '<div class="all-done">All vitamins covered today 🎉</div>';
    }else{
      els.missingBlock.innerHTML =
        '<div class="missing-label">Still need:</div><div class="missing-chips" id="missingChips"></div>';
      var chipsWrap = els.missingBlock.querySelector("#missingChips");
      missing.forEach(function(v){
        var chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = v.name.replace(/\s*\(.*?\)/, "");
        chipsWrap.appendChild(chip);
      });
    }
  }

  function changeIntake(vid, delta){
    var v = VITAMINS.find(function(x){ return x.id === vid; });
    if(!v) return;
    var cur = state.intake[vid] || 0;
    var next = cur + delta;
    if(next < 0) next = 0;
    if(next > v.target + 2) next = v.target + 2; // small headroom above target
    if(next === cur) return;
    state.intake[vid] = next;
    save();
    updateCard(vid);
    renderSummary();
    if(delta > 0 && next === v.target){
      showToast(v.name.replace(/\s*\(.*?\)/, "") + " covered ✓");
    }
  }

  function init(){
    els.dateLabel = document.getElementById("dateLabel");
    els.grid = document.getElementById("grid");
    els.ringFg = document.getElementById("ringFg");
    els.ringLabel = document.getElementById("ringLabel");
    els.coveredCount = document.getElementById("coveredCount");
    els.totalCount = document.getElementById("totalCount");
    els.missingBlock = document.getElementById("missingBlock");
    els.toast = document.getElementById("toast");

    state = load();
    els.dateLabel.textContent = state.date;

    renderGrid();
    renderSummary();

    els.grid.addEventListener("click", function(e){
      var btn = e.target.closest(".step-btn");
      if(!btn) return;
      var vid = btn.getAttribute("data-vid");
      var action = btn.getAttribute("data-action");
      changeIntake(vid, action === "inc" ? 1 : -1);
    });

    // reset intake automatically if the date rolls over while page stays open
    setInterval(function(){
      var todayKey = formatDate(new Date());
      if(todayKey !== state.date){
        state = { date: todayKey, intake: defaultIntake() };
        save();
        els.dateLabel.textContent = state.date;
        renderGrid();
        renderSummary();
      }
    }, 60000);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
