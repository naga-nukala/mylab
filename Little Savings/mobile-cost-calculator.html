<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a7e8c5">
<link rel="manifest" href="manifest.webmanifest">
<script src="pwa.js" defer></script>
<title>Mobile Cost & RC Calculator</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--txt:#e2e8f0;--sub:#94a3b8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:20px;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:var(--sub);font-size:13px;margin-top:0;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
  .member{border-bottom:1px solid #334155;padding-bottom:14px;margin-bottom:14px;}
  .member:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
  .row input, .row select{flex:1;min-width:0;}
  label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
  .field{flex:1;min-width:0;}
  .field-hint{font-size:10px;line-height:1.3;color:var(--sub);margin-top:3px;min-height:26px;}
  input, select{width:100%;padding:9px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--txt);font-size:14px;}
  input:focus, select:focus{outline:2px solid var(--acc);}
  .name-input{font-weight:700;font-size:15px;margin-bottom:10px;}
  .per-day{font-size:13px;color:var(--acc);font-weight:700;margin-top:4px;}
  .badge-cost{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .badge-cost.good{background:rgba(34,197,94,.15);color:var(--acc);}
  .badge-cost.mid{background:rgba(245,158,11,.15);color:var(--warn);}
  .badge-cost.bad{background:rgba(239,68,68,.15);color:var(--bad);}
  .benchmark-note{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.6;}
  .remove-btn{background:none;border:none;color:var(--bad);font-size:13px;cursor:pointer;padding:4px 8px;}
  button.add{width:100%;padding:12px;border:1px dashed #475569;border-radius:10px;background:transparent;color:var(--txt);font-size:14px;cursor:pointer;margin-bottom:12px;}
  .total-card{text-align:center;padding:20px 16px;}
  .total-num{font-size:36px;font-weight:800;color:var(--acc);}
  .total-label{color:var(--sub);font-size:13px;margin-top:2px;}
  .breakdown{font-size:12px;color:var(--sub);margin-top:10px;text-align:left;}
  .breakdown div{display:flex;justify-content:space-between;padding:3px 0;}
  .actions{display:flex;gap:8px;margin-bottom:12px;}
  .actions button{flex:1;padding:10px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:var(--txt);font-size:13px;cursor:pointer;}
  .actions .primary{background:var(--acc);border-color:var(--acc);color:#052e16;font-weight:700;}
  .recommendation{font-size:12px;line-height:1.5;text-align:left;margin-top:14px;padding-top:12px;border-top:1px solid #334155;}
  .recommendation strong{color:var(--acc);}
  .history-list{font-size:12px;color:var(--sub);}
  .history-row{padding:7px 0;border-bottom:1px solid #334155;}
  .history-row:last-child{border-bottom:none;}
  .history-summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;}
  .history-summary::after{content:'View details';color:var(--acc);font-size:11px;white-space:nowrap;}
  .history-row[open] .history-summary::after{content:'Hide details';}
  .history-summary:hover{color:var(--txt);}
  .history-details{padding:8px 0 2px 8px;line-height:1.6;}
  .history-member{padding:6px 0;border-top:1px solid rgba(71,85,105,.5);}
  .history-member strong{color:var(--txt);}
  .history-empty{margin:0;}
  .industry-note{font-size:11px;color:var(--sub);line-height:1.5;margin:-8px 2px 12px;}
  .history-summary{align-items:center;}
  .history-del{background:none;border:none;color:var(--bad);font-size:12px;cursor:pointer;padding:2px 6px;flex-shrink:0;}
  .history-del.confirming{background:var(--bad);color:#fff;border-radius:6px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#334155;color:var(--txt);padding:9px 16px;border-radius:20px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:100;white-space:nowrap;display:none;}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="wrap">
  <h1>📱 Mobile Cost & RC Calculator</h1>
  <p class="sub">Per-day cost = (Device + Accessories + Wear & Tear − Resale Value) ÷ Lifespan(days) + RC/day, per member.</p>
 
  <div class="card total-card">
    <div class="total-num" id="totalPerDay">₹0</div>
    <div class="total-label">Combined Per-Day Cost (all members)</div>
    <div class="breakdown" id="breakdown"></div>
    <div class="recommendation" id="recommendation"></div>
  </div>

  <div class="card" id="membersContainer"></div>
  <button class="add" onclick="addMember()">+ Add Family Member</button>
  <div class="actions">
    <button class="primary" onclick="saveSnapshot()">Save Snapshot</button>
    <button onclick="clearHistory()">Clear History</button>
  </div>
  <div class="card">
    <div class="total-label" style="text-align:left;margin-bottom:8px;">Cost History</div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'mobile-cost-calculator-members';
const HISTORY_KEY = 'mobile-cost-calculator-history';
const defaultMembers = [
  {name:'Myself', device:0, accessories:0, wearTear:0, resale:0, years:2, rc:0, rcDays:30, type:'smart'},
  {name:'Spouse', device:0, accessories:0, wearTear:0, resale:0, years:2, rc:0, rcDays:30, type:'smart'},
];
let members = loadMembers();
let history = loadHistory();

function inrFmt(n){ return '₹' + (Number(n)||0).toLocaleString('en-IN', {maximumFractionDigits:0}); }

function normalizeMember(member){
  return {
    name:member.name||'',
    device:Number(member.device)||0,
    accessories:Number(member.accessories)||0,
    wearTear:Number(member.wearTear)||0,
    resale:Number(member.resale)||0,
    years:Number(member.years)||2,
    rc:Number(member.rc)||0,
    rcDays:Number(member.rcDays)||30,
    type:member.type||'smart'
  };
}

function loadMembers(){
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(saved) && saved.length ? saved.map(normalizeMember) : defaultMembers.map(m=>({...m}));
  } catch(error) {
    return defaultMembers.map(m=>({...m}));
  }
}

function loadHistory(){
  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY));
    return Array.isArray(saved) ? saved : [];
  } catch(error) {
    return [];
  }
}

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
}

function addMember(){
  members.push({name:'', device:0, accessories:0, wearTear:0, resale:0, years:2, rc:0, rcDays:30, type:'smart'});
  persist();
  render();
}
function removeMember(i){
  members.splice(i,1);
  persist();
  render();
}
function updateField(i, field, val){
  members[i][field] = (field==='name'||field==='type') ? val : parseFloat(val)||0;
  persist();
  updateTotals();
}

const BENCHMARKS = {
  smart:   { device: 12, accessories: 1.1, wearTear: 2, rc: 5 },
  jio:     { device: 3,  accessories: 1,   wearTear: 0.3, rc: 2 },
  feature: { device: 1.5,accessories: 0.5, wearTear: 0.2, rc: 1 }
}; // rough daily reference values (₹), including a repair/battery allowance for Wear & Tear

function benchmarkFor(m){ return BENCHMARKS[m.type] || BENCHMARKS.smart; }

function netOwnershipCost(m){
  return Math.max(0, (m.device||0) + (m.accessories||0) + (m.wearTear||0) - (m.resale||0));
}

function costParts(m){
  const days = (m.years||1)*365;
  return {
    device: (m.device||0) / days,
    accessories: (m.accessories||0) / days,
    wearTear: (m.wearTear||0) / days,
    resale: -(m.resale||0) / days,
    rc: (m.rc||0) / Math.max(1,m.rcDays||30)
  };
}

function perDayCost(m){
  const days = (m.years||1)*365;
  return netOwnershipCost(m) / days + (m.rc||0)/Math.max(1,m.rcDays||30);
}

function hasCosts(m){
  return (m.device||0)>0 || (m.accessories||0)>0 || (m.wearTear||0)>0 || (m.resale||0)>0 || (m.rc||0)>0;
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2000);
}

let pendingDeletes = {};
function confirmDelete(key, btn, action){
  if(pendingDeletes[key]){
    clearTimeout(pendingDeletes[key]);
    delete pendingDeletes[key];
    action();
    return;
  }
  if(btn){ btn.textContent = '✔ Confirm'; btn.classList.add('confirming'); }
  showToast('Tap again to confirm delete');
  pendingDeletes[key] = setTimeout(()=>{
    delete pendingDeletes[key];
    if(btn){ btn.textContent = '✕'; btn.classList.remove('confirming'); }
  }, 2500);
}

function deleteHistoryEntry(id, btn){
  confirmDelete('hist-'+id, btn, ()=>{
    history = history.filter(h=>h.id!==id);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    renderHistory();
    showToast('Snapshot deleted');
  });
}

function saveSnapshot(){
  const total = members.reduce((sum,m)=>sum+perDayCost(m),0);
  history.unshift({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    date:new Date().toISOString(),
    totalPerDay:total,
    monthly:total*30,
    annual:total*365,
    members:members.map(m=>({
      name:m.name||'(unnamed)',
      device:m.device||0,
      accessories:m.accessories||0,
      wearTear:m.wearTear||0,
      resale:m.resale||0,
      years:m.years||1,
      rc:m.rc||0,
      rcDays:m.rcDays||30,
      type:m.type||'smart',
      perDay:perDayCost(m),
      monthly:perDayCost(m)*30,
      parts:costParts(m)
    }))
  });
  history = history.slice(0,12);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}

function clearHistory(){
  history = [];
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

function render(){
  const container = document.getElementById('membersContainer');
  container.innerHTML = '';
  members.forEach((m,i)=>{
    const div = document.createElement('div');
    div.className = 'member';
    div.dataset.index = i;
    div.innerHTML = `
      <div class="row">
        <input class="name-input" placeholder="Member name" value="${escapeHtml(m.name||'')}" oninput="updateField(${i},'name',this.value)">
        <button class="remove-btn" onclick="removeMember(${i})">✕</button>
      </div>
      <div class="row">
        <div class="field"><label>Device Cost (₹)</label><input type="number" value="${m.device}" oninput="updateField(${i},'device',this.value)"></div>
        <div class="field"><label>Accessories (₹)</label><input type="number" value="${m.accessories}" oninput="updateField(${i},'accessories',this.value)"><div class="field-hint">Cover, screen guard, charger, earphones</div></div>
      </div>
      <div class="row">
        <div class="field"><label>Wear &amp; Tear (₹)</label><input type="number" value="${m.wearTear}" oninput="updateField(${i},'wearTear',this.value)"><div class="field-hint">Repairs, battery, damage, servicing</div></div>
        <div class="field"><label>Resale Value (₹)</label><input type="number" value="${m.resale}" oninput="updateField(${i},'resale',this.value)"><div class="field-hint">Expected trade-in/resale at end of lifespan</div></div>
      </div>
      <div class="row">
        <div class="field"><label>Lifespan (years)</label><input type="number" step="0.5" value="${m.years}" oninput="updateField(${i},'years',this.value)"><div class="field-hint">Expected ownership period</div></div>
        <div class="field"><label>Recharge Amount (₹)</label><input type="number" value="${m.rc}" oninput="updateField(${i},'rc',this.value)"></div>
      </div>
      <div class="row">
        <div class="field"><label>Recharge Validity (days)</label><input type="number" min="1" value="${m.rcDays}" oninput="updateField(${i},'rcDays',this.value)"><div class="field-hint">For example: 28, 56, 84, or 365</div></div>
        <div class="field"><label>Phone Type</label>
          <select onchange="updateField(${i},'type',this.value)">
            <option value="smart" ${m.type==='smart'?'selected':''}>Smartphone</option>
            <option value="jio" ${m.type==='jio'?'selected':''}>Jio Phone</option>
            <option value="feature" ${m.type==='feature'?'selected':''}>Feature Phone</option>
          </select>
        </div>
      </div>
      <div class="row" style="justify-content:space-between;align-items:baseline;">
        <div class="per-day" data-role="perday">${inrFmt2(perDayCost(m))} / day</div>
        <div class="badge-cost" data-role="badge"></div>
      </div>
      <div class="benchmark-note" data-role="note"></div>
    `;
    container.appendChild(div);
  });
  updateTotals();
}

function inrFmt2(n){ return '₹' + (Number(n)||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function updateTotals(){
  // update each member's per-day text in place, no rebuild
  const container = document.getElementById('membersContainer');
  members.forEach((m,i)=>{
    const div = container.querySelector(`[data-index="${i}"]`);
    if(div){
      const pd = div.querySelector('[data-role="perday"]');
      if(pd) pd.textContent = `${inrFmt2(perDayCost(m))} / day`;

      const parts = costParts(m);
      const bench = benchmarkFor(m);
      const note = div.querySelector('[data-role="note"]');
      const badge = div.querySelector('[data-role="badge"]');
      if(note && badge){
        if(!hasCosts(m)){
          badge.className = 'badge-cost';
          badge.textContent = '';
          note.textContent = '';
          return;
        }
        const rows = [
          {label:'Device', val:parts.device, bench:bench.device},
          {label:'Accessories', val:parts.accessories, bench:bench.accessories},
          {label:'Wear & Tear', val:parts.wearTear, bench:bench.wearTear},
          {label:'RC', val:parts.rc, bench:bench.rc}
        ];
        // overall badge = worst offender (resale only reduces cost, not scored against benchmark)
        let worst = {diffPct:-100};
        rows.forEach(r=>{
          const diffPct = r.bench>0 ? ((r.val-r.bench)/r.bench)*100 : 0;
          r.diffPct = diffPct;
          if(diffPct > worst.diffPct) worst = r;
        });
        badge.classList.remove('good','mid','bad');
        if(worst.diffPct <= 10){ badge.classList.add('good'); badge.textContent='Fair'; }
        else if(worst.diffPct <= 50){ badge.classList.add('mid'); badge.textContent='A bit high'; }
        else { badge.classList.add('bad'); badge.textContent='Overpaying'; }

        let noteHtml = rows.map(r=>{
          const tag = r.diffPct<=10 ? '✅' : r.diffPct<=50 ? '⚠️' : '🔴';
          const cmp = r.diffPct>0 ? `+${r.diffPct.toFixed(0)}% vs ${inrFmt2(r.bench)}/day typical` : `within typical (${inrFmt2(r.bench)}/day)`;
          return `<div>${tag} ${r.label}: ${inrFmt2(r.val)}/day — ${cmp}</div>`;
        }).join('');
        if(m.resale>0){
          noteHtml += `<div>💰 Resale credit: −${inrFmt2(-parts.resale)}/day recovered</div>`;
        }
        note.innerHTML = noteHtml;
      }
    }
  });

  const total = members.reduce((s,m)=>s+perDayCost(m),0);
  document.getElementById('totalPerDay').textContent = inrFmt2(total);

  const bd = document.getElementById('breakdown');
  bd.innerHTML = members.map(m=>`<div><span>${escapeHtml(m.name||'(unnamed)')}</span><span>${inrFmt2(perDayCost(m))}/day</span></div>`).join('')
    + `<div style="border-top:1px solid #334155;margin-top:6px;padding-top:6px;"><span>Monthly Total</span><span>${inrFmt(total*30)}</span></div>`;
  renderRecommendation();
}

function renderRecommendation(){
  const recommendation = document.getElementById('recommendation');
  const savings = members.reduce((sum,m)=>{
    if(!hasCosts(m)) return sum;
    const parts = costParts(m);
    const benchmark = benchmarkFor(m);
    return sum + Math.max(0,parts.device-benchmark.device) + Math.max(0,parts.accessories-benchmark.accessories) + Math.max(0,parts.rc-benchmark.rc);
  },0)*30;
  if(savings<1){
    recommendation.textContent = members.some(hasCosts) ? 'Your entered costs are within the typical range. Save a snapshot as a baseline.' : 'Enter device, accessory, resale, or recharge costs to see possible savings.';
    return;
  }
  recommendation.innerHTML = `<strong>Potential saving: ${inrFmt(savings)}/month</strong><br>Review the items marked above typical. That is about ${inrFmt(savings*12)} per year.`;
}

function renderHistory(){
  const list = document.getElementById('historyList');
  let migrated = false;
  history.forEach(h=>{ if(!h.id){ h.id = Date.now().toString(36)+Math.random().toString(36).slice(2,7); migrated = true; } });
  if(migrated) localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  if(!history.length){
    list.innerHTML = '<p class="history-empty">No snapshots yet. Save one after entering costs.</p>';
    return;
  }
  list.innerHTML = history.map((snapshot)=>{
    const id = snapshot.id;
    const date = formatDDMMMYYYY(snapshot.date);
    const savedMembers = Array.isArray(snapshot.members) ? snapshot.members : [];
    const memberCount = Array.isArray(snapshot.members) ? savedMembers.length : snapshot.members;
    const details = savedMembers.length ? savedMembers.map(member=>`
      <div class="history-member">
        <strong>${escapeHtml(member.name)}</strong> · ${inrFmt2(member.perDay||0)}/day · ${inrFmt(member.monthly||0)}/month<br>
        Device ${inrFmt(member.device||0)} · Accessories ${inrFmt(member.accessories||0)} · Wear &amp; Tear ${inrFmt(member.wearTear||0)} · Resale −${inrFmt(member.resale||0)} · Lifespan ${Number(member.years||0)} years<br>
        Recharge ${inrFmt(member.rc||0)} for ${Number(member.rcDays||30)} days · ${escapeHtml(member.type||'smart')}
      </div>`).join('') : '<div class="history-member">This older snapshot has no saved member details.</div>';
    return `<details class="history-row"><summary class="history-summary"><span>${date} · ${memberCount} member${memberCount===1?'':'s'} · ${inrFmt(snapshot.monthly||0)}/month</span><button class="history-del" data-del-id="${id}" onclick="event.preventDefault();event.stopPropagation();deleteHistoryEntry('${id}',this)">✕</button></summary><div class="history-details"><div>Household: ${inrFmt2(snapshot.totalPerDay||0)}/day · ${inrFmt(snapshot.annual||0)}/year</div>${details}</div></details>`;
  }).join('');
}

function formatDDMMMYYYY(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const day = d.getDate();
  const suffix = (day%10===1 && day!==11) ? 'st' : (day%10===2 && day!==12) ? 'nd' : (day%10===3 && day!==13) ? 'rd' : 'th';
  const month = d.toLocaleDateString('en-IN',{month:'short'});
  return `${day}${suffix} ${month} ${d.getFullYear()}`;
}

function escapeHtml(value){
  return value.replace(/[&<>'"]/g, character=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
}

render();
renderHistory();
</script>
</body>
</html>
