<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1412">
<title>Cab Planner · Little Lab</title>
<style>
:root{--bg:#0f1412;--card:#182019;--line:#2a3a2f;--tx:#e8f1ec;--mut:#8ea699;--mint:#a7e8c5;--coral:#ff8c70;box-sizing:border-box}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));max-width:820px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px;color:var(--mint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input{background:#0f1512;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%}
.f{flex:1;min-width:120px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:#0f1512;color:var(--tx);padding:9px 12px;cursor:pointer}
.chip.on{background:var(--mint);color:#0f1412;border-color:var(--mint);font-weight:600}
.btn{background:var(--mint);color:#0f1412;border:0;font-weight:600}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
#sum b{color:var(--mint)}
#sum .lo{color:var(--mint);font-weight:600}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-size:12px;color:var(--mut);font-weight:600}
td.t{font-size:12px;color:var(--mut)}
.cell{width:34px;height:34px;padding:0;border-radius:8px}
.cell.on{background:var(--mint);color:#0f1412;border-color:var(--mint)}
tfoot td{font-weight:700;border-bottom:0}
.low{background:rgba(167,232,197,.15);color:var(--mint)}
.hi{color:var(--coral)}
.act button{padding:6px 9px;font-size:12px;margin-left:4px}
.act .arm{background:var(--coral);color:#0f1412;border-color:var(--coral)}
.empty{color:var(--mut);text-align:center;padding:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--mint);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (hover:hover) and (pointer:fine){.chip:hover,.cell:hover{border-color:var(--mint)}}
</style>
</head>
<body>
<h1>Cab Planner</h1>

<div class="card" id="sum"></div>

<div class="card">
  <div class="row">
    <div class="f" style="flex:2"><label>Name</label><input id="name" placeholder="Name" autocomplete="off"></div>
    <div class="f"><label>Login</label><input id="login" type="time" value="09:00"></div>
    <div class="f"><label>Logout</label><input id="logout" type="time" value="18:00"></div>
  </div>
  <div class="chips" id="dchips"></div>
  <div class="row"><button class="btn" id="save">Add person</button><button class="ghost btn" id="cancel" hidden>Cancel edit</button></div>
</div>

<div class="card wrap" id="grid"></div>
<div id="toast"></div>

<script>
(function(){
const KEY='as_cabplanner_v1', DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let people=[], editId=null, formDays=[0,1,2,3,4], armed=null, armT=null;
const $=id=>document.getElementById(id);
try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))people=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(people))}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(t){if(!t)return'–';let[h,m]=t.split(':').map(Number);const ap=h<12?'am':'pm';h=h%12||12;return h+':'+String(m).padStart(2,'0')+ap}

function renderChips(){$('dchips').innerHTML=DAYS.map((d,i)=>`<button type="button" class="chip${formDays.includes(i)?' on':''}" data-day="${i}">${d}</button>`).join('')}

function render(){
  const counts=DAYS.map((_,i)=>people.filter(p=>p.days.includes(i)).length);
  const active=counts.map((c,i)=>i).filter(i=>counts[i]>0);
  const g=$('grid');
  if(!people.length){g.innerHTML='<div class="empty">Add people above to build the plan.</div>'}
  else{
    const min=Math.min(...counts),max=Math.max(...counts);
    g.innerHTML='<table><thead><tr><th>Name</th><th>In</th><th>Out</th>'+DAYS.map(d=>`<th>${d}</th>`).join('')+'<th></th></tr></thead><tbody>'+
    people.map(p=>`<tr><td>${esc(p.name)}</td><td class="t">${fmt(p.login)}</td><td class="t">${fmt(p.logout)}</td>`+
      DAYS.map((_,i)=>`<td><button class="cell${p.days.includes(i)?' on':''}" data-toggle="${p.id}" data-day="${i}">${p.days.includes(i)?'✓':''}</button></td>`).join('')+
      `<td class="act"><button data-edit="${p.id}">Edit</button><button data-del="${p.id}" class="${armed===p.id?'arm':''}">${armed===p.id?'Sure?':'Delete'}</button></td></tr>`).join('')+
    '</tbody><tfoot><tr><td>People</td><td></td><td></td>'+counts.map(c=>`<td class="${c===min?'low':c===max&&max!==min?'hi':''}">${c}</td>`).join('')+'<td></td></tr></tfoot></table>';
  }
  let s='';
  if(!people.length)s='Add people to see which days are lightest.';
  else{
    const min=Math.min(...active.map(i=>counts[i]));
    const lo=active.filter(i=>counts[i]===min).map(i=>DAYS[i]);
    const hi=Math.max(...counts);
    const hiD=DAYS.filter((_,i)=>counts[i]===hi);
    s=`<div>Lightest: <span class="lo">${lo.join(', ')}</span> · <b>${min}</b> ${min===1?'person':'people'}</div><div style="color:var(--mut);margin-top:4px">Busiest: ${hiD.join(', ')} · ${hi} · Total people: ${people.length}</div>`;
  }
  $('sum').innerHTML=s;
}

function resetForm(){editId=null;$('name').value='';$('login').value='09:00';$('logout').value='18:00';formDays=[0,1,2,3,4];$('save').textContent='Add person';$('cancel').hidden=true;renderChips()}

$('dchips').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;const d=+b.dataset.day;formDays=formDays.includes(d)?formDays.filter(x=>x!==d):[...formDays,d];b.classList.toggle('on')});

$('save').addEventListener('click',()=>{
  const name=$('name').value.trim();
  if(!name){toast('Enter a name');return}
  const rec={name,login:$('login').value,logout:$('logout').value,days:[...formDays].sort()};
  if(editId){const p=people.find(x=>x.id===editId);if(p)Object.assign(p,rec);toast('Updated')}
  else{people.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),...rec});toast('Added')}
  save();resetForm();render();
});
$('cancel').addEventListener('click',resetForm);

$('grid').addEventListener('click',e=>{
  const t=e.target.closest('[data-toggle]'),ed=e.target.closest('[data-edit]'),dl=e.target.closest('[data-del]');
  if(t){const p=people.find(x=>x.id===t.dataset.toggle),d=+t.dataset.day;p.days=p.days.includes(d)?p.days.filter(x=>x!==d):[...p.days,d].sort();save();render()}
  else if(ed){const p=people.find(x=>x.id===ed.dataset.edit);editId=p.id;$('name').value=p.name;$('login').value=p.login;$('logout').value=p.logout;formDays=[...p.days];$('save').textContent='Update person';$('cancel').hidden=false;renderChips();window.scrollTo({top:0,behavior:'smooth'});$('name').focus()}
  else if(dl){const id=dl.dataset.del;
    if(armed===id){people=people.filter(x=>x.id!==id);armed=null;clearTimeout(armT);save();if(editId===id)resetForm();render();toast('Deleted')}
    else{armed=id;clearTimeout(armT);armT=setTimeout(()=>{armed=null;render()},3000);render();toast('Tap again to delete')}}
});

renderChips();render();
})();
</script>
</body>
</html>
