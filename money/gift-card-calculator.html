<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a7e8c5">
<link rel="manifest" href="manifest.webmanifest">
<script src="pwa.js" defer></script>
<title>Gift Card Savings Calculator</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--txt:#e2e8f0;--sub:#94a3b8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:20px;}
  .wrap{max-width:520px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:var(--sub);font-size:13px;margin-top:0;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
  label{display:block;font-size:14px;margin-bottom:6px;font-weight:600;}
  .hint{font-size:12px;color:var(--sub);margin-bottom:8px;}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--txt);font-size:15px;}
  input:focus{outline:2px solid var(--acc);}

  .item{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .item input{flex:1;}
  .item .remove{background:none;border:none;color:var(--bad);font-size:14px;cursor:pointer;}
  button.add{width:100%;padding:10px;border:1px dashed #475569;border-radius:8px;background:transparent;color:var(--txt);font-size:13px;cursor:pointer;margin-top:4px;}

  .offer-line{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid #334155;align-items:center;}
  .offer-line:last-child{border-bottom:none;}
  .best-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(34,197,94,.15);color:var(--acc);font-weight:700;margin-left:6px;}
  .save-amt{font-weight:700;color:var(--acc);}

  .result-box{text-align:center;padding:20px 16px;}
  .result-num{font-size:32px;font-weight:800;color:var(--acc);}
  .result-label{color:var(--sub);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎁 Gift Card Savings Calculator</h1>
  <p class="sub">Compare gift card discount offers before a planned purchase — pick the best upfront off.</p>

  <div class="card">
    <label>Planned Purchase Amount (₹)</label>
    <div class="hint">The amount you intend to spend</div>
    <input type="number" id="purchaseAmt" placeholder="e.g. 10000" oninput="calc()">
  </div>

  <div class="card">
    <label>Gift Card Offers (discount %)</label>
    <div id="offersList"></div>
    <button class="add" onclick="addOffer()">+ Add Offer</button>
  </div>

  <div class="card result-box">
    <div class="result-num" id="bestSaving">₹0</div>
    <div class="result-label" id="bestLabel">Best Offer Savings</div>
  </div>

  <div class="card">
    <label>Comparison</label>
    <div id="comparisonList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gift_card_state_v1';
function inr(n){ return '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:0}); }
function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved && Array.isArray(saved.offers)) return saved;
  }catch(e){}
  return { purchaseAmt:'', offers:[{source:'Amazon Pay', discount:5},{source:'CRED', discount:3}] };
}
const state = loadState();
let offers = state.offers;
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify({purchaseAmt: document.getElementById('purchaseAmt').value, offers})); }

function addOffer(){ offers.push({source:'', discount:0}); save(); renderOffers(); }
function removeOffer(i){ offers.splice(i,1); save(); renderOffers(); }
function updateOffer(i, field, val){
  offers[i][field] = field==='source' ? val : (parseFloat(val)||0);
  save();
  calc();
}

function renderOffers(){
  const c = document.getElementById('offersList');
  c.innerHTML = offers.map((o,i)=>`
    <div class="item">
      <input placeholder="Source (e.g. Amazon Pay)" value="${o.source}" oninput="updateOffer(${i},'source',this.value)">
      <input type="number" placeholder="%" style="max-width:80px;" value="${o.discount}" oninput="updateOffer(${i},'discount',this.value)">
      <button class="remove" onclick="removeOffer(${i})">✕</button>
    </div>
  `).join('');
  calc();
}

function calc(){
  save();
  const amt = parseFloat(document.getElementById('purchaseAmt').value) || 0;
  const valid = offers.filter(o=>o.source);

  let best = null;
  valid.forEach(o=>{
    const saving = amt * (o.discount/100);
    if(!best || saving > best.saving) best = {...o, saving};
  });

  document.getElementById('bestSaving').textContent = inr(best ? best.saving : 0);
  document.getElementById('bestLabel').textContent = best ? `Best: ${best.source} (${best.discount}% off)` : 'Best Offer Savings';

  const list = document.getElementById('comparisonList');
  list.innerHTML = valid.map(o=>{
    const saving = amt * (o.discount/100);
    const isBest = best && o.source===best.source && o.discount===best.discount;
    return `<div class="offer-line">
      <span>${o.source} — ${o.discount}%${isBest?'<span class="best-tag">BEST</span>':''}</span>
      <span class="save-amt">${inr(saving)}</span>
    </div>`;
  }).join('');
}

document.getElementById('purchaseAmt').value = state.purchaseAmt || '';
renderOffers();
</script>
</body>
</html>
