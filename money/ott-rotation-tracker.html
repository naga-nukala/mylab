<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a7e8c5">
<link rel="manifest" href="manifest.webmanifest">
<script src="pwa.js" defer></script>
<title>OTT Rotation Tracker</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--txt:#e2e8f0;--sub:#94a3b8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:20px;padding-bottom:80px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:var(--sub);font-size:13px;margin-top:0;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
  .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .summary .box{text-align:center;background:#0f172a;border-radius:10px;padding:14px;}
  .summary .n{font-size:20px;font-weight:800;}
  .summary .l{font-size:11px;color:var(--sub);margin-top:2px;}

  .item{border-bottom:1px solid #334155;padding-bottom:14px;margin-bottom:14px;}
  .item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .name-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
  .name-row input.name{font-weight:700;font-size:15px;flex:1;}
  .toggle{display:flex;align-items:center;gap:6px;}
  .toggle input{width:auto;}
  .row{display:flex;gap:8px;margin-bottom:8px;}
  .field{flex:1;min-width:0;}
  label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}
  input, select{width:100%;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--txt);font-size:13px;}
  input[type=date]{color-scheme:dark;}
  input:focus, select:focus{outline:2px solid var(--acc);}
  .status-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .active-badge{background:rgba(34,197,94,.15);color:var(--acc);}
  .paused-badge{background:rgba(148,163,184,.15);color:var(--sub);}
  .meta{font-size:12px;color:var(--sub);line-height:1.6;margin:4px 0 8px;}
  .meta .warn{color:var(--warn);font-weight:700;}
  .meta .bad{color:var(--bad);font-weight:700;}
  .meta .ok{color:var(--acc);font-weight:700;}
  .actions{display:flex;gap:6px;}
  .actions button{flex:1;padding:7px;font-size:12px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:var(--txt);cursor:pointer;}
  .actions button.renew{border-color:var(--acc);color:var(--acc);}
  .actions button.del{color:var(--bad);}
  .actions button.del.confirming{background:var(--bad);color:#fff;border-color:var(--bad);}
  button.add{width:100%;padding:12px;border:1px dashed #475569;border-radius:10px;background:transparent;color:var(--txt);font-size:14px;cursor:pointer;margin-bottom:12px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#334155;color:var(--txt);padding:10px 18px;border-radius:20px;font-size:13px;display:none;z-index:50;white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📺 OTT Rotation Tracker</h1>
  <p class="sub">Only run 1-2 OTTs at a time. Finish the watchlist, pause, rotate to the next.</p>

  <div class="card">
    <div class="summary">
      <div class="box"><div class="n" id="activeSpend">₹0</div><div class="l">Active Spend/mo</div></div>
      <div class="box"><div class="n" id="allSpend">₹0</div><div class="l">If All Active/mo</div></div>
      <div class="box"><div class="n" id="saved" style="color:var(--acc);">₹0</div><div class="l">Saved by Rotating/mo</div></div>
      <div class="box"><div class="n" id="totalSpent" style="color:var(--warn);">₹0</div><div class="l">Total Spent on OTTs</div></div>
    </div>
  </div>

  <div class="card" id="ottContainer"></div>
  <button class="add" data-act="add">+ Add OTT Platform</button>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'ott_rotation_platforms_v1';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function inr(n){ return '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:0}); }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function ordinal(d){ if(d>=11&&d<=13) return d+'th'; return d + ({1:'st',2:'nd',3:'rd'}[d%10]||'th'); }
function fmtDate(s){ const d=parseISO(s); return d ? `${ordinal(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : '—'; }
function daysLeft(s){ const d=parseISO(s); if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }

function normalize(p){
  return {
    name:p.name||'', cost:Number(p.cost)||0, active:!!p.active, watchlist:p.watchlist||'',
    start:p.start||'', end:p.end||'', paid:Number(p.paid)||0,
    history:Array.isArray(p.history)?p.history:[]
  };
}
function loadPlatforms(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(saved) && saved.length) return saved.map(normalize);
  }catch(e){}
  return [
    normalize({name:'Amazon Prime', cost:299, active:true}),
    normalize({name:'Netflix', cost:499, active:false})
  ];
}
let platforms = loadPlatforms();
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(platforms)); }catch(e){} }

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',2000);
}

function platformTotal(p){ return p.history.reduce((s,h)=>s+(h.paid||0),0) + (p.paid||0); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML.replace(/"/g,'&quot;'); }

function metaHTML(p){
  const parts=[];
  if(p.end){
    const dl=daysLeft(p.end);
    let status;
    if(dl<0) status=`<span class="bad">Expired ${Math.abs(dl)} day${Math.abs(dl)===1?'':'s'} ago</span>`;
    else if(dl===0) status='<span class="warn">Ends today</span>';
    else if(dl<=7) status=`<span class="warn">Ends in ${dl} day${dl===1?'':'s'}</span>`;
    else status=`<span class="ok">${dl} days left</span>`;
    parts.push(`Subscription: ${fmtDate(p.start)} → ${fmtDate(p.end)} · ${status}`);
  } else if(p.start){
    parts.push(`Started ${fmtDate(p.start)} · no end date set`);
  }
  const past=p.history.length;
  parts.push(`Spent on ${esc(p.name)||'this OTT'}: <strong>${inr(platformTotal(p))}</strong>${past?` (${past} past period${past===1?'':'s'})`:''}`);
  return parts.join('<br>');
}

function updateSummary(){
  const activeSpend = platforms.filter(p=>p.active).reduce((s,p)=>s+p.cost,0);
  const allSpend = platforms.reduce((s,p)=>s+p.cost,0);
  const total = platforms.reduce((s,p)=>s+platformTotal(p),0);
  document.getElementById('activeSpend').textContent = inr(activeSpend);
  document.getElementById('allSpend').textContent = inr(allSpend);
  document.getElementById('saved').textContent = inr(allSpend-activeSpend);
  document.getElementById('totalSpent').textContent = inr(total);
}

function updateInPlace(i){
  const div=document.querySelector(`.item[data-index="${i}"]`); if(!div) return;
  const p=platforms[i];
  const badge=div.querySelector('[data-role="badge"]');
  badge.className='status-badge '+(p.active?'active-badge':'paused-badge');
  badge.textContent=p.active?'Active':'Paused';
  div.querySelector('[data-role="meta"]').innerHTML=metaHTML(p);
}

function render(){
  const c=document.getElementById('ottContainer');
  c.innerHTML = platforms.length ? platforms.map((p,i)=>`
    <div class="item" data-index="${i}">
      <div class="name-row">
        <input class="name" data-f="name" placeholder="Platform name" value="${esc(p.name)}">
        <span class="status-badge ${p.active?'active-badge':'paused-badge'}" data-role="badge">${p.active?'Active':'Paused'}</span>
      </div>
      <div class="row">
        <div class="field"><label>Monthly Cost (₹)</label><input type="number" data-f="cost" value="${p.cost}"></div>
        <div class="field"><label>Amount Paid This Period (₹)</label><input type="number" data-f="paid" value="${p.paid||''}" placeholder="e.g. 299"></div>
      </div>
      <div class="row">
        <div class="field"><label>Subscription Start</label><input type="date" data-f="start" value="${p.start}"></div>
        <div class="field"><label>Subscription End</label><input type="date" data-f="end" value="${p.end}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Watchlist / What's Pending</label><input type="text" data-f="watchlist" placeholder="e.g. Finish Season 2" value="${esc(p.watchlist)}"></div>
        <div class="field"><label>Status</label>
          <div class="toggle" style="padding-top:8px;"><input type="checkbox" data-f="active" id="active-${i}" ${p.active?'checked':''}><label for="active-${i}" style="margin:0;">Currently Active</label></div>
        </div>
      </div>
      <div class="meta" data-role="meta">${metaHTML(p)}</div>
      <div class="actions">
        <button class="renew" data-act="renew">↻ Renew / New Period</button>
        <button class="del" data-act="del">✕ Delete</button>
      </div>
    </div>`).join('') : '<div style="text-align:center;color:var(--sub);font-size:13px;padding:12px;">No platforms yet.</div>';
  updateSummary();
}

const container=document.getElementById('ottContainer');
function onField(e){
  const el=e.target; const f=el.dataset.f; if(!f) return;
  const i=Number(el.closest('.item').dataset.index); const p=platforms[i];
  if(f==='active') p.active=el.checked;
  else if(f==='cost'||f==='paid') p[f]=parseFloat(el.value)||0;
  else p[f]=el.value;
  save(); updateInPlace(i); updateSummary();
}
container.addEventListener('input',onField);
container.addEventListener('change',onField);

const pending={};
container.addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const i=Number(btn.closest('.item').dataset.index); const p=platforms[i];
  if(btn.dataset.act==='renew'){
    if(p.start||p.end||p.paid) p.history.push({start:p.start,end:p.end,paid:p.paid});
    p.start=p.end||''; p.end=''; p.paid=0; p.active=true;
    save(); render(); toast('Previous period archived — set new dates');
  } else if(btn.dataset.act==='del'){
    const key='d'+i;
    if(pending[key]){
      clearTimeout(pending[key]); delete pending[key];
      platforms.splice(i,1); save(); render(); toast('Platform deleted');
    } else {
      btn.textContent='✔ Tap again to confirm'; btn.classList.add('confirming');
      toast('Tap Delete again to confirm');
      pending[key]=setTimeout(()=>{ delete pending[key]; btn.textContent='✕ Delete'; btn.classList.remove('confirming'); },2500);
    }
  }
});
document.querySelector('[data-act="add"]').addEventListener('click',()=>{
  platforms.push(normalize({})); save(); render();
});

render();
</script>
</body>
</html>
