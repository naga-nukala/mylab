<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1412">
<title>Flat &amp; Plot Rates</title>
<style>
:root{
  --bg:#0f1412; --card:#171e1b; --card2:#1e2723; --line:#2a3631;
  --text:#e8f0ec; --muted:#8fa39a; --mint:#a7e8c5; --coral:#ff8c70;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.sec{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600}

/* summary */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--card2);border-radius:10px;padding:10px}
.sum b{display:block;font-size:18px;color:var(--mint)}
.sum span{font-size:12px;color:var(--muted)}

/* form */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.seg button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--mint);color:#0f1412;border-color:var(--mint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;min-height:42px}
textarea{resize:vertical;min-height:64px}
.note{font-size:12px;color:var(--text);opacity:.85;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
input[type=month]{color-scheme:dark}
.calc{margin-top:10px;font-size:13px;color:var(--muted);min-height:20px}
.calc b{color:var(--mint)}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:10px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--mint);color:#0f1412}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);flex:0 0 auto}
.err{color:var(--coral);font-size:13px;margin-top:8px;min-height:18px}

/* chips */
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--mint);color:var(--mint)}

/* area metrics */
.sg{background:var(--card2);border-radius:12px;margin-bottom:8px;overflow:hidden}
.sg-h{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:10px 12px;cursor:pointer}
.sg-l1{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.sg-l1 .nm{font-weight:600;overflow-wrap:anywhere}
.sg-l1 .rg{margin-left:auto;color:var(--muted);font-size:12px}
.chev{font-size:10px;color:var(--muted);transition:transform .15s}
.sg.open .chev{transform:rotate(90deg)}
.sg-l2{font-size:12px;color:var(--muted);margin-top:4px}
.sg-b{display:none;padding:10px 12px 12px;border-top:1px solid var(--line)}
.sg.open .sg-b{display:block}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.Plot{background:rgba(167,232,197,.15);color:var(--mint)}
.tag.Field{background:rgba(232,213,143,.15);color:#e8d58f}
.tag.Flat{background:rgba(255,140,112,.15);color:var(--coral)}
.cnt{font-size:12px;color:var(--muted)}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.mets div b{display:block;font-size:14px}
.mets div span{font-size:11px;color:var(--muted)}
.trend{margin-top:6px;font-size:12px;color:var(--muted)}
.up{color:var(--coral)} .down{color:var(--mint)}

/* entries */
.item{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .l{min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .d{font-size:12px;color:var(--muted)}
.item .r{text-align:right;white-space:nowrap}
.item .r b{color:var(--mint)}
.acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.sm{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.sm.del.arm{background:var(--coral);color:#0f1412;border-color:var(--coral)}
@media (hover:hover) and (pointer:fine){
  .sm:hover,.chip:hover,.seg button:not(.on):hover{border-color:var(--mint)}
  .btn:hover{filter:brightness(1.08)}
}
.photos{margin-top:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card2);padding:0;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:99px;border:0;background:rgba(15,20,18,.85);color:var(--coral);font-size:14px;line-height:22px;padding:0;cursor:pointer}
.item .thumbs{justify-content:flex-end;margin-top:6px}
.item .th{width:44px;height:44px;border-radius:8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;cursor:zoom-out}
#lb.show{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
.chartbox{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chartbox svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:99px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--mint);color:#0f1412;padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:420px){.mets{grid-template-columns:repeat(2,1fr);row-gap:8px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Flat &amp; Plot Rates</h1>
  <p class="sub">Log rates you come across and compare them area by area. Stays on this device.</p>

  <div class="card"><div class="sum" id="sum"></div></div>

  <div class="card">
    <p class="sec" id="formTitle">Add a rate</p>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="Plot" class="on">Plot</button>
      <button type="button" data-type="Flat">Flat</button>
      <button type="button" data-type="Field">Field</button>
    </div>
    <div class="grid">
      <div class="full"><label for="place">Place</label><input id="place" list="places" placeholder="e.g. Gajwel" autocomplete="off"><datalist id="places"></datalist></div>
      <div><label for="month">Month - Year</label><input id="month" type="month"></div>
      <div id="yardsWrap"><label for="yards">Yards (sq yd)</label><input id="yards" type="number" inputmode="decimal" min="0" step="any" placeholder="200"></div>
      <div id="acresWrap" hidden><label for="acres">No. of acres</label><input id="acres" type="number" inputmode="decimal" min="0" step="any" placeholder="2.5"></div>
      <div><label for="rate" id="rateLbl">Rate per sq yd (₹)</label><input id="rate" type="number" inputmode="decimal" min="0" step="any" placeholder="15000"></div>
      <div id="priceWrap" hidden><label for="price">Flat price (₹)</label><input id="price" type="number" inputmode="decimal" min="0" step="any" placeholder="4500000"></div>
      <div id="rentWrap" hidden><label for="rent">Monthly rent (₹)</label><input id="rent" type="number" inputmode="decimal" min="0" step="any" placeholder="18000"></div>
      <div class="full"><label for="notes">Notes</label><textarea id="notes" rows="2" placeholder="Facing, road width, owner contact, anything to remember"></textarea></div>
    </div>
    <div class="photos">
      <label>Photos (layout, brochure, board)</label>
      <button class="sm" id="addImg" type="button">+ Add photo</button>
      <input id="imgInput" type="file" accept="image/*" multiple hidden>
      <div class="thumbs" id="formImgs"></div>
    </div>
    <div class="calc" id="calc"></div>
    <div class="err" id="err"></div>
    <div class="row">
      <button class="btn" id="save" type="button">Save rate</button>
      <button class="btn ghost" id="cancel" type="button" hidden>Cancel edit</button>
    </div>
  </div>

  <div class="chips" id="chips">
    <button class="chip on" data-f="All">All</button>
    <button class="chip" data-f="Plot">Plot</button>
    <button class="chip" data-f="Flat">Flat</button>
    <button class="chip" data-f="Field">Field</button>
  </div>

  <div class="card">
    <p class="sec">Lowest rate by place</p>
    <div class="chips" id="cchips">
      <button class="chip on" data-c="All">All</button>
      <button class="chip" data-c="Plot">Plot</button>
      <button class="chip" data-c="Flat">Flat</button>
      <button class="chip" data-c="Field">Field</button>
    </div>
    <div class="chartbox" id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card"><p class="sec">Area-wise metrics</p><div id="areas"></div></div>
  <div class="card"><p class="sec">All entries</p><div id="list"></div></div>
</div>
<div id="lb"><img alt="Photo"></div>
<div id="toast"></div>

<script>
(function(){
  var KEY='flat_plot_rates_v1';
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var state={items:[],filter:'All',chartFilter:'All'};
  var form={type:'Plot',editId:null,images:[]};
  var armTimer=null, armId=null;

  function $(id){return document.getElementById(id)}
  function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
  function inr(n){return Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
  function rs(n){return '₹'+inr(Math.round(n))}
  function monthLabel(m){var p=(m||'').split('-');return p.length===2?MON[+p[1]-1]+' '+p[0]:'-'}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  function load(){
    try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.items)){state.items=s.items;state.filter=s.filter||'All';state.chartFilter=s.chartFilter||'All'}}catch(e){}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Storage full. Remove some photos.');return false}}

  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},1800)}

  /* effective numbers for an entry */
  function calc(it){
    var y=+it.yards||0, r=+it.rate||0, p=+it.price||0;
    if(it.type==='Field')return {rate:r,total:(+it.acres||0)*r,yld:0};
    var rate=r, total=0;
    if(it.type==='Flat'){
      total=p||(y&&r?y*r:0);
      if(!rate&&y&&p)rate=p/y;
    }else{
      total=y&&r?y*r:0;
    }
    var yld=0;
    if(it.type==='Flat'&&+it.rent>0&&total>0)yld=(+it.rent*12)/total*100;
    return {rate:rate,total:total,yld:yld};
  }

  /* form */
  function setType(t){
    form.type=t;
    var bs=$('typeSeg').querySelectorAll('button');
    for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].dataset.type===t);
    $('priceWrap').hidden=(t!=='Flat');$('rentWrap').hidden=(t!=='Flat');
    $('yardsWrap').hidden=(t==='Field');$('acresWrap').hidden=(t!=='Field');
    $('rateLbl').textContent=t==='Field'?'Price per acre (₹)':'Rate per sq yd (₹)';
    liveCalc();
  }
  function readForm(){
    return {type:form.type,place:$('place').value.trim(),month:$('month').value,
      yards:form.type==='Field'?0:num($('yards').value),acres:form.type==='Field'?num($('acres').value):0,rate:num($('rate').value),price:form.type==='Flat'?num($('price').value):0,rent:form.type==='Flat'?num($('rent').value):0,notes:$('notes').value.trim(),images:form.images.slice()};
  }
  function liveCalc(){
    var it=readForm(),c=calc(it),out=[];
    if(c.total)out.push('Total value: <b>'+rs(c.total)+'</b>');
    if(c.yld)out.push('Rental yield: <b>'+c.yld.toFixed(2)+'%</b> a year');
    if(it.type==='Flat'&&!it.rate&&c.rate)out.push('Rate: <b>'+rs(c.rate)+'</b>/sq yd');
    if(it.type==='Flat'&&it.price&&it.yards&&it.rate){
      var diff=it.price-it.yards*it.rate;
      if(Math.abs(diff)>1)out.push('Price vs yards × rate: <b>'+(diff>0?'+':'-')+rs(Math.abs(diff))+'</b>');
    }
    $('calc').innerHTML=out.join(' &nbsp;·&nbsp; ');
  }
  function resetForm(){
    form.editId=null;form.images=[];renderFormImgs();
    $('place').value='';$('yards').value='';$('rate').value='';$('price').value='';$('rent').value='';$('acres').value='';$('notes').value='';
    $('formTitle').textContent='Add a rate';
    $('save').textContent='Save rate';
    $('cancel').hidden=true;$('err').textContent='';
    var d=new Date();
    $('month').value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
    liveCalc();
  }
  function submit(){
    var it=readForm(),c=calc(it);
    if(!it.place){$('err').textContent='Enter the place.';return}
    if(!it.month){$('err').textContent='Pick the month and year.';return}
    if(it.type==='Field'?!it.acres:!it.yards){$('err').textContent=it.type==='Field'?'Enter the number of acres.':'Enter the yards.';return}
    if(!c.rate){$('err').textContent=it.type==='Flat'?'Enter the rate per sq yd or the flat price.':it.type==='Field'?'Enter the price per acre.':'Enter the rate per sq yd.';return}
    $('err').textContent='';
    var prev=state.items.slice(),wasEdit=!!form.editId;
    if(wasEdit){
      for(var i=0;i<state.items.length;i++)if(state.items[i].id===form.editId){it.id=form.editId;state.items[i]=it}
    }else{
      it.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      state.items.push(it);
    }
    if(!save()){state.items=prev;return}
    toast(wasEdit?'Updated':'Saved');
    resetForm();renderAll();
  }
  function startEdit(id){
    var it=state.items.filter(function(x){return x.id===id})[0];if(!it)return;
    form.editId=id;setType(it.type);
    $('place').value=it.place;$('month').value=it.month;
    $('yards').value=it.yards||'';$('rate').value=it.rate||'';$('price').value=it.price||'';$('rent').value=it.rent||'';$('acres').value=it.acres||'';$('notes').value=it.notes||'';
    form.images=(it.images||[]).slice();renderFormImgs();
    $('formTitle').textContent='Edit rate';$('save').textContent='Update rate';$('cancel').hidden=false;
    liveCalc();window.scrollTo({top:0,behavior:'smooth'});
  }
  function del(id,btn){
    if(armId===id){
      state.items=state.items.filter(function(x){return x.id!==id});
      armId=null;clearTimeout(armTimer);
      if(form.editId===id)resetForm();
      save();renderAll();toast('Deleted');return;
    }
    armId=id;btn.textContent='Tap again';btn.classList.add('arm');
    clearTimeout(armTimer);
    armTimer=setTimeout(function(){armId=null;btn.textContent='Delete';btn.classList.remove('arm')},2500);
  }

  /* metrics */
  function filtered(){return state.items.filter(function(x){return state.filter==='All'||x.type===state.filter})}

  function renderSummary(){
    var items=filtered(),isF=state.filter==='Field';
    var rates=items.filter(function(x){return (x.type==='Field')===isF}).map(function(x){return calc(x).rate}).filter(Boolean);
    var places={};items.forEach(function(x){places[x.place.toLowerCase()]=1});
    var avg=rates.length?rates.reduce(function(a,b){return a+b},0)/rates.length:0;
    $('sum').innerHTML=
      '<div><b>'+items.length+'</b><span>Entries</span></div>'+
      '<div><b>'+Object.keys(places).length+'</b><span>Areas</span></div>'+
      '<div><b>'+(avg?rs(avg):'-')+'</b><span>'+(isF?'Avg price / acre':'Avg rate / sq yd')+'</span></div>';
  }

  function yieldHtml(t,arr){
    if(t!=='Flat')return '';
    var ys=[],rents=[];
    arr.forEach(function(x){var c=calc(x);if(c.yld){ys.push(c.yld);rents.push(+x.rent)}});
    if(!ys.length)return '';
    var sum=function(a){return a.reduce(function(p,q){return p+q},0)};
    return '<div class="trend">Rental yield: avg <b>'+(sum(ys)/ys.length).toFixed(2)+'%</b> · best '+Math.max.apply(null,ys).toFixed(2)+'% · avg rent '+rs(sum(rents)/rents.length)+'/mo ('+ys.length+(ys.length===1?' entry':' entries')+')</div>';
  }
  var openSeg={};
  function renderAreas(){
    var items=filtered(),groups={};
    items.forEach(function(x){
      var pk=x.place.toLowerCase();
      var g=groups[pk]||(groups[pk]={name:x.place,segs:{}});
      (g.segs[x.type]||(g.segs[x.type]=[])).push(x);
    });
    var names=Object.keys(groups).sort(function(a,b){return groups[a].name.localeCompare(groups[b].name)});
    if(!names.length){$('areas').innerHTML='<div class="empty">Add a rate to see area-wise metrics.</div>';return}
    var h='';
    names.forEach(function(k){
      var g=groups[k];
      ['Plot','Flat','Field'].forEach(function(t){
        var arr=g.segs[t];if(!arr)return;
        var rows=arr.map(function(x){return {m:x.month,r:calc(x).rate}}).filter(function(x){return x.r});
        if(!rows.length)return;
        var rs_=rows.map(function(x){return x.r});
        var avg=rs_.reduce(function(a,b){return a+b},0)/rs_.length;
        var min=Math.min.apply(null,rs_),max=Math.max.apply(null,rs_);
        var byM={};rows.forEach(function(x){(byM[x.m]=byM[x.m]||[]).push(x.r)});
        var ms=Object.keys(byM).sort();
        var mAvg=ms.map(function(m){var a=byM[m];return a.reduce(function(p,q){return p+q},0)/a.length});
        var latest=mAvg[mAvg.length-1];
        var trend;
        if(ms.length>1){
          var ch=(latest-mAvg[0])/mAvg[0]*100;
          trend='From '+monthLabel(ms[0])+' to '+monthLabel(ms[ms.length-1])+': <span class="'+(ch>=0?'up':'down')+'">'+(ch>=0?'▲ +':'▼ ')+ch.toFixed(1)+'%</span> ('+rs(mAvg[0])+' → '+rs(latest)+')';
        }else{trend='Only '+monthLabel(ms[0])+' so far, add another month to see the trend.'}
        var key=t+'|'+k,open=!!openSeg[key];
        h+='<div class="sg'+(open?' open':'')+'" data-key="'+esc(key)+'">'+
          '<button type="button" class="sg-h" data-act="seg" aria-expanded="'+open+'">'+
          '<div class="sg-l1"><span class="tag '+t+'">'+t+'</span><span class="nm">'+esc(g.name)+'</span>'+
          '<span class="rg">Lowest '+amt(min)+' · Highest '+amt(max)+'</span><span class="chev">▶</span></div>'+
          '<div class="sg-l2">'+trend+'</div></button>'+
          '<div class="sg-b"><div class="mets"><div><b>'+rs(avg)+'</b><span>Average</span></div><div><b>'+rs(min)+'</b><span>Lowest</span></div><div><b>'+rs(max)+'</b><span>Highest</span></div><div><b>'+rs(latest)+'</b><span>Latest ('+monthLabel(ms[ms.length-1])+')</span></div></div>'+
          '<div class="trend">'+rows.length+(rows.length===1?' entry':' entries')+' · per '+(t==='Field'?'acre':'sq yd')+'</div>'+
          yieldHtml(t,arr)+'</div></div>';
      });
    });
    $('areas').innerHTML=h;
  }

  function renderList(){
    var items=filtered().slice().sort(function(a,b){return a.month<b.month?1:a.month>b.month?-1:0});
    if(!items.length){$('list').innerHTML='<div class="empty">No rates yet. Add your first one above.</div>';return}
    $('list').innerHTML=items.map(function(x){
      var c=calc(x);
      return '<div class="item"><div class="l"><div class="t"><span class="tag '+x.type+'">'+x.type+'</span> '+esc(x.place)+'</div>'+
        '<div class="d">'+monthLabel(x.month)+' · '+(x.type==='Field'?inr(x.acres)+' acres':inr(x.yards)+' sq yd')+(x.type==='Flat'&&x.price?' · Flat '+rs(x.price):'')+(x.type==='Flat'&&x.rent?' · Rent '+rs(x.rent)+'/mo':'')+'</div>'+(x.notes?'<div class="note">'+esc(x.notes)+'</div>':'')+'</div>'+
        '<div class="r"><b>'+rs(c.rate)+'</b>'+(x.type==='Field'?'/acre':'/sq yd')+'<div class="d">Total '+(c.total?rs(c.total):'-')+'</div>'+
        (c.yld?'<div class="d">Yield <b>'+c.yld.toFixed(2)+'%</b></div>':'')+
        thumbsHtml(x.images||[],x.id,false)+
        '<div class="acts"><button class="sm" data-act="edit" data-id="'+x.id+'">Edit</button><button class="sm del" data-act="del" data-id="'+x.id+'">Delete</button></div></div></div>';
    }).join('');
  }

  function renderPlaces(){
    var seen={},o='';
    state.items.forEach(function(x){var k=x.place.toLowerCase();if(!seen[k]){seen[k]=1;o+='<option value="'+esc(x.place)+'">'}});
    $('places').innerHTML=o;
  }

  function renderAll(){
    var cs=$('chips').querySelectorAll('.chip');
    for(var i=0;i<cs.length;i++)cs[i].classList.toggle('on',cs[i].dataset.f===state.filter);
    renderSummary();renderAreas();renderList();renderPlaces();renderChart();
  }

  /* images */
  function thumbsHtml(imgs,id,removable){
    if(!imgs.length)return '';
    var inner=imgs.map(function(src,i){
      return '<div class="th" '+(removable?'':'data-act="view" data-id="'+id+'" data-i="'+i+'"')+'>'+
        '<img src="'+src+'" alt="Photo '+(i+1)+'" '+(removable?'data-act="view-form" data-i="'+i+'"':'')+'>'+
        (removable?'<button class="x" type="button" data-act="rm-img" data-i="'+i+'" aria-label="Remove photo">×</button>':'')+'</div>';
    }).join('');
    return removable?inner:'<div class="thumbs">'+inner+'</div>';
  }
  function renderFormImgs(){$('formImgs').innerHTML=thumbsHtml(form.images,'',true)}
  function shrink(file){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onerror=rej;
      fr.onload=function(){
        var im=new Image();
        im.onerror=rej;
        im.onload=function(){
          var M=1000,w=im.width,h=im.height,k=Math.min(1,M/Math.max(w,h));
          var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',0.7));
        };
        im.src=fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function addFiles(files){
    var list=Array.prototype.slice.call(files);
    Promise.all(list.map(function(f){return shrink(f).catch(function(){return null})})).then(function(arr){
      var ok=arr.filter(Boolean);
      if(ok.length<list.length)toast('Some files could not be read');
      form.images=form.images.concat(ok);renderFormImgs();
    });
  }
  function showImg(src){var lb=$('lb');lb.querySelector('img').src=src;lb.classList.add('show')}

  /* chart */
  function amt(n){
    if(n>=1e7)return '₹'+(n/1e7).toFixed(2).replace(/\.?0+$/,'')+' Cr';
    if(n>=1e5)return '₹'+(n/1e5).toFixed(2).replace(/\.?0+$/,'')+' L';
    return '₹'+inr(Math.round(n));
  }
  function niceMax(v){
    if(v<=0)return 1;
    var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)),m=v/p;
    return (m<=1?1:m<=2?2:m<=5?5:10)*p;
  }
  var COL={Plot:'var(--mint)',Flat:'var(--coral)',Field:'#e8d58f'};
  function renderChart(){
    var cf=state.chartFilter||'All';
    var cs=$('cchips').querySelectorAll('.chip');
    for(var i=0;i<cs.length;i++)cs[i].classList.toggle('on',cs[i].dataset.c===cf);
    var types=cf==='All'?['Plot','Flat','Field']:[cf];
    var map={};
    state.items.forEach(function(x){
      if(types.indexOf(x.type)<0)return;
      var r=calc(x).rate;if(!r)return;
      var k=x.place.toLowerCase(),g=map[k]||(map[k]={name:x.place});
      if(g[x.type]===undefined||r<g[x.type])g[x.type]=r;
    });
    var places=Object.keys(map).map(function(k){return map[k]});
    if(!places.length){$('chart').innerHTML='<div class="empty">No rates to plot yet.</div>';$('legend').innerHTML='';return}
    if(cf==='All')places.sort(function(a,b){return a.name.localeCompare(b.name)});
    else places.sort(function(a,b){return a[cf]-b[cf]});
    var series=types.filter(function(t){return places.some(function(p){return p[t]!==undefined})});
    var hasField=series.indexOf('Field')>-1,hasOther=series.some(function(t){return t!=='Field'});
    var right=hasField&&hasOther;
    function axisOf(t){return right&&t==='Field'?'R':'L'}
    var maxL=0,maxR=0;
    series.forEach(function(t){places.forEach(function(p){
      if(p[t]===undefined)return;
      if(axisOf(t)==='R')maxR=Math.max(maxR,p[t]);else maxL=Math.max(maxL,p[t]);
    })});
    maxL=niceMax(maxL*1.15);maxR=niceMax(maxR*1.15);
    var ml=64,mr=right?64:18,mt=28,mb=56,H=300,n=places.length;
    var W=Math.max($('chart').clientWidth||320,ml+mr+n*80);
    var pw=W-ml-mr,ph=H-mt-mb,slot=pw/n;
    function X(i){return ml+slot*(i+0.5)}
    function Y(v,ax){return mt+ph*(1-v/(ax==='R'?maxR:maxL))}
    var g='';
    for(var t=0;t<=4;t++){
      var yy=mt+ph*(1-t/4);
      g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+yy+'" y2="'+yy+'" style="stroke:var(--line)"/>';
      g+='<text x="'+(ml-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+amt(maxL*t/4)+'</text>';
      if(right)g+='<text x="'+(W-mr+8)+'" y="'+(yy+4)+'" font-size="11" style="fill:#e8d58f">'+amt(maxR*t/4)+'</text>';
    }
    places.forEach(function(p,i){
      var nm=p.name.length>12?p.name.slice(0,11)+'…':p.name;
      g+='<text x="'+X(i)+'" y="'+(mt+ph+22)+'" text-anchor="middle" font-size="12" style="fill:var(--text)"><title>'+esc(p.name)+'</title>'+esc(nm)+'</text>';
    });
    series.forEach(function(t){
      var ax=axisOf(t),d='',run=false;
      places.forEach(function(p,i){
        if(p[t]===undefined){run=false;return}
        d+=(run?'L':'M')+X(i).toFixed(1)+' '+Y(p[t],ax).toFixed(1)+' ';run=true;
      });
      g+='<path d="'+d+'" fill="none" stroke-width="2" style="stroke:'+COL[t]+'"/>';
      places.forEach(function(p,i){
        if(p[t]===undefined)return;
        var cx=X(i),cy=Y(p[t],ax),below=(t==='Flat'&&cf==='All');
        g+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5" style="fill:'+COL[t]+';stroke:var(--card)" stroke-width="1.5"/>';
        g+='<text x="'+cx.toFixed(1)+'" y="'+(below?cy+18:cy-10).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--text);stroke:var(--card);stroke-width:3px;paint-order:stroke">'+amt(p[t])+'</text>';
      });
    });
    $('chart').innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Lowest rate by place">'+g+'</svg>';
    var lg='';
    series.forEach(function(t){
      lg+='<span><i style="background:'+COL[t]+'"></i>'+t+' (₹ per '+(t==='Field'?'acre':'sq yd')+(right&&t==='Field'?', right axis':'')+')</span>';
    });
    $('legend').innerHTML=lg;
  }

  /* events */
  $('typeSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setType(b.dataset.type)});
  $('chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;state.filter=b.dataset.f;save();renderAll()});
  ['yards','acres','rate','price','rent','place','month'].forEach(function(id){$(id).addEventListener('input',liveCalc)});
  $('addImg').addEventListener('click',function(){$('imgInput').click()});
  $('imgInput').addEventListener('change',function(e){if(e.target.files.length)addFiles(e.target.files);e.target.value=''});
  $('formImgs').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    var i=+b.dataset.i;
    if(b.dataset.act==='rm-img'){form.images.splice(i,1);renderFormImgs()}
    else if(b.dataset.act==='view-form')showImg(form.images[i]);
  });
  $('lb').addEventListener('click',function(){this.classList.remove('show')});
  $('cchips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;state.chartFilter=b.dataset.c;save();renderChart()});
  var rzT;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(renderChart,150)});
  $('areas').addEventListener('click',function(e){
    var b=e.target.closest('[data-act="seg"]');if(!b)return;
    var box=b.parentNode,k=box.dataset.key,on=!box.classList.contains('open');
    box.classList.toggle('open',on);b.setAttribute('aria-expanded',on);
    if(on)openSeg[k]=1;else delete openSeg[k];
  });
  $('save').addEventListener('click',submit);
  $('cancel').addEventListener('click',function(){resetForm();toast('Edit cancelled')});
  $('list').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='edit')startEdit(b.dataset.id);
    else if(b.dataset.act==='del')del(b.dataset.id,b);
    else if(b.dataset.act==='view'){
      var it=state.items.filter(function(x){return x.id===b.dataset.id})[0];
      if(it&&it.images)showImg(it.images[+b.dataset.i]);
    }
  });

  load();resetForm();renderAll();
})();
</script>
</body>
</html>
