<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a7e8c5">
<link rel="manifest" href="manifest.webmanifest">
<script src="pwa.js" defer></script>
<title>Per-Day Cost Calculator</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--txt:#e2e8f0;--sub:#94a3b8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:20px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:var(--sub);font-size:13px;margin-top:0;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
  label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}
  input, select{width:100%;padding:9px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--txt);font-size:14px;}
  input:focus, select:focus{outline:2px solid var(--acc);}
  .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .field{flex:1;min-width:100px;}
  button.add{width:100%;padding:12px;border:none;border-radius:10px;background:var(--acc);color:#052e16;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;}

  .preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .preset-btn{font-size:11px;padding:6px 10px;border-radius:20px;border:1px solid #334155;background:#0f172a;color:var(--sub);cursor:pointer;}
  .preset-btn:hover{border-color:var(--acc);color:var(--acc);}

  .summary{text-align:center;padding:20px 16px;}
  .summary-num{font-size:34px;font-weight:800;color:var(--acc);}
  .summary-label{color:var(--sub);font-size:12px;}
  .stat-row{display:flex;gap:10px;margin-top:14px;}
  .stat{flex:1;text-align:center;background:#0f172a;border-radius:10px;padding:12px;}
  .stat .n{font-size:16px;font-weight:700;}
  .stat .l{font-size:10px;color:var(--sub);margin-top:2px;}

  .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #334155;font-size:13px;}
  .item:last-child{border-bottom:none;}
  .item-name{font-weight:700;}
  .item-meta{font-size:11px;color:var(--sub);}
  .item-perday{font-weight:800;color:var(--acc);}
  .del{background:none;border:none;color:var(--bad);cursor:pointer;font-size:13px;margin-left:8px;}
  .edit{background:none;border:none;color:var(--acc);cursor:pointer;font-size:12px;margin-left:6px;}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📆 Per-Day Cost Calculator</h1>
  <p class="sub">Any recurring consumable — RC, gas, mobile, milk, newspaper — reduced to one number: what it costs you per day.</p>

  <div class="card summary">
    <div class="summary-num" id="totalPerDay">₹0</div>
    <div class="summary-label">Combined Per-Day Cost</div>
    <div class="stat-row">
      <div class="stat"><div class="n" id="totalPerMonth">₹0</div><div class="l">Per Month</div></div>
      <div class="stat"><div class="n" id="totalPerYear">₹0</div><div class="l">Per Year</div></div>
    </div>
  </div>

  <div class="card">
    <label>Add Item</label>
    <div class="preset-row">
      <button class="preset-btn" onclick="quickFill('Mobile RC', 28)">📱 Mobile RC</button>
      <button class="preset-btn" onclick="quickFill('LPG Gas Cylinder', 30)">🔥 Gas Cylinder</button>
      <button class="preset-btn" onclick="quickFill('Broadband/Internet', 30)">📡 Internet</button>
      <button class="preset-btn" onclick="quickFill('Milk Subscription', 1)">🥛 Milk (daily)</button>
      <button class="preset-btn" onclick="quickFill('Newspaper', 1)">📰 Newspaper</button>
      <button class="preset-btn" onclick="quickFill('OTT Subscription', 30)">📺 OTT</button>
    </div>
    <div class="row">
      <div class="field"><label>Item Name</label><input type="text" id="itemName" placeholder="e.g. Jio Mobile RC"></div>
    </div>
    <div class="row">
      <div class="field"><label>Cost (₹)</label><input type="number" id="itemCost" placeholder="e.g. 299"></div>
      <div class="field"><label>Validity (days)</label><input type="number" id="itemDays" placeholder="e.g. 28"></div>
    </div>
    <button class="add" id="addBtn" onclick="addItem()">+ Add Item</button>
  </div>

  <div class="card">
    <label style="font-size:14px;color:var(--txt);font-weight:700;">Your Items</label>
    <div id="itemsList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'perday_cost_items';
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

function quickFill(name, days){
  document.getElementById('itemName').value = name;
  document.getElementById('itemDays').value = days;
  document.getElementById('itemCost').focus();
}

function addItem(){
  const name = document.getElementById('itemName').value.trim();
  const cost = parseFloat(document.getElementById('itemCost').value) || 0;
  const days = parseFloat(document.getElementById('itemDays').value) || 0;

  if(!name || cost<=0 || days<=0) return;

  if(editingId !== null){
    const idx = items.findIndex(i=>i.id===editingId);
    if(idx>-1) items[idx] = { ...items[idx], name, cost, days };
    editingId = null;
    document.getElementById('addBtn').textContent = '+ Add Item';
  } else {
    items.push({ id: Date.now(), name, cost, days });
  }
  save();

  document.getElementById('itemName').value='';
  document.getElementById('itemCost').value='';
  document.getElementById('itemDays').value='';
  document.getElementById('itemName').focus();

  render();
}

function editItem(id){
  const i = items.find(i=>i.id===id);
  if(!i) return;
  document.getElementById('itemName').value = i.name;
  document.getElementById('itemCost').value = i.cost;
  document.getElementById('itemDays').value = i.days;
  editingId = id;
  document.getElementById('addBtn').textContent = '✓ Update Item';
  window.scrollTo({top:0, behavior:'smooth'});
}

function removeItem(id){
  items = items.filter(i=>i.id!==id);
  save();
  render();
}

function render(){
  const container = document.getElementById('itemsList');

  if(items.length===0){
    container.innerHTML = '<div class="empty">No items added yet.</div>';
    document.getElementById('totalPerDay').textContent = '₹0';
    document.getElementById('totalPerMonth').textContent = '₹0';
    document.getElementById('totalPerYear').textContent = '₹0';
    return;
  }

  let totalPerDay = 0;

  container.innerHTML = items.map(i=>{
    const perDay = i.cost / i.days;
    totalPerDay += perDay;
    return `
      <div class="item">
        <span>
          <div class="item-name">${i.name}</div>
          <div class="item-meta">₹${i.cost} every ${i.days} day${i.days>1?'s':''}</div>
        </span>
        <span>
          <span class="item-perday">₹${perDay.toFixed(2)}/day</span>
          <button class="edit" onclick="editItem(${i.id})">Edit</button>
          <button class="del" onclick="removeItem(${i.id})">✕</button>
        </span>
      </div>
    `;
  }).join('');

  document.getElementById('totalPerDay').textContent = '₹' + totalPerDay.toFixed(2);
  document.getElementById('totalPerMonth').textContent = '₹' + (totalPerDay*30).toFixed(0);
  document.getElementById('totalPerYear').textContent = '₹' + (totalPerDay*365).toFixed(0);
}

render();
</script>
</body>
</html>
