<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a7e8c5">
<link rel="manifest" href="manifest.webmanifest">
<script src="pwa.js" defer></script>
<title>Auto-Debit Tracker</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--txt:#e2e8f0;--sub:#94a3b8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:20px;}
  .wrap{max-width:600px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:var(--sub);font-size:13px;margin-top:0;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
  label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}
  input, select{width:100%;padding:9px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--txt);font-size:14px;}
  input[type=date]{color-scheme:dark;}
  input:focus, select:focus{outline:2px solid var(--acc);}
  .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .field{flex:1;min-width:100px;}
  button.add{width:100%;padding:12px;border:none;border-radius:10px;background:var(--acc);color:#052e16;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;}

  .summary{display:flex;gap:10px;}
  .summary .box{flex:1;text-align:center;background:#0f172a;border-radius:10px;padding:14px;}
  .summary .n{font-size:20px;font-weight:800;}
  .summary .l{font-size:11px;color:var(--sub);margin-top:2px;}

  .pay-item{border-bottom:1px solid #334155;padding:12px 0;}
  .pay-item:last-child{border-bottom:none;}
  .pay-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .pay-name{font-weight:700;font-size:14px;}
  .del{background:none;border:none;color:var(--bad);cursor:pointer;font-size:13px;}
  .pay-meta{font-size:12px;color:var(--sub);margin-bottom:4px;}
  .status-badge{font-size:10px;padding:2px 10px;border-radius:10px;font-weight:700;}
  .active-b{background:rgba(34,197,94,.15);color:var(--acc);}
  .due-b{background:rgba(245,158,11,.15);color:var(--warn);}
  .overdue-b{background:rgba(239,68,68,.15);color:var(--bad);}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:20px;}
  .type-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(59,130,246,.15);color:#60a5fa;font-weight:700;margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔁 Auto-Debit Tracker</h1>
  <p class="sub">Every EMI, SIP, insurance premium, and subscription auto-debit — in one place, with due-date alerts.</p>

  <div class="card">
    <div class="summary">
      <div class="box"><div class="n" id="totalCount">0</div><div class="l">Active Debits</div></div>
      <div class="box"><div class="n" id="totalMonthly">₹0</div><div class="l">Monthly Outflow</div></div>
      <div class="box"><div class="n" id="dueSoon" style="color:var(--warn);">0</div><div class="l">Due in 7 Days</div></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field"><label>Payment Name</label><input type="text" id="payName" placeholder="e.g. Home Loan EMI"></div>
      <div class="field"><label>Type</label>
        <select id="payType">
          <option value="EMI">EMI/Loan</option>
          <option value="Insurance">Insurance Premium</option>
          <option value="SIP">SIP/Investment</option>
          <option value="Subscription">Subscription</option>
          <option value="Utility">Utility Bill</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>Amount (₹)</label><input type="number" id="payAmount" placeholder="e.g. 15000"></div>
      <div class="field"><label>Frequency</label>
        <select id="payFreq">
          <option value="1">Monthly</option>
          <option value="3">Quarterly</option>
          <option value="12">Yearly</option>
        </select>
      </div>
      <div class="field"><label>Debited From</label><input type="text" id="payAccount" placeholder="e.g. HDFC a/c"></div>
    </div>
    <div class="row">
      <div class="field"><label>Next Due Date</label><input type="date" id="payDueDate"></div>
    </div>
    <button class="add" id="addBtn" onclick="addPayment()">+ Add Auto-Debit</button>
  </div>

  <div class="card">
    <label style="font-size:14px;color:var(--txt);font-weight:700;">Your Auto-Debits</label>
    <div id="paymentsList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'autodebit_tracker_entries';
let payments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(payments)); }

function addPayment(){
  const name = document.getElementById('payName').value.trim();
  const type = document.getElementById('payType').value;
  const amount = parseFloat(document.getElementById('payAmount').value) || 0;
  const freq = parseFloat(document.getElementById('payFreq').value) || 1;
  const account = document.getElementById('payAccount').value.trim();
  const dueDate = document.getElementById('payDueDate').value;

  if(!name || amount<=0 || !dueDate) return;

  if(editingId !== null){
    const idx = payments.findIndex(p=>p.id===editingId);
    if(idx > -1){
      payments[idx] = { ...payments[idx], name, type, amount, freq, account, dueDate };
    }
    editingId = null;
    document.getElementById('addBtn').textContent = '+ Add Auto-Debit';
  } else {
    payments.push({ id: Date.now(), name, type, amount, freq, account, dueDate });
  }
  save();

  document.getElementById('payName').value='';
  document.getElementById('payAmount').value='';
  document.getElementById('payAccount').value='';
  document.getElementById('payDueDate').value='';

  render();
}

function editPayment(id){
  const p = payments.find(p=>p.id===id);
  if(!p) return;
  document.getElementById('payName').value = p.name;
  document.getElementById('payType').value = p.type;
  document.getElementById('payAmount').value = p.amount;
  document.getElementById('payFreq').value = p.freq;
  document.getElementById('payAccount').value = p.account;
  document.getElementById('payDueDate').value = p.dueDate;
  editingId = id;
  document.getElementById('addBtn').textContent = '✓ Update Auto-Debit';
  window.scrollTo({top:0, behavior:'smooth'});
}

function markDone(id){
  const idx = payments.findIndex(p=>p.id===id);
  if(idx===-1) return;
  const p = payments[idx];
  const current = new Date(p.dueDate);
  current.setMonth(current.getMonth() + parseInt(p.freq));
  const nextDue = current.toISOString().split('T')[0];
  const history = p.history ? [...p.history, p.dueDate] : [p.dueDate];
  payments[idx] = { ...p, lastPaid: p.dueDate, dueDate: nextDue, history };
  save();
  render();
}

function undoDone(id){
  const idx = payments.findIndex(p=>p.id===id);
  if(idx===-1) return;
  const p = payments[idx];
  if(!p.history || p.history.length===0) return;
  const history = [...p.history];
  const prevDue = history.pop();
  payments[idx] = { ...p, dueDate: prevDue, lastPaid: history.length ? history[history.length-1] : undefined, history };
  save();
  render();
}

function removePayment(id){
  payments = payments.filter(p=>p.id!==id);
  save();
  render();
}

function daysUntil(dateStr){
  const target = new Date(dateStr);
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((target - now) / (1000*60*60*24));
}

function render(){
  const container = document.getElementById('paymentsList');

  if(payments.length===0){
    container.innerHTML = '<div class="empty">No auto-debits added yet.</div>';
    document.getElementById('totalCount').textContent = '0';
    document.getElementById('totalMonthly').textContent = '₹0';
    document.getElementById('dueSoon').textContent = '0';
    return;
  }

  let totalMonthly = 0, dueSoonCount = 0;
  const sorted = [...payments].sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));

  container.innerHTML = sorted.map(p=>{
    const days = daysUntil(p.dueDate);
    const monthlyEquiv = p.amount / p.freq;
    totalMonthly += monthlyEquiv;

    let statusClass, statusLabel;
    if(days < 0){ statusClass='overdue-b'; statusLabel=`Overdue ${Math.abs(days)}d`; }
    else if(days <= 7){ statusClass='due-b'; statusLabel = days===0 ? 'Due Today' : `Due in ${days}d`; dueSoonCount++; }
    else { statusClass='active-b'; statusLabel=`Due ${p.dueDate}`; }

    return `
      <div class="pay-item">
        <div class="pay-head">
          <span class="pay-name">${p.name}<span class="type-badge">${p.type}</span></span>
          <span>
            <button class="del" style="color:var(--acc);" onclick="markDone(${p.id})">Mark Done</button>
            ${p.history && p.history.length>0 ? `<button class="del" style="color:var(--warn);" onclick="undoDone(${p.id})">Undo</button>` : ''}
            <button class="del" style="color:var(--acc);" onclick="editPayment(${p.id})">Edit</button>
            <button class="del" onclick="removePayment(${p.id})">✕</button>
          </span>
        </div>
        <div class="pay-meta">₹${p.amount} every ${p.freq==1?'month':p.freq==3?'quarter':'year'}${p.account?` • from ${p.account}`:''} • ~₹${monthlyEquiv.toFixed(0)}/mo${p.lastPaid?` • last paid ${p.lastPaid}`:''}</div>
        <span class="status-badge ${statusClass}">${statusLabel}</span>
      </div>
    `;
  }).join('');

  document.getElementById('totalCount').textContent = payments.length;
  document.getElementById('totalMonthly').textContent = '₹' + totalMonthly.toFixed(0);
  document.getElementById('dueSoon').textContent = dueSoonCount;
}

render();
</script>
</body>
</html>
