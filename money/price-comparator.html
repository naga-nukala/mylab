<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a7e8c5">
<link rel="manifest" href="manifest.webmanifest">
<script src="pwa.js" defer></script>
<title>Price Comparator</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--txt:#e2e8f0;--sub:#94a3b8;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:20px;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:var(--sub);font-size:13px;margin-top:0;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
  label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}
  input, select{width:100%;padding:9px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:var(--txt);font-size:14px;}
  input:focus, select:focus{outline:2px solid var(--acc);}
  .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .field{flex:1;min-width:90px;}
  button.add{width:100%;padding:12px;border:none;border-radius:10px;background:var(--acc);color:#052e16;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;}

  .group{margin-bottom:16px;}
  .group-title{font-size:14px;font-weight:700;margin-bottom:8px;}
  .entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #334155;font-size:13px;}
  .entry:last-child{border-bottom:none;}
  .entry .meta{color:var(--sub);}
  .entry .ppu{font-weight:700;}
  .best{color:var(--acc);}
  .worse{color:var(--bad);}
  .tag{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(34,197,94,.15);color:var(--acc);font-weight:700;margin-left:6px;}
  .edit{background:none;border:none;color:var(--acc);cursor:pointer;font-size:12px;margin-left:8px;}
  .del{background:none;border:none;color:var(--bad);cursor:pointer;font-size:13px;margin-left:6px;}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:20px;}
  .clear-btn{background:none;border:none;color:var(--bad);font-size:12px;cursor:pointer;float:right;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#334155;color:var(--txt);padding:10px 18px;border-radius:20px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:100;white-space:nowrap;display:none;}
  .del.confirming{background:var(--bad);color:#fff;border-radius:6px;padding:2px 6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 Price Comparator</h1>
  <p class="sub">Compare any item across DMart, Reliance, or other stores by price-per-unit. Saved automatically for next time.</p>

  <div class="card">
    <div class="row">
      <div class="field"><label>Item Name</label><input type="text" id="itemName" placeholder="e.g. Toor Dal"></div>
      <div class="field"><label>Store</label><input type="text" id="store" placeholder="e.g. DMart"></div>
    </div>
    <div class="row">
      <div class="field"><label>Price (₹)</label><input type="number" id="price" placeholder="e.g. 150"></div>
      <div class="field"><label>Quantity</label><input type="number" id="qty" placeholder="e.g. 1"></div>
      <div class="field">
        <label>Unit</label>
        <select id="unit">
          <option value="g">grams (g)</option>
          <option value="kg">kilograms (kg)</option>
          <option value="ml">millilitres (ml)</option>
          <option value="l">litres (l)</option>
          <option value="pcs">pieces</option>
        </select>
      </div>
    </div>
    <button class="add" id="addBtn" onclick="addEntry()">+ Add Price</button>
  </div>

  <div class="card">
    <label style="font-size:14px;color:var(--txt);font-weight:700;">Saved Comparisons <button class="clear-btn" onclick="clearAll()">Clear All</button></label>
    <div id="groupsContainer"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'price_comparator_entries';
let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;
let pendingDeletes = {};

function fmt(n){ return '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:2}); }

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2000);
}

function confirmDelete(key, btn, action){
  if(pendingDeletes[key]){
    clearTimeout(pendingDeletes[key]);
    delete pendingDeletes[key];
    action();
    return;
  }
  if(btn){ btn.textContent = '✔'; btn.classList.add('confirming'); }
  showToast('Tap ✕ again to confirm delete');
  pendingDeletes[key] = setTimeout(() => {
    delete pendingDeletes[key];
    if(btn){ btn.textContent = '✕'; btn.classList.remove('confirming'); }
  }, 2500);
}

function toBaseUnit(qty, unit){
  if(unit==='kg') return { baseQty: qty*1000, label:'g' };
  if(unit==='l') return { baseQty: qty*1000, label:'ml' };
  return { baseQty: qty, label: unit };
}

function clearForm(){
  document.getElementById('itemName').value='';
  document.getElementById('store').value='';
  document.getElementById('price').value='';
  document.getElementById('qty').value='';
  document.getElementById('unit').value='g';
}

function addEntry(){
  const name = document.getElementById('itemName').value.trim();
  const store = document.getElementById('store').value.trim() || 'Unknown';
  const price = parseFloat(document.getElementById('price').value) || 0;
  const qty = parseFloat(document.getElementById('qty').value) || 0;
  const unit = document.getElementById('unit').value;

  if(!name || price<=0 || qty<=0) return;

  const { baseQty, label } = toBaseUnit(qty, unit);
  const ppu = price / baseQty;

  if(editingId){
    const idx = entries.findIndex(e=>e.id===editingId);
    if(idx>-1) entries[idx] = { ...entries[idx], name, store, price, qty, unit, ppu, unitLabel: label };
    editingId = null;
    document.getElementById('addBtn').textContent = '+ Add Price';
  } else {
    entries.push({ id: Date.now(), name, store, price, qty, unit, ppu, unitLabel: label });
  }
  save();

  clearForm();
  document.getElementById('itemName').focus();

  render();
}

function editEntry(id){
  const e = entries.find(e=>e.id===id);
  if(!e) return;
  document.getElementById('itemName').value = e.name;
  document.getElementById('store').value = e.store;
  document.getElementById('price').value = e.price;
  document.getElementById('qty').value = e.qty;
  document.getElementById('unit').value = e.unit;
  editingId = id;
  document.getElementById('addBtn').textContent = '✓ Update Price';
  window.scrollTo({top:0, behavior:'smooth'});
}

function removeEntry(id, btn){
  confirmDelete('entry-'+id, btn, () => {
    entries = entries.filter(e=>e.id!==id);
    save();
    render();
    showToast('Entry deleted');
  });
}

function clearAll(){
  confirmDelete('all', null, () => {
    entries = [];
    save();
    render();
    showToast('All entries cleared');
  });
}

function render(){
  const container = document.getElementById('groupsContainer');
  if(entries.length===0){
    container.innerHTML = '<div class="empty">No items saved yet. Add your first price above.</div>';
    return;
  }

  const groups = {};
  entries.forEach(e=>{
    const key = e.name.toLowerCase().trim();
    if(!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  container.innerHTML = Object.keys(groups).sort().map(key=>{
    const list = groups[key].sort((a,b)=>a.ppu-b.ppu);
    const displayName = list[0].name;
    const minPpu = list[0].ppu;
    const rows = list.map((e,i)=>{
      const isBest = i===0 && list.length>1;
      const pctMore = minPpu>0 ? ((e.ppu-minPpu)/minPpu)*100 : 0;
      return `
        <div class="entry">
          <span>${e.store} <span class="meta">— ${fmt(e.price)} / ${e.qty}${e.unit}</span>${isBest?'<span class="tag">CHEAPEST</span>':''}</span>
          <span>
            <span class="ppu ${i===0?'best':(pctMore>15?'worse':'')}">₹${e.ppu.toLocaleString('en-IN',{maximumFractionDigits:3})}/${e.unitLabel}</span>
            <button class="edit" onclick="editEntry(${e.id})">Edit</button>
            <button class="del" onclick="removeEntry(${e.id}, this)">✕</button>
          </span>
        </div>
      `;
    }).join('');
    return `<div class="group"><div class="group-title">${displayName}</div>${rows}</div>`;
  }).join('');
}

render();
</script>
</body>
</html>
