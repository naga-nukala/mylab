<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1412">
<title>Household Items</title>
<style>
:root{--bg:#0f1412;--card:#172019;--card2:#1d2921;--line:#2a3a2f;--text:#e8f1ec;--muted:#8fa399;--mint:#a7e8c5;--coral:#ff8c70;--amber:#f2c66d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.sum{grid-template-columns:repeat(4,1fr)}}
.sum div{background:var(--card2);border-radius:10px;padding:10px}
.sum b{display:block;font-size:17px;color:var(--mint)}
.sum span{font-size:12px;color:var(--muted)}
.sum .warn b{color:var(--coral)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0f1612;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--mint);outline-offset:0}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font-size:15px;margin:0 0 4px;color:var(--mint)}
h3{font-size:13px;margin:16px 0 6px;color:var(--text)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:9px;padding:9px 12px;font-size:14px}
button.pri{background:var(--mint);color:#0b1a12;border-color:var(--mint);font-weight:600}
button.del{color:var(--coral);border-color:#5a3329}
button.armed{background:var(--coral);color:#1a0b06;border-color:var(--coral)}
button.sm{padding:6px 10px;font-size:13px}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media(hover:hover) and (pointer:fine){button:hover{border-color:var(--mint)}button.pri:hover{filter:brightness(1.08)}}
.rep{display:grid;grid-template-columns:130px 1fr 36px;gap:8px;margin-bottom:8px;align-items:start}
.rep .full{grid-column:1/-1}
.rep .x{padding:9px 0}
@media(max-width:480px){.rep{grid-template-columns:1fr 1fr 36px}.rep .full{grid-column:1/3}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.ph{position:relative;background:var(--card2);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;background:#0f1612}
.ph small{display:block;font-size:11px;color:var(--muted);padding:3px 6px}
.ph .px{position:absolute;top:4px;right:4px;padding:2px 8px;font-size:13px;background:rgba(15,20,18,.85)}
.pickrow{display:flex;gap:8px;align-items:center}
.pickrow select{flex:1}
.file{display:none}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .pri{flex:1}
.bar{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.item header{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.item header .t{flex:1;min-width:0}
.item header b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item header span{font-size:12px;color:var(--muted)}
.item header .p{text-align:right;font-weight:600;color:var(--mint);white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin-top:4px}
.badge.ok{color:var(--mint);border-color:#2f5a44}
.badge.soon{color:var(--amber);border-color:#6a5a2c}
.badge.exp{color:var(--coral);border-color:#6a3a2c}
.body{padding:0 14px 14px;border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv span:first-child{color:var(--muted)}
.rl{font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.rl small{color:var(--muted);display:block}
.empty{color:var(--muted);text-align:center;padding:24px 10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--mint);color:#0b1a12;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:60;padding:12px}
#lb.show{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Household items</h1>
  <p class="sub">Purchases, repairs, warranty and bills. Stays on this device.</p>

  <div class="card">
    <div class="sum" id="sum"></div>
  </div>

  <div class="card" id="formCard">
    <h2 id="formTitle">Add item</h2>
    <label for="f-name">Item</label>
    <input id="f-name" data-role="name" placeholder="e.g. Samsung fridge" autocomplete="off">
    <div class="row">
      <div>
        <label for="f-cat">Category</label>
        <input id="f-cat" data-role="cat" list="cats" placeholder="Appliance" autocomplete="off">
        <datalist id="cats"><option>Appliance</option><option>Electronics</option><option>Furniture</option><option>Kitchen</option><option>Vehicle</option><option>Tools</option><option>Other</option></datalist>
      </div>
      <div>
        <label for="f-year">Year bought</label>
        <input id="f-year" data-role="year" type="number" inputmode="numeric" placeholder="2024" min="1950" max="2100">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="f-price">Price (₹)</label>
        <input id="f-price" data-role="price" type="number" inputmode="decimal" placeholder="0" min="0">
      </div>
      <div>
        <label for="f-wend">Warranty valid till</label>
        <input id="f-wend" data-role="wend" type="date">
      </div>
    </div>
    <label for="f-wnote">Warranty details</label>
    <input id="f-wnote" data-role="wnote" placeholder="Brand, terms, service number" autocomplete="off">
    <label for="f-notes">Notes</label>
    <textarea id="f-notes" data-role="notes" placeholder="Model no, serial no, store"></textarea>

    <h3>Repairs and wear &amp; tear</h3>
    <div id="repairs"></div>
    <button type="button" class="sm" data-action="add-repair">+ Repair</button>

    <h3>Photos and bills</h3>
    <div class="pickrow">
      <select id="f-kind" aria-label="Photo type">
        <option>Bill</option><option>Warranty</option><option>Item</option><option>Other</option>
      </select>
      <button type="button" data-action="pick">Add photos</button>
    </div>
    <input class="file" id="file" type="file" accept="image/*" multiple>
    <div class="photos" id="dphotos"></div>

    <div class="actions">
      <button type="button" class="pri" id="saveBtn" data-action="save">Add item</button>
      <button type="button" id="cancelBtn" data-action="cancel" style="display:none">Cancel</button>
    </div>
  </div>

  <div class="bar">
    <input id="q" type="search" placeholder="Search items" aria-label="Search items">
    <select id="sort" aria-label="Sort">
      <option value="new">Recently added</option>
      <option value="name">Name</option>
      <option value="year">Year bought</option>
      <option value="price">Price</option>
      <option value="warranty">Warranty ending</option>
    </select>
  </div>
  <div id="list"></div>
</div>
<div id="toast" role="status"></div>
<div id="lb" data-action="closelb"><img alt=""></div>

<script>
(function(){
'use strict';
var KEY='as_household_v1';
var KINDS=['Bill','Warranty','Item','Other'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var state={items:[]};
var draft=null, editingId=null, openIds={}, urlCache={};
var $=function(id){return document.getElementById(id)};

/* ---------- helpers ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){return '₹'+(Number(n)||0).toLocaleString('en-IN')}
function fmtDate(iso){
  if(!iso)return '';
  var p=iso.split('-'); if(p.length<3)return iso;
  return ('0'+parseInt(p[2],10)).slice(-2)+'th '+MON[parseInt(p[1],10)-1]+' '+p[0];
}
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show')},2200);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Could not save. Storage is full or blocked.')}}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.items))state=s}catch(e){}
}
function blankDraft(){return {name:'',cat:'',year:'',price:'',wend:'',wnote:'',notes:'',repairs:[],photos:[],added:[],removed:[]}}

/* tap-twice confirm */
var armed={};
function tapTwice(btn,key,label,fn){
  if(armed[key]){clearTimeout(armed[key].t);btn.classList.remove('armed');btn.textContent=armed[key].orig;delete armed[key];fn();return}
  armed[key]={orig:btn.textContent,t:setTimeout(function(){btn.classList.remove('armed');btn.textContent=armed[key].orig;delete armed[key]},3000)};
  btn.classList.add('armed');btn.textContent=label;
}

/* ---------- IndexedDB for photos ---------- */
var dbp=null;
function idb(){
  if(dbp)return dbp;
  dbp=new Promise(function(res,rej){
    try{
      var r=indexedDB.open('lab_household',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('photos')};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
  return dbp;
}
function tx(mode,fn){
  return idb().then(function(db){return new Promise(function(res,rej){
    var t=db.transaction('photos',mode),s=t.objectStore('photos'),req=fn(s);
    t.oncomplete=function(){res(req&&req.result)};
    t.onerror=function(){rej(t.error)};
  })});
}
function putPhoto(id,blob){return tx('readwrite',function(s){return s.put(blob,id)})}
function getPhoto(id){return tx('readonly',function(s){return s.get(id)})}
function delPhoto(id){
  if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id]}
  return tx('readwrite',function(s){return s.delete(id)}).catch(function(){});
}
function photoUrl(id){
  if(urlCache[id])return Promise.resolve(urlCache[id]);
  return getPhoto(id).then(function(b){if(!b)return '';urlCache[id]=URL.createObjectURL(b);return urlCache[id]});
}
function hydrate(root){
  root.querySelectorAll('img[data-pid]').forEach(function(img){
    if(img.getAttribute('src'))return;
    photoUrl(img.dataset.pid).then(function(u){if(u)img.src=u}).catch(function(){});
  });
}
function compress(file){
  return new Promise(function(res){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var max=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function(b){res(b||file)},'image/jpeg',0.75);
    };
    img.onerror=function(){URL.revokeObjectURL(u);res(file)};
    img.src=u;
  });
}

/* ---------- warranty ---------- */
function wStatus(it){
  if(!it.wend)return null;
  var today=new Date();today.setHours(0,0,0,0);
  var d=Math.ceil((new Date(it.wend+'T00:00:00')-today)/864e5);
  if(d<0)return {c:'exp',t:'Warranty ended '+fmtDate(it.wend),d:d};
  if(d<=60)return {c:'soon',t:'Warranty ends in '+d+' day'+(d===1?'':'s'),d:d};
  return {c:'ok',t:'Warranty till '+fmtDate(it.wend),d:d};
}
function repairTotal(it){return (it.repairs||[]).reduce(function(a,r){return a+(Number(r.price)||0)},0)}

/* ---------- summary ---------- */
function renderSummary(){
  var n=state.items.length,spent=0,rep=0,inW=0,soon=0;
  state.items.forEach(function(it){
    spent+=Number(it.price)||0;rep+=repairTotal(it);
    var w=wStatus(it);if(w&&w.d>=0){inW++;if(w.c==='soon')soon++}
  });
  $('sum').innerHTML=
    '<div><b>'+n+'</b><span>Items</span></div>'+
    '<div><b>'+inr(spent)+'</b><span>Bought for</span></div>'+
    '<div><b>'+inr(rep)+'</b><span>Spent on repairs</span></div>'+
    '<div'+(soon?' class="warn"':'')+'><b>'+inW+'</b><span>In warranty'+(soon?' ('+soon+' ending soon)':'')+'</span></div>';
}

/* ---------- list ---------- */
function cardHTML(it){
  var w=wStatus(it),open=!!openIds[it.id],rt=repairTotal(it);
  var sub=[it.cat,it.year?('Bought '+it.year):''].filter(Boolean).join(' · ');
  var h='<div class="item" data-id="'+it.id+'"><header data-action="toggle" data-id="'+it.id+'"><div class="t"><b>'+esc(it.name)+'</b><span>'+esc(sub)+'</span>'+
    (w?'<br><span class="badge '+w.c+'">'+esc(w.t)+'</span>':'')+'</div><div class="p">'+(it.price?inr(it.price):'')+'</div></header>';
  if(open){
    h+='<div class="body">';
    h+='<div class="kv"><span>Price</span><span>'+inr(it.price)+'</span></div>';
    if(it.year)h+='<div class="kv"><span>Year bought</span><span>'+esc(it.year)+'</span></div>';
    h+='<div class="kv"><span>Repairs ('+(it.repairs||[]).length+')</span><span>'+inr(rt)+'</span></div>';
    h+='<div class="kv"><span>Total cost so far</span><span>'+inr((Number(it.price)||0)+rt)+'</span></div>';
    if(it.wend)h+='<div class="kv"><span>Warranty till</span><span>'+fmtDate(it.wend)+'</span></div>';
    if(it.wnote)h+='<div class="kv"><span>Warranty details</span><span>'+esc(it.wnote)+'</span></div>';
    if(it.notes)h+='<div class="kv"><span>Notes</span><span style="text-align:right">'+esc(it.notes)+'</span></div>';
    if((it.repairs||[]).length){
      h+='<h3>Repairs</h3>';
      it.repairs.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')}).forEach(function(r){
        h+='<div class="rl"><div>'+(r.date?fmtDate(r.date):'No date')+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</div><div>'+inr(r.price)+'</div></div>';
      });
    }
    if((it.photos||[]).length){
      h+='<h3>Photos and bills</h3><div class="photos">';
      it.photos.forEach(function(p){
        h+='<div class="ph"><img data-action="view" data-pid="'+p.id+'" alt="'+esc(p.kind)+'"><small>'+esc(p.kind)+'</small></div>';
      });
      h+='</div>';
    }
    h+='<div class="actions"><button class="sm" data-action="edit" data-id="'+it.id+'">Edit</button><button class="sm del" data-action="del" data-id="'+it.id+'">Delete</button></div></div>';
  }
  return h+'</div>';
}
function renderList(){
  var q=$('q').value.trim().toLowerCase(),s=$('sort').value;
  var arr=state.items.filter(function(it){
    if(!q)return true;
    return [it.name,it.cat,it.year,it.notes,it.wnote].join(' ').toLowerCase().indexOf(q)>-1;
  });
  var cmp={
    name:function(a,b){return a.name.localeCompare(b.name)},
    year:function(a,b){return (Number(b.year)||0)-(Number(a.year)||0)},
    price:function(a,b){return (Number(b.price)||0)-(Number(a.price)||0)},
    warranty:function(a,b){return (a.wend||'9999').localeCompare(b.wend||'9999')}
  }[s];
  if(cmp)arr.sort(cmp);
  $('list').innerHTML=arr.length?arr.map(cardHTML).join(''):'<div class="empty">'+(state.items.length?'No items match your search.':'No items yet. Add your first item above.')+'</div>';
  hydrate($('list'));
}
function renderAll(){renderSummary();renderList()}

/* ---------- form ---------- */
function fillForm(){
  ['name','cat','year','price','wend','wnote','notes'].forEach(function(k){
    var el=document.querySelector('[data-role="'+k+'"]');if(el)el.value=draft[k]||'';
  });
  renderRepairs();renderDraftPhotos();
  $('formTitle').textContent=editingId?'Edit item':'Add item';
  $('saveBtn').textContent=editingId?'Update item':'Add item';
  $('cancelBtn').style.display=editingId?'':'none';
}
function renderRepairs(){
  $('repairs').innerHTML=draft.repairs.map(function(r,i){
    return '<div class="rep" data-index="'+i+'">'+
      '<input type="date" data-role="r-date" data-index="'+i+'" value="'+esc(r.date)+'" aria-label="Repair date">'+
      '<input type="number" inputmode="decimal" min="0" data-role="r-price" data-index="'+i+'" value="'+esc(r.price)+'" placeholder="Cost ₹" aria-label="Repair cost">'+
      '<button type="button" class="x sm del" data-action="rm-repair" data-index="'+i+'" aria-label="Remove repair">✕</button>'+
      '<input class="full" data-role="r-note" data-index="'+i+'" value="'+esc(r.note)+'" placeholder="What was repaired" aria-label="Repair note"></div>';
  }).join('');
}
function renderDraftPhotos(){
  $('dphotos').innerHTML=draft.photos.map(function(p){
    return '<div class="ph"><img data-action="view" data-pid="'+p.id+'" alt="'+esc(p.kind)+'"><button type="button" class="px sm del" data-action="rm-photo" data-pid="'+p.id+'" aria-label="Remove photo">✕</button><small>'+esc(p.kind)+'</small></div>';
  }).join('');
  hydrate($('dphotos'));
}
function resetForm(){draft=blankDraft();editingId=null;fillForm()}

function cancelEdit(){
  // discard photos added during this edit session
  draft.added.forEach(function(id){delPhoto(id)});
  resetForm();
}

function saveItem(){
  var name=draft.name.trim();
  if(!name){toast('Enter the item name');$('f-name').focus();return}
  var repairs=draft.repairs.filter(function(r){return r.date||r.price||r.note}).map(function(r){return {date:r.date,price:r.price,note:r.note.trim()}});
  var item={
    id:editingId||uid(),name:name,cat:draft.cat.trim(),year:draft.year,price:draft.price,
    wend:draft.wend,wnote:draft.wnote.trim(),notes:draft.notes.trim(),repairs:repairs,photos:draft.photos.slice()
  };
  draft.removed.forEach(function(id){delPhoto(id)});
  if(editingId){
    state.items=state.items.map(function(x){return x.id===editingId?item:x});
    toast('Item updated');
  }else{
    state.items.unshift(item);toast('Item added');
  }
  save();resetForm();renderAll();
}

/* ---------- events ---------- */
document.addEventListener('input',function(e){
  var el=e.target,role=el.dataset&&el.dataset.role;
  if(role){
    if(role.indexOf('r-')===0){
      var r=draft.repairs[+el.dataset.index];if(!r)return;
      r[role.slice(2)]=el.value;
    }else draft[role]=el.value;
    return;
  }
  if(el.id==='q'||el.id==='sort')renderList();
});
$('sort').addEventListener('change',renderList);

$('file').addEventListener('change',function(){
  var files=Array.prototype.slice.call(this.files),kind=$('f-kind').value,self=this;
  if(!files.length)return;
  toast('Adding '+files.length+' photo'+(files.length>1?'s':'')+'…');
  files.reduce(function(chain,f){
    return chain.then(function(){
      return compress(f).then(function(b){
        var id=uid();
        return putPhoto(id,b).then(function(){draft.photos.push({id:id,kind:kind});draft.added.push(id)});
      });
    });
  },Promise.resolve()).then(function(){
    renderDraftPhotos();toast('Photos added. Save the item to keep them.');
  }).catch(function(){toast('Could not store photos in this browser')}).then(function(){self.value=''});
});

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]');if(!t)return;
  var a=t.dataset.action,id=t.dataset.id;
  if(a==='closelb'||(a==='view'&&false)){$('lb').classList.remove('show');return}
  if(a==='view'){
    if(!t.src)return;
    $('lb').querySelector('img').src=t.src;$('lb').classList.add('show');return;
  }
  if(a==='pick'){$('file').click();return}
  if(a==='add-repair'){draft.repairs.push({date:'',price:'',note:''});renderRepairs();return}
  if(a==='rm-repair'){draft.repairs.splice(+t.dataset.index,1);renderRepairs();return}
  if(a==='rm-photo'){
    var pid=t.dataset.pid;
    tapTwice(t,'ph'+pid,'Sure?',function(){
      draft.photos=draft.photos.filter(function(p){return p.id!==pid});
      if(draft.added.indexOf(pid)>-1){draft.added=draft.added.filter(function(x){return x!==pid});delPhoto(pid)}
      else draft.removed.push(pid);
      renderDraftPhotos();toast('Photo removed. Save to apply.');
    });return;
  }
  if(a==='save'){saveItem();return}
  if(a==='cancel'){cancelEdit();return}
  if(a==='toggle'){
    openIds[id]?delete openIds[id]:openIds[id]=1;renderList();return;
  }
  if(a==='edit'){
    var it=state.items.filter(function(x){return x.id===id})[0];if(!it)return;
    if(editingId||draft.added.length)cancelEdit();
    editingId=id;
    draft={name:it.name,cat:it.cat||'',year:it.year||'',price:it.price||'',wend:it.wend||'',wnote:it.wnote||'',notes:it.notes||'',
      repairs:(it.repairs||[]).map(function(r){return {date:r.date||'',price:r.price||'',note:r.note||''}}),
      photos:(it.photos||[]).slice(),added:[],removed:[]};
    fillForm();$('formCard').scrollIntoView({behavior:'smooth',block:'start'});return;
  }
  if(a==='del'){
    tapTwice(t,'del'+id,'Tap again to delete',function(){
      var it=state.items.filter(function(x){return x.id===id})[0];
      if(it)(it.photos||[]).forEach(function(p){delPhoto(p.id)});
      state.items=state.items.filter(function(x){return x.id!==id});
      if(editingId===id)resetForm();
      save();renderAll();toast('Item deleted');
    });return;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('lb').classList.remove('show')});

/* ---------- init ---------- */
load();draft=blankDraft();fillForm();renderAll();
})();
</script>
</body>
